<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Board</title>
<meta name="description" content="Organize every job, track expenses, purchases, photos and crew hours, and see the real profit on each job.">
<meta name="theme-color" content="#e9f0fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blue Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#f6f6f7;--surface:#ffffff;--surface2:#f3f4f6;--surface3:#e9ebee;--ink:#16191d;--muted:#5f6873;
  --line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);
  --hi:#1f63c6;--hi-dk:#164a94;--hi-ink:#fff;--hi-soft:rgba(31,99,198,.10);--glow:rgba(31,99,198,.28);
  --top-solid:#fff;--nav-float:rgba(255,255,255,.94);--bar:#3b424b;--ph:#9aa1aa;
  --good:#1565c0;--good-bg:#e8f1fd;--bad:#c42b2b;--bad-bg:#fdeceb;--warn:#9a5b00;--warn-bg:#fff4dc;
  --nav:rgba(255,255,255,.88);--nav-ink:#16191d;--nav-muted:#5f6873;
  --r:20px;--r-sm:12px;--ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0c0e11;--surface:#15181c;--surface2:#1c2025;--surface3:#262b32;--ink:#eef0f3;--muted:#98a1ac;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --good:#6aaeff;--good-bg:rgba(106,174,255,.13);--bad:#ff7a7a;--bad-bg:rgba(255,92,92,.12);--warn:#f2b44c;--warn-bg:rgba(242,180,76,.12);
  --nav:rgba(12,14,17,.82);--nav-ink:#eef0f3;--nav-muted:#98a1ac;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.32);
  --top-solid:#0c0e11;--nav-float:rgba(21,24,28,.92);--bar:#c9d0d8;--ph:#6d7680;color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(1100px 420px at 0% -8%,color-mix(in srgb,var(--hi) 7%,transparent),transparent 62%),var(--bg);
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
img{max-width:100%}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,a,input,select,textarea{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);color:var(--nav-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:2px solid var(--hi);box-shadow:0 6px 20px rgba(16,24,40,.06)}
.menu-wrap{position:relative;flex:none}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--surface3);border-color:var(--line2)}
.icon-btn svg{width:22px;height:22px}
.menu{position:absolute;top:calc(100% + 12px);left:0;width:260px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 50px rgba(16,24,40,.16);padding:8px;z-index:50;
  transform-origin:top left;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu .who{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;text-decoration:none;border-radius:12px 12px 0 0}
.menu .who b{display:block;font-size:15px}
.menu .who small{display:block;color:var(--muted);font-size:13px}
.menu a.item,.menu button.item{display:flex;width:100%;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font:inherit;font-weight:600;background:none;border:0;cursor:pointer;text-align:left}
.menu .item:hover,.menu .item[aria-current="page"]{background:var(--surface2)}
.menu .item[aria-current="page"]{box-shadow:inset 3px 0 0 var(--hi)}
.menu .item svg{width:19px;height:19px;color:var(--muted);flex:none}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--hi),var(--hi-dk));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 4px 14px var(--glow)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;text-decoration:none;min-width:0;margin-right:6px}
.brand svg{flex:none;filter:drop-shadow(0 2px 8px var(--glow))}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal;color:var(--hi)}
.nav{display:contents}
.nav a{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;color:var(--nav-muted);text-decoration:none;font-weight:650;font-size:14px;white-space:nowrap}
.nav a svg{width:19px;height:19px}
.nav a.co-name{flex:1;justify-content:center;min-width:0;color:var(--ink);font-weight:800;font-size:16px;letter-spacing:-.01em;gap:10px;background:none;box-shadow:none;padding:6px 14px}
.nav a.co-name:hover{background:none!important;color:var(--hi)}
.nav a.co-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-name img,.co-top img{height:30px;width:auto;max-width:96px;object-fit:contain;border-radius:6px;flex:none}
.co-name.co-empty,.co-top.co-empty{color:var(--muted)!important;font-weight:600!important;font-size:13px!important}
.co-top{display:none}
.nav a[aria-current="page"]{color:#fff;background:linear-gradient(180deg,var(--hi),var(--hi-dk));box-shadow:0 6px 18px -4px var(--glow)}
.nav a:hover:not([aria-current="page"]){color:var(--nav-ink);background:var(--surface2)}
@media (max-width:820px){
  .nav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--nav-float);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    justify-content:space-around;gap:0;padding:6px;border:1px solid var(--line2);border-radius:22px;box-shadow:0 10px 30px rgba(16,24,40,.16);z-index:30}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;flex:1;justify-content:center;border-radius:16px}
  .top{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--top-solid)}
  .nav a.co-name{display:none}
  .co-top{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;font-weight:800;font-size:15px;text-decoration:none;color:var(--ink)}
  .co-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-top img{height:26px}
  .top.has-co .brand span{display:none}
  .nav a[aria-current="page"]{background:var(--hi-soft);color:var(--hi);box-shadow:none}
  .brand{font-size:16px}
}
@media (min-width:821px){body{padding-bottom:48px}}

main{max-width:1180px;margin:0 auto;padding:24px 16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head .sub{color:var(--muted);margin-top:5px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* Buttons + inputs */
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:inherit;font-weight:650;font-size:14px;
  padding:9px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--hi),var(--hi-dk));border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--surface3);border-color:var(--line2)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:#c42b2b;border-color:#c62828;color:#fff}
.btn.sm{padding:5px 12px;font-size:13px;min-height:32px}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;width:100%;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px var(--hi-soft)}
textarea{min-height:96px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
label.check input{width:20px;height:20px;min-height:0;accent-color:var(--hi)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .full{grid-column:1/-1}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields.times{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px!important}
@media (max-width:560px){.fields,.fields.three{grid-template-columns:minmax(0,1fr)}.fields.three.keep{grid-template-columns:repeat(3,minmax(0,1fr))}}
fieldset{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0;background:var(--surface2)}
legend{font-size:13px;font-weight:700;padding:0 6px;color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:650;padding:7px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--hi)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:27px;font-weight:800;margin-top:6px;line-height:1.1;letter-spacing:-.02em}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.kpi.lead{background:radial-gradient(240px 120px at 0% 0%,color-mix(in srgb,var(--hi) 10%,transparent),transparent 70%),var(--surface);border-color:color-mix(in srgb,var(--hi) 38%,transparent)}
.kpi.lead::before{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--hi),transparent)}

/* Tables */
.table-wrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.click:hover td:first-child{border-radius:12px 0 0 12px}
tr.click:hover td:last-child{border-radius:0 12px 12px 0}
tfoot td{font-weight:750;border-bottom:0;border-top:1px solid var(--line2)}

.badge{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface3);color:var(--muted);white-space:nowrap}
.badge.active{background:var(--warn-bg);color:var(--warn)}
.badge.done{background:var(--good-bg);color:var(--good)}

/* Bars */
.bar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:999px}
.bar i.over{background:linear-gradient(90deg,#9b1c1c,var(--bad))}
.bar i.ok{background:linear-gradient(90deg,#1e4fa3,var(--good))}
.mbar{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:14px;min-width:120px}
.mbar .l{display:flex;justify-content:flex-end;border-right:1px solid var(--line2);height:100%;align-items:center}
.mbar .r{display:flex;height:100%;align-items:center}
.mbar i{display:block;height:10px}
.mbar .l i{background:var(--bad);border-radius:999px 0 0 999px}
.mbar .r i{background:var(--good);border-radius:0 999px 999px 0}

/* Job cards */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.job{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 20px;box-shadow:var(--shadow);overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--jc,var(--line2))}
.job:hover{border-color:var(--line2);transform:translateY(-2px)}
.job .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.job .t b{font-size:16px}
.job .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.job .row span{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input{max-width:280px;border-radius:999px;padding-left:16px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);border-radius:12px}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .grow small{display:block;color:var(--muted);font-size:13px}
.list li.click{cursor:pointer}
.list li.click:hover{background:var(--surface2)}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--surface3);flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface2);border:0;border-radius:var(--r)}
.empty .btns{justify-content:center;margin-top:14px}
.insight{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:14px;align-items:flex-start}
.insight.warn{background:var(--warn-bg)}
.insight.bad{background:var(--bad-bg);box-shadow:inset 3px 0 0 var(--bad)}
.insight.good{background:var(--good-bg)}
.insight b{white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos button{appearance:none;border:0;padding:0;background:var(--surface3);border-radius:14px;overflow:hidden;aspect-ratio:1;cursor:pointer;position:relative}
.photos button:hover{transform:scale(1.02)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos small{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;padding:14px 8px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer img{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:14px}

/* Schedule */
.week-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sched{min-width:900px;table-layout:fixed;border-collapse:separate;border-spacing:0}
.sched th,.sched td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:8px}
.sched tr>*:last-child{border-right:0}
.sched tbody tr:last-child td{border-bottom:1px solid var(--line2)}
.sched th{background:none;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line2)}
.sched th.today{color:var(--hi)}
.sched th.today::after{content:"";display:block;height:2px;border-radius:2px;background:var(--hi);margin-top:6px;width:24px}
.sched td.today{background:color-mix(in srgb,var(--hi) 5%,transparent)}
.sched th:first-child,.sched td:first-child{width:150px}
.sched tfoot td{border-top:0}
.emp-cell{display:flex;gap:8px;align-items:flex-start}
.emp-cell small{display:block;color:var(--muted);font-size:12px}
.chip{display:block;width:100%;text-align:left;appearance:none;font:inherit;font-size:12px;line-height:1.35;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px 6px 10px;margin-bottom:5px;cursor:pointer;position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--jc,var(--muted))}
.chip:hover{background:var(--surface3)}
.chip b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.scheduled{border-color:var(--line2);background:transparent}
.chip.missed{opacity:.5;text-decoration:line-through}
.add-cell{appearance:none;width:100%;border:1px solid transparent;background:none;color:var(--muted);border-radius:10px;font-size:18px;line-height:1;padding:5px;cursor:pointer}
td:hover .add-cell{border-color:var(--line2);color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend .chip{display:inline-block;width:auto;margin:0;padding:3px 10px 3px 12px}

.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.cal-title{font-size:21px;font-weight:800;letter-spacing:-.02em}
.cal-title span{color:var(--muted);font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-wd{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0 6px}
.cal-day{appearance:none;border:1px solid transparent;background:var(--surface2);border-radius:14px;min-height:98px;padding:7px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;
  display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.cal-day:hover{background:var(--surface3)}
.cal-day.out{background:transparent;color:var(--muted)}
.cal-day.out .cal-jobs{opacity:.5}
.cal-day.wkend:not(.out){background:color-mix(in srgb,var(--surface2) 55%,var(--surface))}
.cal-num{font-size:13px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex:none}
.cal-day.today .cal-num{background:var(--hi);color:#fff;box-shadow:0 4px 10px -2px var(--glow)}
.cal-day.sel{border-color:var(--hi);background:var(--surface);box-shadow:0 0 0 3px var(--hi-soft)}

/* layout: menu left · brand · Schedule · company (center) · Jobs, Crew & Pay, Profit (right) */

.brand{order:1}

<body>
<header class="top">
  <div class="menu-wrap">
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="menu" id="menu" hidden>
      <a class="who" href="#/profile" id="menu-who"></a>
      <div id="menu-items"></div>
    </div>
  </div>
  <a class="brand" href="#/schedule" aria-label="Blue Board home">
    <svg width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#16191d"/><rect x="15" y="12" width="34" height="42" rx="6" fill="none" style="stroke:var(--hi)" stroke-width="4"/><rect x="24" y="7" width="16" height="10" rx="4" style="fill:var(--hi)"/><path d="M22 42l7-8 6 5 9-11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Blue <em>Board</em></span>
  </a>
  <a class="co-top" id="co-top" href="#/profile"></a>
  <nav class="nav" aria-label="Main">
    <a href="#/schedule" data-nav="schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</a>
    <a href="#/jobs" data-nav="jobs" data-owner-only><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Jobs</a>
    <a href="#/crew" data-nav="crew"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg><span id="crew-label">Crew &amp; Pay</span></a>

    <a href="#/pay" data-nav="pay" data-emp-only><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 10v5M18 10v5"/></svg>My Pay</a>
  </nav>

<main id="view" tabindex="-1"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/supabase.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,\s]/g,''));return isFinite(n)?n:0};
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const money2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=0)=>isFinite(n)?(n*100).toFixed(d)+'%':'–';
const hrs=h=>(Math.round(h*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})+'h';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const fmtDate=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const fmtDateY=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const toMin=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const fmtTime=t=>{if(!t)return'';let m=toMin(t),h=Math.floor(m/60)%24,mm=m%60;const ap=h<12?'a':'p';h=h%12||12;return h+(mm?':'+pad(mm):'')+ap};
const JOB_COLORS=['#2f6fb0','#c2571a','#0e7490','#8a4fb5','#b8860b','#c03a5b','#4f46e5','#6b7280'];
const EMP_COLORS=['#2f6fb0','#0e7490','#c2571a','#8a4fb5','#c03a5b','#4f46e5','#b8860b','#6b7280'];
const CATS=[['materials','Materials'],['subs','Subcontractor'],['equipment','Equipment & rentals'],['permits','Permits & fees'],['fuel','Fuel & travel'],['disposal','Dumpster & disposal'],['other','Other']];
const CAT_NAME=Object.fromEntries(CATS);
const EST=[['materials','Materials'],['labor','Labor'],['subs','Subcontractors'],['equipment','Equipment'],['other','Other / fees']];
const estKey=c=>({materials:'materials',subs:'subs',equipment:'equipment'})[c]||'other';
const STATUS={bid:'Bid',active:'Active',done:'Done'};

/* ---------- storage (IndexedDB) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('job-ledger',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>this.db.close();res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  get(store,k){return this.tx(store,'readonly',s=>s.get(k))},
  put(store,k,v){return this.tx(store,'readwrite',s=>s.put(v,k))},
  del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},
  clear(store){return this.tx(store,'readwrite',s=>s.clear())}};
const blank=()=>({v:1,profile:{},settings:{company:'',burden:15,ot:true,otThreshold:40},jobs:[],expenses:[],employees:[],shifts:[],photos:[]});
let S=blank(), saveT=null, memOnly=false;
function save(){if(isEmp())return;if(isOwnerCloud())cloudQueue();clearTimeout(saveT);saveT=setTimeout(()=>{if(!memOnly)DB.put('kv','state',S).catch(()=>toast('Could not save on this device'))},250)}
const memPhotos=new Map();
async function photoPut(id,blob){if(memOnly)memPhotos.set(id,blob);else await DB.put('photos',id,blob);uploadPhoto(id,blob)}
async function photoGet(id){let b=memOnly?memPhotos.get(id):await DB.get('photos',id).catch(()=>null);
  if(!b&&isOwnerCloud()){try{const {data}=await CLOUD.sb.storage.from('photos').download(photoPath(id));if(data){b=data;if(memOnly)memPhotos.set(id,b);else DB.put('photos',id,b).catch(()=>{})}}catch(e){}}return b}
async function photoDel(id){if(memOnly)memPhotos.delete(id);else await DB.del('photos',id);if(isOwnerCloud())CLOUD.sb.storage.from('photos').remove([photoPath(id)]).catch(()=>{});const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}}
const urlCache=new Map();
async function photoURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await photoGet(id);if(!b)return'';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
function hydratePhotos(root=document){$$('img[data-photo]',root).forEach(async img=>{const u=await photoURL(img.dataset.photo);if(u)img.src=u})}
async function downscale(file,max=1600){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await Promise.race([new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82)),new Promise(r=>setTimeout(()=>r(file),8000))])}catch(e){return file}}
async function addPhoto(file,jobId,kind='job'){const id=uid();await photoPut(id,await downscale(file));S.photos.push({id,jobId,kind,date:today(),caption:''});return id}

/* ---------- calculations ---------- */
const job=id=>S.jobs.find(j=>j.id===id), emp=id=>S.employees.find(e=>e.id===id);
const jobColor=j=>j?j.color||JOB_COLORS[(S.jobs.indexOf(j)%JOB_COLORS.length+JOB_COLORS.length)%JOB_COLORS.length]:'#6b7280';
function shiftHours(s){let m=toMin(s.end)-toMin(s.start);if(m<0)m+=1440;return Math.max(0,m-(+s.breakMin||0))/60}
function laborCalc(){
  const map=new Map(),acc={},ot=S.settings.ot!==false,th=num(S.settings.otThreshold)||40;
  const worked=S.shifts.filter(s=>s.status==='worked').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  for(const s of worked){const h=shiftHours(s),k=s.empId+'|'+weekStart(s.date),before=acc[k]||0;acc[k]=before+h;
    let reg=h,o=0;if(ot){reg=Math.max(0,Math.min(h,th-before));o=h-reg}
    const wage=(+s.rate||0)*(reg+1.5*o);map.set(s.id,{h,reg,ot:o,wage,cost:wage*(1+(+s.burden||0)/100)})}
  return map}
const plannedCost=s=>shiftHours(s)*(+s.rate||0)*(1+(+s.burden||0)/100);
function jobStats(j,L){
  const rev=(+j.price||0)+sum(j.changeOrders||[],c=>c.amount);
  const cost={materials:0,labor:0,subs:0,equipment:0,other:0};let hours=0,planned=0,plannedH=0;
  for(const e of S.expenses)if(e.jobId===j.id)cost[estKey(e.cat)]+=+e.amount||0;
  for(const s of S.shifts){if(s.jobId!==j.id)continue;
    if(s.status==='worked'){const l=L.get(s.id);if(l){cost.labor+=l.cost;hours+=l.h}}
    else if(s.status==='scheduled'){planned+=plannedCost(s);plannedH+=shiftHours(s)}}
  const total=sum(Object.values(cost)),est=j.est||{},estTotal=sum(EST,([k])=>est[k]);
  // Projection for unfinished jobs: each category ends at the larger of what's spent (labor: plus what's scheduled) and its estimate.
  const done=j.status==='done';
  const projTotal=done?total:sum(EST,([k])=>Math.max(cost[k]+(k==='labor'?planned:0),+est[k]||0));
  return{rev,cost,total,hours,planned,plannedH,profit:rev-total,margin:rev?(rev-total)/rev:NaN,estTotal,estProfit:rev-estTotal,estMargin:rev?(rev-estTotal)/rev:NaN,used:estTotal?total/estTotal:NaN,
    projTotal,projProfit:rev-projTotal,projMargin:rev?(rev-projTotal)/rev:NaN}}

/* ---------- UI primitives ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function openForm({title,body,submit='Save',onSubmit,onDelete,deleteLabel='Delete',onOpen}){
  const d=$('#dlg');
  d.innerHTML=`<form class="dlg-form" novalidate><header><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
  <div class="dlg-body">${body}</div><footer>${onDelete?`<button type="button" class="btn danger" data-del>${esc(deleteLabel)}</button>`:''}<span class="sp"></span>
  <button type="button" class="btn ghost" data-close>Cancel</button>${onSubmit?`<button class="btn primary" type="submit">${esc(submit)}</button>`:''}</footer></form>`;
  const f=d.querySelector('form');
  f.addEventListener('submit',async ev=>{ev.preventDefault();for(const el of $$('[required]',f)){if(!String(el.value).trim()){el.focus();toast('Please fill in '+(el.closest('label')?.firstChild?.textContent||'the required field').trim().toLowerCase());return}}
    const btn=$('[type=submit]',f);btn.disabled=true;try{const r=await onSubmit(new FormData(f),f);if(r!==false){d.close();route()}}finally{btn.disabled=false}});
  $$('[data-close]',d).forEach(b=>b.onclick=()=>d.close());
  const del=$('[data-del]',d);if(del)del.onclick=async()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Tap again to delete';return}await onDelete();d.close();route()};
  d.showModal();onOpen&&onOpen(f);const first=$('input:not([type=hidden]):not([type=file]),select,textarea',f);if(first&&matchMedia('(min-width:821px)').matches)first.focus()}
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`;
const field=(label,inner,cls='')=>`<label class="${cls}">${label}${inner}</label>`;
const inp=(name,val='',type='text',extra='')=>`<input name="${name}" type="${type}" value="${esc(val)}" ${extra}>`;
const moneyInp=(name,val,extra='')=>`<input name="${name}" type="text" inputmode="decimal" value="${val===''||val==null?'':esc(val)}" placeholder="0" ${extra}>`;
function armTwoStep(btn,label='Tap again to confirm'){if(btn.classList.contains('armed'))return true;btn.classList.add('armed');const t=btn.textContent;btn.textContent=label;setTimeout(()=>{btn.classList.remove('armed');btn.textContent=t},4000);return false}

/* ---------- forms ---------- */
function jobForm(j){const isNew=!j;j=j||{status:'active',est:{},start:today()};const e=j.est||{};
  openForm({title:isNew?'New job':'Edit job',submit:isNew?'Create job':'Save',
    body:`<div class="fields">
      ${field('Job name',inp('name',j.name,'text','required placeholder="e.g. Smith kitchen remodel"'),'full')}
      ${field('Client',inp('client',j.client))}${field('Phone',inp('phone',j.phone,'tel'))}
      ${field('Address',inp('address',j.address),'full')}
      ${field('Status',`<select name="status">${Object.entries(STATUS).map(([k,v])=>opt(k,v,j.status)).join('')}</select>`)}
      ${field('Contract price (revenue)',moneyInp('price',j.price))}
      ${field('Start',inp('start',j.start,'date'))}${field('Finish',inp('end',j.end,'date'))}</div>
      <fieldset><legend>Your estimate (what you bid it at)</legend><div class="fields three keep">
      ${EST.map(([k,l])=>field(l,moneyInp('est_'+k,e[k]))).join('')}</div>
      <p class="note" style="margin-top:8px">Fill these in from your bid. Blue Board compares them to what you actually spend, so you can see where your estimates run high or low.</p></fieldset>
      ${planFields(j)}
      ${field('Notes',`<textarea name="notes">${esc(j.notes)}</textarea>`)}`,
    onOpen:planWire,
    onDelete:isNew?null:async()=>{for(const p of S.photos.filter(p=>p.jobId===j.id))await photoDel(p.id);
      S.photos=S.photos.filter(p=>p.jobId!==j.id);S.expenses=S.expenses.filter(x=>x.jobId!==j.id);S.shifts=S.shifts.filter(x=>x.jobId!==j.id);S.jobs=S.jobs.filter(x=>x.id!==j.id);save();toast('Job deleted');location.hash='#/jobs'},
    deleteLabel:'Delete job',
    onSubmit:(fd,f)=>{const plan=readPlan(fd),status=fd.get('status'),jid=isNew?(f.dataset.newId||(f.dataset.newId=uid())):j.id;
      if(plan.crew.length){if(!plan.to){toast('Pick the last day to schedule the crew');return false}if(plan.to<plan.from){toast('The last day is before the first day');return false}if(!plan.days.length){toast('Pick at least one work day');return false}}
      const conf=planConflicts(jid,plan,status);
      if(conf.length&&f.dataset.warned!=='1'){f.dataset.warned='1';$('#plan-warn',f).innerHTML=`<div class="insight warn"><b>Already booked</b><span>${conf.slice(0,5).map(c=>`${esc(emp(c.empId)?.name)} on ${fmtDate(c.date)} (${esc(job(c.other)?.name||'another job')})`).join(', ')}${conf.length>5?` and ${conf.length-5} more`:''}. Those days will be skipped. <label class="check" style="margin-top:6px"><input type="checkbox" name="dbl"> Book them anyway</label></span></div>`;$('#plan-warn',f).scrollIntoView({block:'nearest'});toast('Some crew are already booked. Check, then save again.');return false}
      const o=isNew?{id:jid,createdAt:Date.now(),changeOrders:[]}:j;
      Object.assign(o,{name:fd.get('name').trim(),client:fd.get('client').trim(),phone:fd.get('phone').trim(),address:fd.get('address').trim(),status:fd.get('status'),price:num(fd.get('price')),start:fd.get('start'),end:fd.get('end'),notes:fd.get('notes'),
        est:Object.fromEntries(EST.map(([k])=>[k,num(fd.get('est_'+k))]))});
      o.plan=plan;if(isNew)S.jobs.push(o);const r=syncPlan(o,{double:!!fd.get('dbl')});save();
      const msg=[isNew?'Job created':'Saved'];if(r.added)msg.push(`${r.added} shift${r.added>1?'s':''} scheduled`);if(r.removed)msg.push(`${r.removed} removed`);if(r.skipped)msg.push(`${r.skipped} skipped (already booked)`);
      if(plan.crew.length&&o.status==='bid')msg.push('crew will be scheduled when the job is Active');toast(msg.join(' · '));if(isNew)location.hash='#/job/'+o.id}})}
const WD=[['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['0','Sun']];
function planFields(j){const p=j.plan||{},crew=p.crew||[],days=(p.days||[1,2,3,4,5]).map(String),emps=S.employees.filter(e=>e.active!==false||crew.includes(e.id));
  return `<fieldset><legend>Crew &amp; schedule</legend><div class="stack" style="gap:12px">
    ${emps.length?`<div><div class="note" style="margin-bottom:8px">Who's working this job</div><div class="pick-row">${emps.map(e=>`<label class="pick"><input type="checkbox" name="crew" value="${e.id}"${crew.includes(e.id)?' checked':''}><span class="dot" style="background:${e.color}"></span>${esc(e.name)}${e.role?` <small>${esc(e.role)}</small>`:''}</label>`).join('')}</div></div>`
      :'<p class="note">Add your crew on <b>Crew &amp; Pay</b> first, then pick them here to put this job on the schedule.</p>'}
    <div class="fields">${field('First day',inp('pfrom',p.from||j.start||today(),'date'))}${field('Last day',inp('pto',p.to||j.end||'','date'))}</div>
    <div><div class="note" style="margin-bottom:8px">Work days</div><div class="pick-row">${WD.map(([v,l])=>`<label class="pick day"><input type="checkbox" name="pdays" value="${v}"${days.includes(v)?' checked':''}>${l}</label>`).join('')}</div></div>
    <div class="fields three keep times">${field('Start',inp('pstart',p.start||'07:00','time'))}${field('End',inp('pend',p.end||'15:30','time'))}${field('Break (min)',inp('pbreak',p.breakMin??30,'number','min="0" step="5" inputmode="numeric"'))}</div>
    <div class="plan-sum" id="plan-sum"></div><div id="plan-warn"></div>
    <p class="note">Saving puts these days on the schedule and calendar. Days before today aren't added. Changing this later only changes upcoming scheduled days, never days already worked.</p></div></fieldset>`}
function readPlan(fd){return{crew:fd.getAll('crew'),from:fd.get('pfrom')||today(),to:fd.get('pto')||'',days:fd.getAll('pdays').map(Number),start:fd.get('pstart')||'07:00',end:fd.get('pend')||'15:30',breakMin:num(fd.get('pbreak'))}}
function planDates(p){const out=[];if(!p||!p.to)return out;let d=p.from>today()?p.from:today();for(let i=0;d<=p.to&&i<400;i++,d=addDays(d,1))if(p.days.includes(pd(d).getDay()))out.push(d);return out}
function planWire(f){const sync=(src,dst)=>{const a=f.elements[src],b=f.elements[dst];a.addEventListener('change',()=>{if(!b.dataset.touched)b.value=a.value})};
  f.elements.pfrom.addEventListener('input',()=>f.elements.pfrom.dataset.touched=1);f.elements.pto.addEventListener('input',()=>f.elements.pto.dataset.touched=1);
  if(!f.elements.pto.value)f.elements.pto.dataset.touched='';sync('start','pfrom');sync('end','pto');
  const upd=()=>{const p=readPlan(new FormData(f)),n=p.crew.length,ds=planDates(p),h=shiftHours({start:p.start,end:p.end,breakMin:p.breakMin}),st=f.elements.status.value;
    $('#plan-sum',f).innerHTML=!n?'No crew picked yet. The job won\'t show on the schedule until you pick people.':!p.to?'Pick the last day to schedule the crew.':!ds.length?'No upcoming work days in that range.'
      :`<b>${ds.length} day${ds.length>1?'s':''} × ${n} ${n>1?'people':'person'} = ${ds.length*n} shifts</b> · ${fmtDate(ds[0])} – ${fmtDate(ds[ds.length-1])} · ${hrs(h)} a day${st==='bid'?' · scheduled once the job is <b>Active</b>':st==='done'?' · not scheduled while the job is <b>Done</b>':''}`;
    $('#plan-warn',f).innerHTML='';delete f.dataset.warned};
  f.addEventListener('input',upd);f.addEventListener('change',upd);upd()}
function overlaps(a1,a2,b1,b2){const n=(x,y)=>[toMin(x),toMin(y)<=toMin(x)?toMin(y)+1440:toMin(y)],[a,b]=n(a1,a2),[c,d]=n(b1,b2);return a<d&&c<b}
function conflictFor(empId,date,p,jobId){return S.shifts.find(s=>s.empId===empId&&s.date===date&&s.jobId!==jobId&&s.status!=='missed'&&overlaps(p.start,p.end,s.start,s.end))}
function planConflicts(jobId,p,status){if(status!=='active'||!p.crew.length)return[];const out=[];
  for(const d of planDates(p))for(const id of p.crew){if(S.shifts.some(s=>s.jobId===jobId&&s.empId===id&&s.date===d))continue;const c=conflictFor(id,d,p,jobId);if(c)out.push({empId:id,date:d,other:c.jobId})}return out}
// Keep a job's upcoming scheduled days in line with its crew plan. Never touches past days, worked or missed shifts, or shifts added by hand.
function syncPlan(j,opt={}){const t=today(),p=j.plan,res={added:0,removed:0,skipped:0},want=new Map();
  if(p&&p.crew&&p.crew.length&&j.status==='active')for(const d of planDates(p))for(const id of p.crew){const e=emp(id);if(e&&e.active!==false)want.set(id+'|'+d,{empId:id,date:d})}
  S.shifts=S.shifts.filter(s=>{if(s.jobId!==j.id||!s.plan||s.status!=='scheduled'||s.date<t)return true;const k=s.empId+'|'+s.date;
    if(want.has(k)){Object.assign(s,{start:p.start,end:p.end,breakMin:p.breakMin});want.delete(k);return true}res.removed++;return false});
  for(const w of want.values()){if(S.shifts.some(s=>s.jobId===j.id&&s.empId===w.empId&&s.date===w.date))continue;
    if(!opt.double&&conflictFor(w.empId,w.date,p,j.id)){res.skipped++;continue}
    const e=emp(w.empId);S.shifts.push({id:uid(),empId:w.empId,jobId:j.id,date:w.date,start:p.start,end:p.end,breakMin:p.breakMin,status:'scheduled',rate:e.rate,burden:e.burden,note:'',plan:true});res.added++}
  return res}

function pageDashboard(){
  const L=laborCalc();
  if(!S.jobs.length)return `<div class="page-head"><div><h1>Profit</h1><p class="sub">Built to help you keep more of every dollar you bid. See which jobs make money, which ones don't, and why.</p></div></div>
    <div class="card stack"><h2>How this page maximizes your profit</h2>
    <ul class="list">
      <li><div class="grow"><b>Real profit on every job</b><small>Compares what you charged with everything it actually cost: materials, labor with overtime and burden, subs, equipment and fees.</small></div></li>
      <li><div class="grow"><b>Where your estimates miss</b><small>Shows which costs keep coming in over or under your bids, and by how much, so you can price the next job right.</small></div></li>
      <li><div class="grow"><b>Jobs going over budget</b><small>Flags open jobs that are eating into their margin while there's still time to fix it.</small></div></li>
    </ul>
    <p class="note">It fills in as you add jobs with their estimates, log expenses and track crew hours.</p>
    <div class="btns"><button class="btn primary" data-act="job-new">Add a job</button><button class="btn" data-act="sample">See it with sample data</button></div></div>`;
  const now=today(),y=now.slice(0,4),from={all:'',ytd:y+'-01-01','12m':addDays(now,-365)}[UI.dash];
  const done=S.jobs.filter(j=>j.status==='done'&&(!from||(j.end||'')>=from)).map(j=>({j,s:jobStats(j,L)}));
  const active=S.jobs.filter(j=>j.status==='active').map(j=>({j,s:jobStats(j,L)}));
  const rev=sum(done,x=>x.s.rev),cost=sum(done,x=>x.s.total),prof=rev-cost,estProf=sum(done,x=>x.s.estProfit);
  const wk=weekStart(now),wkShifts=S.shifts.filter(s=>s.date>=wk&&s.date<=addDays(wk,6));
  const wkH=sum(wkShifts.filter(s=>s.status!=='missed'),shiftHours);
  const wkCost=sum(wkShifts,s=>s.status==='worked'?(L.get(s.id)?.cost||0):s.status==='scheduled'?plannedCost(s):0);
  // estimating accuracy
  const acc=EST.map(([k,l])=>{const rows=done.filter(x=>(+x.j.est?.[k]||0)>0);const e=sum(rows,x=>x.j.est[k]),a=sum(rows,x=>x.s.cost[k]);return{k,l,n:rows.length,e,a,v:e?(a-e)/e:NaN}}).filter(r=>r.n);
  const insights=[];
  for(const r of acc){if(r.v>0.05)insights.push(['bad',`<b>${r.l} +${pct(r.v)}</b><span>${r.l} came in ${pct(r.v)} over your estimates across ${r.n} finished job${r.n>1?'s':''} (${money(r.a-r.e)}). Raise ${r.l.toLowerCase()} in your bids by about ${pct(r.v)}, or find out what's driving it.</span>`]);
    else if(r.v<-0.10)insights.push(['warn',`<b>${r.l} ${pct(r.v)}</b><span>You're estimating ${r.l.toLowerCase()} high (${pct(-r.v)} under on ${r.n} job${r.n>1?'s':''}). That padding could be costing you bids.</span>`])}
  const dm=rev?prof/rev:NaN,em=rev?estProf/rev:NaN;
  if(done.length&&isFinite(dm)&&isFinite(em)&&Math.abs(dm-em)>0.02)insights.unshift([dm<em?'bad':'good',`<b>Margin ${pct(dm)}</b><span>You bid these jobs at a ${pct(em)} margin and actually made ${pct(dm)}. ${dm<em?`That gap is ${money(estProf-prof)} you planned to keep but didn't.`:'Your jobs are beating their estimates.'}</span>`]);
  if(done.length&&!insights.length)insights.push(['good','<b>On target</b><span>Your finished jobs are landing close to their estimates.</span>']);
  const maxM=Math.max(.3,...done.map(x=>Math.abs(x.s.margin)||0));
  return `<div class="page-head"><div><h1>Profit</h1><p class="sub">Your real profit on every job, and where to tighten your estimates to keep more of each one.</p></div>
    <div class="seg" role="group" aria-label="Period">${[['all','All time'],['ytd','This year'],['12m','Last 12 months']].map(([k,l])=>`<button data-act="dash" data-v="${k}" aria-pressed="${UI.dash===k}">${l}</button>`).join('')}</div></div>
  <div class="stack">
  <div class="kpis">
    <div class="kpi lead"><span>Revenue</span><b>${money(rev)}</b><small>${done.length} finished job${done.length===1?'':'s'}</small></div>
    <div class="kpi"><span>Job costs</span><b>${money(cost)}</b><small>materials, labor, subs &amp; fees</small></div>
    <div class="kpi"><span>Gross profit</span><b class="${prof<0?'neg':'pos'}">${money(prof)}</b><small>${isFinite(em)?`bid for ${money(estProf)}`:'&nbsp;'}</small></div>
    <div class="kpi"><span>Margin</span><b class="${dm<0?'neg':''}">${pct(dm,1)}</b><small>${isFinite(em)?`estimated ${pct(em,1)}`:'&nbsp;'}</small></div>
  </div>
  <div class="grid2">
    <div class="stack">
      <div class="card"><div class="card-head"><h2>Profit by job</h2><span class="note">finished jobs</span></div>
      ${done.length?`<div class="table-wrap"><table><thead><tr><th>Job</th><th class="n">Revenue</th><th class="n">Cost</th><th class="n">Profit</th><th class="n">Margin</th><th style="min-width:130px"><span class="sr">Margin bar</span></th><th class="n">vs bid</th></tr></thead><tbody>
        ${done.sort((a,b)=>(b.j.end||'').localeCompare(a.j.end||'')).map(({j,s})=>{const w=Math.min(1,Math.abs(s.margin||0)/maxM)*100;const vb=s.profit-s.estProfit;return `<tr class="click" data-href="#/job/${j.id}"><td><b>${esc(j.name)}</b><br><small class="muted">${fmtDateY(j.end)}</small></td><td class="n">${money(s.rev)}</td><td class="n">${money(s.total)}</td><td class="n ${s.profit<0?'neg':''}">${money(s.profit)}</td><td class="n">${pct(s.margin,1)}</td>
        <td><div class="mbar" title="${pct(s.margin,1)}"><div class="l">${s.margin<0?`<i style="width:${w}%"></i>`:''}</div><div class="r">${s.margin>0?`<i style="width:${w}%"></i>`:''}</div></div></td><td class="n ${s.estTotal?(vb<0?'neg':'pos'):''}">${s.estTotal?(vb>=0?'+':'')+money(vb):'–'}</td></tr>`}).join('')}
        </tbody></table></div>`:emptyBox('No finished jobs in this period yet. Mark a job <b>Done</b> to see its final profit here.')}</div>
      <div class="card"><div class="card-head"><h2>Estimating accuracy</h2><span class="note">estimate vs actual, finished jobs</span></div>
      ${acc.length?`<div class="table-wrap"><table><thead><tr><th>Category</th><th class="n">Estimated</th><th class="n">Actual</th><th class="n">Over / under</th></tr></thead><tbody>
        ${acc.map(r=>`<tr><td>${r.l} <small class="muted">· ${r.n} job${r.n>1?'s':''}</small></td><td class="n">${money(r.e)}</td><td class="n">${money(r.a)}</td><td class="n ${r.v>0.05?'neg':r.v<-0.05?'':'pos'}">${r.v>=0?'+':''}${pct(r.v,1)}</td></tr>`).join('')}</tbody></table></div>
        <div class="stack" style="gap:8px;margin-top:12px">${insights.map(([c,h])=>`<div class="insight ${c}">${h}</div>`).join('')}</div>`
        :emptyBox('Enter your estimate on each job (Edit job → Your estimate). Once jobs are finished, this shows which costs you under- or over-estimate.')}</div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-head"><h2>Jobs in progress</h2><a class="btn sm" href="#/jobs">All jobs</a></div>
      ${active.length?`<ul class="list">${active.map(({j,s})=>`<li class="click" data-href="#/job/${j.id}"><span class="dot" style="background:${jobColor(j)}"></span><div class="grow"><b>${esc(j.name)}</b><small>${money(s.total)} spent of ${s.estTotal?money(s.estTotal)+' budget':'no budget set'} · ${money(s.rev)} contract${s.estTotal?` · projected profit <b class="${s.projProfit<0?'neg':''}">${money(s.projProfit)}</b>`:''}</small>
        ${s.estTotal?`<div class="bar" style="margin-top:6px"><i class="${s.used>1?'over':s.used>.85?'':'ok'}" style="width:${Math.min(100,s.used*100)}%"></i></div>`:''}</div><span class="num ${s.used>1?'neg':''}">${isFinite(s.used)?pct(s.used):''}</span></li>`).join('')}</ul>`:emptyBox('No active jobs.')}</div>
      <div class="card"><div class="card-head"><h2>This week's crew</h2><a class="btn sm" href="#/schedule">Schedule</a></div>
        <div class="kpis" style="grid-template-columns:1fr 1fr"><div><span class="note">Hours</span><div style="font-size:22px;font-weight:800" class="num">${hrs(wkH)}</div></div><div><span class="note">Labor cost</span><div style="font-size:22px;font-weight:800" class="num">${money(wkCost)}</div></div></div>
        <p class="note" style="margin-top:8px">Worked shifts at actual cost (with overtime and burden), scheduled shifts at their planned cost.</p></div>
    </div>
  </div></div>`}

    <div class="kpi"><span>Costs ${isDone?'':'so far'}</span><b>${money(s.total)}</b><small>${s.estTotal?pct(s.used)+' of '+money(s.estTotal)+' estimate':'no estimate entered'}</small></div>

    <div class="kpi"><span>Margin</span><b class="${s.margin<0?'neg':''}">${pct(s.margin,1)}</b><small>${s.estTotal?'estimated '+pct(s.estMargin,1):'&nbsp;'}</small></div>`
    :`<div class="kpi"><span>Projected profit</span><b class="${s.projProfit<0?'neg':'pos'}">${money(s.projProfit)}</b><small>${s.estTotal?'bid for '+money(s.estProfit):'enter an estimate to project'}</small></div>

  </div><div class="stack">
    <div class="card"><div class="card-head"><h2>Crew on this job</h2><div class="btns"><button class="btn sm" data-act="job-edit">${j.plan?.crew?.length?'Edit crew &amp; dates':'Schedule crew'}</button><button class="btn sm" data-act="shift-new-job">+ Log hours</button></div></div>
      ${Object.keys(byEmp).length?`<div class="table-wrap"><table><thead><tr><th>Employee</th><th class="n">Hours</th><th class="n">Wages</th><th class="n">Cost</th></tr></thead><tbody>

function greet(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'}
function weekCards(days,inWeek,RO){const now=today();
  return `<div class="wk">${days.map(d=>{const list=inWeek.filter(s=>s.date===d&&s.status!=='missed').sort((a,b)=>a.start.localeCompare(b.start)),groups={};
    for(const s of list)(groups[s.jobId]=groups[s.jobId]||[]).push(s);const wd=pd(d).getDay(),off=wd===0||wd===6;
    return `<div class="wk-day${d===now?' today':''}${off&&d!==now?' off':''}"><div class="wk-head"><span>${pd(d).toLocaleDateString('en-US',{weekday:'short'})}</span><b>${pd(d).getDate()}</b></div>
      <div class="wk-list">${Object.entries(groups).map(([jid,ss])=>{const j=job(jid),same=ss.every(x=>x.start===ss[0].start&&x.end===ss[0].end);
        return `<div class="wk-job" style="--jc:${jobColor(j)}"><div class="wk-jt">${esc(j?.name||'Job removed')}</div><div class="wk-av">${ss.map(x=>{const e=emp(x.empId),t=`${esc(e?.name||'')} · ${fmtTime(x.start)}–${fmtTime(x.end)}${x.status==='worked'?' · worked':''}`;
          return RO?`<span class="av" style="background:${e?.color||'#999'}" title="${t}">${esc(initials(e?.name))}</span>`:`<button class="av" style="background:${e?.color||'#999'}" data-act="shift-edit" data-id="${x.id}" title="${t}" aria-label="${t}">${esc(initials(e?.name))}</button>`}).join('')}</div>
          <div class="wk-time">${same?`${fmtTime(ss[0].start)} – ${fmtTime(ss[0].end)}`:'Mixed hours'}</div></div>`}).join('')}
        ${list.length?'':`<div class="wk-off">${off?'Day off':'Nothing scheduled'}</div>`}</div>
      ${RO?'':`<button class="wk-add" data-act="shift-new" data-date="${d}" aria-label="Add shift on ${fmtDate(d)}">+ Add</button>`}</div>`}).join('')}</div>`}
function pageSchedule(){const RO=isEmp(),wk=UI.week,days=[...Array(7)].map((_,i)=>addDays(wk,i)),now=today(),L=laborCalc(),view=UI.schedView||'days';
  const inWeek=S.shifts.filter(s=>s.date>=wk&&s.date<=days[6]);
  const emps=S.employees.filter(e=>e.active!==false||inWeek.some(s=>s.empId===e.id));
  const pastSched=inWeek.filter(s=>s.status==='scheduled'&&s.date<now).length;
  const byJob={};for(const s of inWeek){if(s.status==='missed')continue;const r=byJob[s.jobId]=byJob[s.jobId]||{h:0,c:0};r.h+=shiftHours(s);r.c+=s.status==='worked'?(L.get(s.id)?.cost||0):plannedCost(s)}
  const label=`${pd(wk).toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${pd(days[6]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;
  const tod=S.shifts.filter(s=>s.date===now&&s.status!=='missed'),ppl=new Set(tod.map(s=>s.empId)).size,jb=new Set(tod.map(s=>s.jobId)).size;
  const me=RO?emp(CLOUD.employeeId):null,first=String(RO?(me?.name||''):(S.profile?.name||'')).trim().split(/\s+/)[0];
  const mineToday=RO?tod.find(s=>s.empId===CLOUD.employeeId):null;
  const line=RO?(mineToday?`You're on <b>${esc(job(mineToday.jobId)?.name||'a job')}</b> today, ${fmtTime(mineToday.start)} – ${fmtTime(mineToday.end)}.`:'You\'re not scheduled today.')
    :(ppl?`${ppl} ${ppl===1?'person is':'people are'} on site today across ${jb} job${jb>1?'s':''}.`:'No one is scheduled today.');
  const wkH=sum(inWeek.filter(s=>s.status!=='missed'),shiftHours),wkC=sum(Object.values(byJob),r=>r.c);
  const otH=sum(emps,e=>Math.max(0,sum(inWeek.filter(s=>s.empId===e.id&&s.status!=='missed'),shiftHours)-(num(S.settings.otThreshold)||40)));
  const myH=RO?sum(inWeek.filter(s=>s.empId===CLOUD.employeeId&&s.status!=='missed'),shiftHours):0,myN=RO?inWeek.filter(s=>s.empId===CLOUD.employeeId&&s.status!=='missed').length:0;
  const grid=`<div class="card" style="padding:8px"><div class="table-wrap"><table class="sched"><thead><tr><th>Crew</th>${days.map(d=>`<th class="${d===now?'today':''}">${pd(d).toLocaleDateString('en-US',{weekday:'short'})} <span class="muted">${pd(d).getDate()}</span></th>`).join('')}</tr></thead><tbody>
  ${emps.map(e=>{const mine=inWeek.filter(s=>s.empId===e.id);const h=sum(mine.filter(s=>s.status!=='missed'),shiftHours);const ot=S.settings.ot!==false&&h>(num(S.settings.otThreshold)||40);
    return `<tr><td><div class="emp-cell"><span class="dot" style="background:${e.color};margin-top:5px"></span><div><b>${esc(e.name)}</b>${RO&&e.id===CLOUD.employeeId?' <span class="badge done">You</span>':''}<small class="${ot?'neg':''}">${hrs(h)}${ot?' · overtime':''}</small></div></div></td>
    ${days.map(d=>`<td class="${d===now?'today':''}">${mine.filter(s=>s.date===d).sort((a,b)=>a.start.localeCompare(b.start)).map(s=>{const j=job(s.jobId);return `<button class="chip ${s.status}" style="--jc:${jobColor(j)}" ${RO?'':`data-act="shift-edit" data-id="${s.id}"`}><b>${esc(j?.name||'Job removed')}</b>${fmtTime(s.start)}–${fmtTime(s.end)} · ${hrs(shiftHours(s))}</button>`}).join('')}
      ${RO?'':`<button class="add-cell" data-act="shift-new" data-emp="${e.id}" data-date="${d}" aria-label="Add shift for ${esc(e.name)} on ${fmtDate(d)}">+</button>`}</td>`).join('')}</tr>`}).join('')}
  </tbody><tfoot><tr><td>Day total</td>${days.map(d=>`<td class="num">${hrs(sum(inWeek.filter(s=>s.date===d&&s.status!=='missed'),shiftHours))}</td>`).join('')}</tr></tfoot></table></div></div>`;
  return `<div class="page-head"><div><div class="eyebrow">${pd(now).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div><h1>${greet()}${first?', '+esc(first):''}.</h1><p class="sub">${S.employees.length?line:'Add your crew to start scheduling.'}</p></div>

  ${!S.employees.length?`<div class="stack">${emptyBox('Add your crew first, then schedule them on jobs. Or load the sample company to see how it works.','<a class="btn primary" href="#/crew">Add employees</a>'+(S.jobs.length?'':'<button class="btn" data-act="sample">Load sample data</button>'))}${monthCal()}</div>`:`
  <div class="stack">${RO?clockCard():''}
  <div class="split"><div class="week-nav"><button class="btn sm" data-act="week" data-v="-7" aria-label="Previous week">‹</button><button class="btn sm" data-act="week" data-v="0">This week</button><button class="btn sm" data-act="week" data-v="7" aria-label="Next week">›</button><b style="margin-left:6px">${label}</b></div>
    <div class="btns"><div class="seg" role="group" aria-label="View">${[['days','Days'],['crew','By crew']].map(([k,l])=>`<button data-act="sched-view" data-v="${k}" aria-pressed="${view===k}">${l}</button>`).join('')}</div>
    ${RO?'':`${pastSched?`<button class="btn sm dark" data-act="confirm-past">Mark ${pastSched} past shift${pastSched>1?'s':''} worked</button>`:''}<button class="btn sm" data-act="copy-week">Copy last week</button>`}</div></div>
  ${view==='crew'?grid:weekCards(days,inWeek,RO)}
  <div class="stat-row">${RO?`<div class="stat"><span>My hours this week</span><b>${hrs(myH)}</b></div><div class="stat"><span>My shifts this week</span><b>${myN}</b></div>`
    :`<div class="stat"><span>Hours this week</span><b>${hrs(wkH)}</b></div><div class="stat"><span>Labor cost</span><b>${money(wkC)}</b></div><div class="stat"><span>Overtime</span><b>${hrs(otH)}</b></div>`}</div>
  ${RO||!Object.keys(byJob).length?'':`<div class="card"><div class="card-head"><h2>This week by job</h2></div>
  <div class="table-wrap"><table><thead><tr><th>Job</th><th class="n">Hours</th><th class="n">Labor cost</th></tr></thead><tbody>${Object.entries(byJob).map(([jid,r])=>{const j=job(jid);return `<tr class="click" data-href="#/job/${jid}"><td><span class="dot" style="background:${jobColor(j)}"></span> ${esc(j?.name||'Job removed')}</td><td class="n">${hrs(r.h)}</td><td class="n">${money(r.c)}</td></tr>`}).join('')}</tbody>
  <tfoot><tr><td>Total</td><td class="n">${hrs(sum(Object.values(byJob),r=>r.h))}</td><td class="n">${money(sum(Object.values(byJob),r=>r.c))}</td></tr></tfoot></table></div></div>`}${monthCal()}</div>`}`}

function monthCal(){const m=UI.month,first=pd(m),now=today(),sel=UI.day;
  const start=weekStart(m),end=addDays(weekStart(ds(new Date(first.getFullYear(),first.getMonth()+1,0))),6);
  const byDay={};for(const s of S.shifts){if(s.date<start||s.date>end||s.status==='missed')continue;(byDay[s.date]=byDay[s.date]||[]).push(s)}
  const inMonth=S.shifts.filter(s=>s.date.slice(0,7)===m.slice(0,7)&&s.status!=='missed');
  let cells='';for(let d=start;d<=end;d=addDays(d,1)){const list=byDay[d]||[],jobs={};
    for(const s of list){const r=jobs[s.jobId]=jobs[s.jobId]||{e:new Set(),h:0};r.e.add(s.empId);r.h+=shiftHours(s)}
    const js=Object.entries(jobs).sort((a,b)=>b[1].h-a[1].h),h=sum(list,shiftHours),wd=pd(d).getDay();
    cells+=`<button class="cal-day${d.slice(0,7)===m.slice(0,7)?'':' out'}${wd===0||wd===6?' wkend':''}${d===now?' today':''}${d===sel?' sel':''}" data-act="cal-day" data-d="${d}" aria-pressed="${d===sel}" aria-label="${fmtDateY(d)}${list.length?`, ${list.length} shift${list.length>1?'s':''}`:''}">
      <span class="cal-num">${pd(d).getDate()}</span>${h?`<span class="cal-h">${hrs(h)}</span>`:''}
      <span class="cal-jobs">${js.slice(0,3).map(([jid,r])=>{const j=job(jid);return `<span class="cal-job" style="--jc:${jobColor(j)}" title="${esc(j?.name||'')}"><i></i><em>${esc(j?.name||'Job')}</em><small>${r.e.size}</small></span>`}).join('')}${js.length>3?`<span class="cal-more">+${js.length-3} more</span>`:''}</span></button>`}
  const day=S.shifts.filter(s=>s.date===sel).sort((a,b)=>a.start.localeCompare(b.start)||(emp(a.empId)?.name||'').localeCompare(emp(b.empId)?.name||''));
  const dayH=sum(day.filter(s=>s.status!=='missed'),shiftHours),crew=new Set(day.filter(s=>s.status!=='missed').map(s=>s.empId)).size;
  const stat={worked:['done','Worked'],scheduled:['','Scheduled'],missed:['','Missed']};
  return `<div class="card"><div class="cal-head"><div><div class="cal-title">${first.toLocaleDateString('en-US',{month:'long'})} <span>${first.getFullYear()}</span></div>
      <p class="note">${inMonth.length?`${hrs(sum(inMonth,shiftHours))} across ${new Set(inMonth.map(s=>s.jobId)).size} job${new Set(inMonth.map(s=>s.jobId)).size>1?'s':''} this month`:'Nothing on the calendar this month'}</p></div>
    <div class="week-nav"><button class="btn sm" data-act="cal-month" data-v="-1" aria-label="Previous month">‹</button><button class="btn sm" data-act="cal-month" data-v="0">Today</button><button class="btn sm" data-act="cal-month" data-v="1" aria-label="Next month">›</button></div></div>
    <div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="cal-wd">${w}</div>`).join('')}${cells}</div>

function route(){const h=(location.hash||'#/schedule').slice(2),[page,id]=h.split('/');const v=$('#view');
  if(page==='join'&&id){LS.set('invite',id.toUpperCase().replace(/[^A-Z0-9]/g,''));if(!CLOUD.user){CLOUD.mode='signedout';UI.authTab='up'}else if(CLOUD.mode==='onboard'){acceptPending().then(ok=>ok&&loadMembership()).then(()=>route())}location.hash='#/schedule';return}
  let P;
  if(page==='reset')P=pageReset;
  else if(CLOUD.mode==='signedout'||(page==='signin'&&!CLOUD.user))P=pageAuth;
  else if(CLOUD.mode==='onboard')P=pageOnboard;
  else if(isEmp())P={schedule:pageSchedule,crew:pageEmpCrew,pay:pageMyPay,profile:pageEmpAccount}[page]||pageSchedule;
  else P={dashboard:pageDashboard,jobs:pageJobs,job:()=>pageJob(id),schedule:pageSchedule,crew:pageCrew,settings:pageSettings,profile:pageProfile}[page]||pageSchedule;
  document.body.classList.toggle('emp',isEmp());document.body.classList.toggle('gate',P===pageAuth||P===pageOnboard||P===pageReset);
  $('#crew-label').textContent=isEmp()?'My crew':'Crew & Pay';renderMenu();
  const keepScroll=route.last===h;const y=scrollY;v.innerHTML=P();route.last=h;
  const navKey=page==='job'?'jobs':P===pageSchedule?'schedule':P===pageMyPay?'pay':P===pageEmpCrew?'crew':P===pageEmpAccount?'profile':page;
  $$('[data-nav],[data-menu]').forEach(a=>a.removeAttribute('aria-current'));$$(`[data-nav="${navKey}"],[data-menu="${navKey}"]`).forEach(a=>a.setAttribute('aria-current','page'));
  const pr=S.profile||{},me=isEmp()?emp(CLOUD.employeeId):null;$('#menu-who').innerHTML=me?`<span class="avatar" style="background:${me.color}">${esc(initials(me.name))}</span><span><b>${esc(me.name)}</b><small>${esc(me.role||'Crew')}</small></span>`:`<span class="avatar">${esc(initials(pr.name||pr.company))}</span><span><b>${esc(pr.name||'Set up your profile')}</b><small>${esc(pr.company||'Name, company, license')}</small></span>`;
  closeMenu();applyTheme();document.title=(S.profile?.company?S.profile.company+' · ':'')+'Blue Board';
  hydratePhotos(v);if(keepScroll)scrollTo(0,y);else scrollTo(0,0)}

function myPayRows(from,to){const th=num(S.settings.otThreshold)||40,ot=S.settings.ot!==false,rate=+CLOUD.myRate||0,acc={},rows=[];
  for(const p of CLOUD.punches.filter(p=>p.out_at).sort((a,b)=>a.in_at.localeCompare(b.in_at))){const d=ds(new Date(p.in_at)),h=(new Date(p.out_at)-new Date(p.in_at))/36e5,k=weekStart(d),before=acc[k]||0;acc[k]=before+h;
    let reg=h,o=0;if(ot){reg=Math.max(0,Math.min(h,th-before));o=h-reg}if(d>=from&&d<=to)rows.push({p,d,h,reg,ot:o,pay:rate*(reg+1.5*o)})}
  return rows.reverse()}
const pins=(la,ln,lab)=>la!=null?`<a class="btn sm ghost" href="${mapUrl(la,ln)}" target="_blank" rel="noopener">${lab} ↗</a>`:'';
function pageMyPay(){const R=payRange(),[from,to]=R[UI.pay],rows=myPayRows(from,to),show=S.settings.showPay!==false&&CLOUD.myRate!=null;
  const H=sum(rows,r=>r.h),O=sum(rows,r=>r.ot),P=sum(rows,r=>r.pay),open=CLOUD.punches.find(p=>!p.out_at);
  return `<div class="page-head"><div><h1>My pay</h1><p class="sub">Your hours from clocking in and out${show?', and what you\'ve earned':''}.</p></div>
    <div class="seg" role="group" aria-label="Pay period">${Object.entries(R).map(([k,[, ,l]])=>`<button data-act="pay" data-v="${k}" aria-pressed="${UI.pay===k}">${l}</button>`).join('')}</div></div>
  <div class="stack"><div class="kpis">
    <div class="kpi lead"><span>Hours</span><b>${hrs(H)}</b><small>${fmtDate(from)} – ${fmtDate(to)}</small></div>
    <div class="kpi"><span>Overtime</span><b>${hrs(O)}</b><small>${S.settings.ot!==false?`1.5× over ${num(S.settings.otThreshold)||40}h/week`:'not paid'}</small></div>
    ${show?`<div class="kpi"><span>Gross pay</span><b class="pos">${money2(P)}</b><small>before taxes</small></div><div class="kpi"><span>Your rate</span><b>${money2(+CLOUD.myRate)}</b><small>per hour</small></div>`:''}
  </div>
  ${open?`<div class="insight good"><b>On the clock</b><span>Since ${timeOf(open.in_at)} at ${esc(job(open.job_id)?.name||'a job')}. These hours count once you clock out.</span></div>`:''}
  <div class="card"><div class="card-head"><h2>Clock history</h2><span class="note">${rows.length} shift${rows.length===1?'':'s'}</span></div>
  ${rows.length?`<div class="table-wrap"><table><thead><tr><th>Day</th><th>Job</th><th>In</th><th>Out</th><th class="n">Hours</th>${show?'<th class="n">Pay</th>':''}<th>Location</th></tr></thead><tbody>
  ${rows.map(r=>{const j=job(r.p.job_id);return `<tr><td>${pd(r.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</td><td><span class="dot" style="background:${jobColor(j)}"></span> ${esc(j?.name||'Job')}${r.p.note?`<br><small class="muted">${esc(r.p.note)}</small>`:''}</td>
    <td>${timeOf(r.p.in_at)}</td><td>${timeOf(r.p.out_at)}</td><td class="n">${hrs(r.h)}${r.ot?`<br><small class="neg">${hrs(r.ot)} OT</small>`:''}</td>${show?`<td class="n">${money2(r.pay)}</td>`:''}<td>${pins(r.p.in_lat,r.p.in_lng,'In')}${pins(r.p.out_lat,r.p.out_lng,'Out')}</td></tr>`}).join('')}</tbody></table></div>`:emptyBox('No clocked hours in this period.')}
  <p class="note" style="margin-top:10px">Hours are rounded from your clock times. Your boss may adjust them for breaks or corrections. Gross pay is before taxes and deductions.</p></div></div>`}
function pageEmpAccount(){const me=emp(CLOUD.employeeId),p=S.profile;
  return `<div class="page-head"><div class="profile-head"><span class="avatar lg" style="background:${me?.color||'var(--hi)'}">${esc(initials(me?.name))}</span><div><h1>${esc(me?.name||'My account')}</h1><p class="sub">${esc([me?.role,p.company].filter(Boolean).join(' at '))}</p></div></div></div>
  <div class="grid2"><div class="card stack"><h2>Account</h2><ul class="list"><li><div class="grow"><b>Email</b><small>${esc(CLOUD.user?.email||'')}</small></div></li><li><div class="grow"><b>Company</b><small>${esc(p.company||'')}</small></div></li></ul>
    <div><button class="btn danger" data-act="signout">Sign out</button></div></div>
  <div class="card stack"><h2>Appearance</h2><div class="seg" role="group" aria-label="Mode">${[['light','Light'],['dark','Dark']].map(([k,l])=>`<button data-act="mode" data-v="${k}" aria-pressed="${(p.mode||'light')===k}">${l}</button>`).join('')}</div>
    <p class="note">Your company's colors and logo are set by your boss.</p></div></div>`}

/* ----- owner extras ----- */
function onClockCard(){const open=CLOUD.punches.filter(p=>!p.out_at),recent=CLOUD.punches.filter(p=>p.out_at).slice(0,6);
  const li=(p,live)=>{const e=emp(p.employee_id),j=job(p.job_id),h=((p.out_at?new Date(p.out_at):new Date())-new Date(p.in_at))/36e5;
    return `<li><span class="avatar sm" style="background:${e?.color||'#999'}">${esc(initials(e?.name))}</span><div class="grow"><b>${esc(e?.name||'Unknown')}</b><small><span class="dot" style="background:${jobColor(j)};width:8px;height:8px"></span> ${esc(j?.name||'Job')} · ${live?'since '+timeOf(p.in_at):fmtDate(ds(new Date(p.in_at)))+', '+timeOf(p.in_at)+'–'+timeOf(p.out_at)}${p.note?' · '+esc(p.note):''}</small></div>
      ${pins(p.in_lat,p.in_lng,live?'Map':'In')}${live?'':pins(p.out_lat,p.out_lng,'Out')}<b class="num" style="min-width:58px;text-align:right">${live?`<span data-elapsed="${esc(p.in_at)}">${dur(Math.floor(h*60))}</span>`:hrs(h)}</b></li>`};
  return `<div class="card"><div class="card-head"><h2>On the clock</h2><span class="badge ${open.length?'done':''}">${open.length} working now</span></div>
    ${open.length?`<ul class="list">${open.map(p=>li(p,true)).join('')}</ul>`:'<p class="note">No one is clocked in right now.</p>'}
    ${recent.length?`<h3 style="margin-top:16px">Recent clock-outs</h3><ul class="list">${recent.map(p=>li(p)).join('')}</ul>`:''}
    <p class="note" style="margin-top:10px">Each clock-out is added to the schedule as a worked shift, so it counts in payroll and job cost.</p></div>`}
function accountCard(){if(!CLOUD.user)return `<div class="card stack"><h2>Account</h2><p>Create a free account to keep your data in the cloud, use it on any device, and put your crew on the app to clock in and out.</p><div><a class="btn primary" href="#/signin">Sign in or create account</a></div></div>`;
  return `<div class="card stack"><h2>Account</h2><ul class="list"><li><div class="grow"><b>${esc(CLOUD.user.email)}</b><small>${esc(syncText())}</small></div></li></ul><div><button class="btn danger" data-act="signout">Sign out</button></div></div>`}
function inviteDialog(e){const linked=onApp(e.id);
  if(linked)return openForm({title:`${e.name} is on the app`,body:`<p>${esc(e.name)} can see the schedule and crew, clock in and out, and see their own hours${S.settings.showPay!==false?' and pay':''}. They can't see job prices, expenses, profits or anyone else's pay.</p>`,
    onDelete:async()=>{const {error}=await CLOUD.sb.from('members').delete().eq('company_id',CLOUD.company).eq('employee_id',e.id);if(error){toast(errMsg(error));return}await loadMembers();toast('App access removed')},deleteLabel:'Remove app access'});
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(8)),code=[...r].map(x=>A[x%A.length]).join(''),show=code.slice(0,4)+'-'+code.slice(4);
  const base=location.protocol.startsWith('http')?location.origin+location.pathname:PAGES_URL,link=base+'#/join/'+code;
  const msg=`${S.profile.company||'Your boss'} added you to Blue Board. Open ${link} on your phone and create an account to see the schedule and clock in. Invite code: ${show}`;
  openForm({title:`Invite ${e.name}`,body:`<p>Send this to <b>${esc(e.name)}</b>. They open the link on their phone, create an account, and they're on your crew.</p>
    <div class="invite-code">${show}</div>${field('Link',`<input readonly value="${esc(link)}" onfocus="this.select()">`)}
    <div class="btns"><button type="button" class="btn primary" id="copy-invite">Copy invite message</button></div><p class="note" id="inv-status">Creating the code…</p>
    <p class="note">The code works once. If it's lost, make a new one.</p>`,
    onOpen:async f=>{const {error}=await CLOUD.sb.from('invites').insert({code,company_id:CLOUD.company,employee_id:e.id});
      $('#inv-status').textContent=error?'Could not create the code: '+errMsg(error):'Code ready.';
      $('#copy-invite').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('Invite copied. Paste it in a text.')}catch(err){$('#inv-status').textContent=msg}}}})}

function pageReset(){return `<div class="auth"><div class="card auth-card stack">
    <div class="auth-logo">${$('.brand svg').outerHTML.replace('width="32" height="32"','width="44" height="44"')}<div><h1>Start over</h1><p class="note">Reset Blue Board on this device.</p></div></div>
    <p>This signs you out and clears everything the app saved in this browser: jobs, crew, photos, schedule and settings that live only on this device.</p>
    <div class="insight good"><b>Safe</b><span>Your account and anything already synced to it stay in the cloud. Sign back in to get it back.</span></div>
    <button class="btn primary big" data-act="reset-device">Start over</button>
    <a class="btn ghost" href="#/schedule">Cancel</a></div></div>`}
/* ----- actions & forms ----- */
Object.assign(ACT,{
  'auth-tab':a=>{UI.authTab=a.dataset.v;route()},
  'go-local':()=>{LS.set('local','1');CLOUD.mode='local';location.hash='#/schedule';route()},
  'signout':async a=>{closeMenu();if(isOwnerCloud()&&LS.get('dirty')==='1'&&!armTwoStep(a,'Changes not synced yet. Tap again'))return;
    clearInterval(CLOUD.pollT);try{await CLOUD.sb.auth.signOut()}catch(e){}
    if(isOwnerCloud()){S=blank();if(!memOnly){await DB.put('kv','state',S).catch(()=>{});await DB.clear('photos').catch(()=>{})}}
    else if(isEmp()){S=blank();if(!memOnly){const st=await DB.get('kv','state').catch(()=>null);if(st)S=normState(st)}}
    ['role','stateAt','dirty','company','empCache','local'].forEach(k=>LS.set(k,null));Object.assign(CLOUD,{mode:'signedout',user:null,company:null,employeeId:null,punches:[],members:[],pub:null,sync:''});
    location.hash='#/schedule';route();toast('Signed out')},
  'clock-in':async a=>{const jobId=$('#clock-job')?.value;if(!jobId)return toast('Pick a job first');a.disabled=true;a.textContent='Getting location…';
    const loc=await getLoc();if(!loc&&S.settings.requireLocation){a.disabled=false;a.textContent='Clock in';return toast('Turn on location for this app, then try again')}
    a.textContent='Clocking in…';const {data,error}=await CLOUD.sb.rpc('clock_in',{p_company:CLOUD.company,p_job:jobId,p_lat:loc?.lat??null,p_lng:loc?.lng??null,p_acc:loc?.acc??null});
    if(error){a.disabled=false;a.textContent='Clock in';return toast(errMsg(error))}CLOUD.punches.unshift(data);toast('Clocked in at '+timeOf(data.in_at));route()},
  'clock-out':async a=>{const note=$('#clock-note')?.value||'';a.disabled=true;a.textContent='Getting location…';const loc=await getLoc();
    if(!loc&&S.settings.requireLocation){a.disabled=false;a.textContent='Clock out';return toast('Turn on location for this app, then try again')}
    a.textContent='Clocking out…';const {data,error}=await CLOUD.sb.rpc('clock_out',{p_lat:loc?.lat??null,p_lng:loc?.lng??null,p_acc:loc?.acc??null,p_note:note});
    if(error){a.disabled=false;a.textContent='Clock out';return toast(errMsg(error))}CLOUD.punches=CLOUD.punches.map(p=>p.id===data.id?data:p);
    toast(`Clocked out · ${hrs((new Date(data.out_at)-new Date(data.in_at))/36e5)}`);route()},
  'invite':a=>inviteDialog(emp(a.dataset.id)),
  'reset-device':async a=>{if(!armTwoStep(a,'Tap again to erase this device'))return;a.disabled=true;
    try{if(CLOUD.sb&&CLOUD.user)await CLOUD.sb.auth.signOut()}catch(e){}
    try{Object.keys(localStorage).filter(k=>k.startsWith('cm.')||/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
    if(!memOnly){await DB.clear('kv').catch(()=>{});await DB.clear('photos').catch(()=>{})}
    location.hash='#/schedule';location.reload()},
});
document.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='auth-form'){e.preventDefault();const sb=sbClient(),err=$('#auth-err'),btn=$('[type=submit]',f);if(!sb){err.hidden=false;err.textContent='Can\'t reach the sign-in service. Check your connection.';return}
    const email=f.email.value.trim(),password=f.password.value;if(!email||password.length<6){err.hidden=false;err.textContent='Enter your email and a password of at least 6 characters.';return}
    btn.disabled=true;err.hidden=true;try{const up=f.dataset.tab==='up';
      const {data,error}=up?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(error)throw error;
      if(!data.session){err.hidden=false;err.textContent='Check your email for a confirmation link, then come back and sign in.';return}
      CLOUD.user=data.session.user;LS.set('local',null);await loadMembership();location.hash='#/schedule';route();toast(up?'Account created':'Signed in')}
    catch(x){err.hidden=false;err.textContent=/invalid login/i.test(errMsg(x))?'Wrong email or password.':errMsg(x)}finally{btn.disabled=false}}
  else if(f.id==='create-co'){e.preventDefault();const name=f.company.value.trim();if(!name)return toast('Enter your company name');const btn=$('[type=submit]',f);btn.disabled=true;
    const {data,error}=await CLOUD.sb.rpc('create_company',{p_name:name});if(error){btn.disabled=false;return toast(errMsg(error))}
    Object.assign(CLOUD,{mode:'owner',company:data});LS.set('role',JSON.stringify({mode:'owner',company:data}));
    const st=await CLOUD.sb.from('company_state').select('data,updated_at').eq('company_id',data).maybeSingle();
    if(st.data){S=normState(st.data.data||{});CLOUD.stateAt=st.data.updated_at}else{S.profile=Object.assign(S.profile||{},{company:name});await cloudPush();uploadAllPhotos()}
    if(!memOnly)DB.put('kv','state',S).catch(()=>{});startPolling();location.hash='#/schedule';route();toast('Your company is set up')}
  else if(f.id==='join-co'){e.preventDefault();const code=f.code.value.trim().toUpperCase();if(!code)return;LS.set('invite',code.replace(/[^A-Z0-9]/g,''));
    if(await acceptPending()){await loadMembership();location.hash='#/schedule';route()}}
  else if(f.id==='empapp-form'){e.preventDefault()}});
document.addEventListener('change',e=>{const f=e.target.closest('#empapp-form');if(!f)return;S.settings.requireLocation=f.requireLocation.checked;S.settings.showPay=f.showPay.checked;save();toast('Saved')});

/* ---------- sample data ---------- */

/* ---------- start ---------- */
(async()=>{const slow=setTimeout(()=>{$('#view').innerHTML=emptyBox('Still opening your saved data… If this doesn\'t clear in a few seconds, close any other Blue Board tabs or windows and reload.')},4000);
  try{await DB.open();const st=await DB.get('kv','state');if(st){S=Object.assign(blank(),st,{settings:Object.assign(blank().settings,st.settings||{}),profile:st.profile||{}});if(S.settings.company&&!S.profile.company)S.profile.company=S.settings.company;if(S.profile.accent==='green')S.profile.accent='blue';S.employees.forEach(e=>{if(e.color==='#2e8b57')e.color='#0e7490';if(e.color==='#1f8a8a')e.color='#4f46e5'})}}
  catch(e){memOnly=true;setTimeout(()=>toast('Storage is blocked here, so changes won\'t be kept'),400)}
  clearTimeout(slow);
  try{await Promise.race([cloudStart(),new Promise(r=>setTimeout(r,9000))])}catch(e){CLOUD.mode=LS.get('local')==='1'?'local':'signedout'}
  route();if(isOwnerCloud())Promise.all([ownerPunches(),loadMembers()]).then(()=>softRender()).catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
