      if(isNew)S.customers.push(o);else for(const j of S.jobs)if(j.customerId===o.id&&(j.client===old||!j.client))j.client=o.name;
      save();toast(isNew?'Customer added':'Saved');if(isNew)location.hash='#/customer/'+o.id}})}
// Link a job to a customer by its client name, creating the customer if new. Called when a job is saved.
function linkJobCustomer(j){const n=normName(j.client);if(!n){delete j.customerId;return}
  let c=S.customers.find(x=>normName(x.name)===n);if(!c){c={id:uid(),name:j.client.trim(),phone:j.phone||'',email:'',address:j.address||'',notes:''};S.customers.push(c)}
  else{if(!c.phone&&j.phone)c.phone=j.phone;if(!c.address&&j.address)c.address=j.address}j.customerId=c.id}

/* ---------- export for the accountant ---------- */
const csvCell=v=>{if(typeof v==='number')return String(Math.round(v*100)/100);v=String(v??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
function acctRange(){const y=new Date().getFullYear(),k=UI.acct||'ytd';
  return k==='last'?[`${y-1}-01-01`,`${y-1}-12-31`,`${y-1}`]:k==='12m'?[addDays(today(),-365),today(),'last-12-months']:k==='all'?['0000-01-01','9999-12-31','all-time']:[`${y}-01-01`,today(),`${y}`]}
function acctCSV(kind){const [from,to]=acctRange(),inR=d=>d&&d>=from&&d<=to,cn=j=>cust(j?.customerId)?.name||j?.client||'';
  if(kind==='invoices')return [['Invoice','Date','Due','Customer','Job','Subtotal','Sales tax','Total','Paid','Balance','Status'],
    ...S.docs.filter(d=>d.kind==='invoice'&&d.status!=='draft'&&inR(d.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(d=>{const t=docTotals(d),j=job(d.jobId);return [d.num,d.date,d.due||'',d.billTo?.name||cn(j),j?.name||'',t.sub,t.tax,t.total,t.paid,Math.max(0,t.balance),DOC_ST[docStatus(d)]?.[1]||'']})];
  if(kind==='payments')return [['Date','Invoice','Customer','Job','Method','Amount'],
    ...S.docs.filter(d=>d.kind==='invoice').flatMap(d=>(d.payments||[]).filter(p=>inR(p.date)).map(p=>{const j=job(d.jobId);return [p.date,d.num,d.billTo?.name||cn(j),j?.name||'',p.method||'',+p.amount||0]})).sort((a,b)=>a[0].localeCompare(b[0]))];
  if(kind==='expenses')return [['Date','Vendor','Category','Job','Description','Paid with','Amount','Receipt photo'],
    ...S.expenses.filter(x=>inR(x.date)).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.vendor||'',CAT_NAME[x.cat]||'Other',job(x.jobId)?.name||'',x.desc||'',x.paid||'',+x.amount||0,x.photoId?'Yes':'No'])];
  const L=laborCalc();return [['Job','Customer','Status','Start','Finish','Revenue','Materials','Labor','Subcontractors','Equipment','Other','Total cost','Profit','Margin %'],
    ...S.jobs.filter(j=>inR(j.end||j.start)||(j.status!=='done'&&k0(j))).map(j=>{const st=jobStats(j,L);return [j.name,cn(j),STATUS[j.status]||j.status,j.start||'',j.end||'',st.rev,st.cost.materials,st.cost.labor,st.cost.subs,st.cost.equipment,st.cost.other,st.total,st.profit,isFinite(st.margin)?Math.round(st.margin*1000)/10:'']})];
  function k0(j){return (j.start||'')<=to}}
function acctCard(){const k=UI.acct||'ytd',[from,to]=acctRange();
  const n={invoices:acctCSV('invoices').length-1,payments:acctCSV('payments').length-1,expenses:acctCSV('expenses').length-1,jobs:acctCSV('jobs').length-1};
  return `<div class="card stack"><h2>Export for your accountant</h2><p>Spreadsheet files (CSV) that open in Excel, Google Sheets or Numbers and import into QuickBooks.</p>
    <div class="seg" role="group" aria-label="Period">${[['ytd','This year'],['last','Last year'],['12m','Last 12 months'],['all','All time']].map(([v,l])=>`<button data-act="acct-range" data-v="${v}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>
    <div class="btns">${[['invoices','Invoices'],['payments','Payments received'],['expenses','Expenses'],['jobs','Job profit']].map(([v,l])=>`<button class="btn" data-act="acct-csv" data-v="${v}">${l} <small class="note">(${n[v]})</small></button>`).join('')}</div>
    <p class="note">${k==='all'?'Everything in Blue Board.':`${fmtDateY(from)} – ${fmtDateY(to)}.`} Payroll files are under Crew &amp; Pay → Payroll.</p></div>`}

/* ---------- punch lists ---------- */
// Tasks live on the job (j.tasks) and reach the crew through company_public. Crew tick them off with the
// set_task function (table task_checks); the owner's app merges those ticks back into the job.
const isoNow=()=>new Date().toISOString();
function taskDone(t){const c=(CLOUD.taskChecks||[]).find(x=>x.task_id===t.id);return c&&(!t.doneAt||c.done_at>t.doneAt)?c.done:!!t.done}
function tasksCard(j){const ts=j.tasks||[],open=ts.filter(t=>!t.done),done=ts.filter(t=>t.done);
  const li=t=>{const e=emp(t.empId);return `<li><label class="check grow" style="margin:0"><input type="checkbox" data-task="${t.id}"${t.done?' checked':''}><span${t.done?' style="text-decoration:line-through;color:var(--muted)"':''}>${esc(t.text)}${t.done&&t.doneBy?` <small class="note">· ${esc(t.doneBy)}</small>`:''}</span></label>
    ${e?`<span class="avatar sm" style="background:${e.color}" title="${esc(e.name)}">${esc(initials(e.name))}</span>`:''}<button class="btn sm ghost" data-act="task-edit" data-id="${t.id}" aria-label="Edit task">Edit</button></li>`};
  return `<div class="card"><div class="card-head"><h2>Punch list</h2>${ts.length?`<span class="note">${done.length} of ${ts.length} done</span>`:''}</div>
    ${ts.length?`<div class="bar" style="margin-bottom:8px"><i style="width:${Math.round(done.length/ts.length*100)}%"></i></div><ul class="list">${open.map(li).join('')}${done.map(li).join('')}</ul>`:''}
    <form class="task-add" id="task-add"><input name="text" placeholder="Add a task, e.g. Patch hallway drywall" maxlength="200" autocomplete="off">
      <select name="empId" aria-label="Assign to"><option value="">Anyone</option>${S.employees.filter(e=>e.active!==false).map(e=>opt(e.id,e.name.split(' ')[0],'')).join('')}</select><button class="btn sm primary" type="submit">Add</button></form>
    ${ts.length?'':`<p class="note" style="margin-top:8px">A checklist for this job.${isOwnerCloud()?' Your crew see their tasks and tick them off from their phones.':''}</p>`}</div>`}
function taskForm(j,t){openForm({title:'Edit task',
    body:`<div class="fields">${field('Task',inp('text',t.text,'text','required maxlength="200"'),'full')}
      ${field('Assigned to',`<select name="empId"><option value="">Anyone</option>${S.employees.filter(e=>e.active!==false||e.id===t.empId).map(e=>opt(e.id,e.name,t.empId)).join('')}</select>`,'full')}</div>`,
    onDelete:()=>{j.tasks=j.tasks.filter(x=>x.id!==t.id);save();toast('Task removed')},deleteLabel:'Remove task',
    onSubmit:fd=>{const text=fd.get('text').trim();if(!text){toast('Type the task');return false}Object.assign(t,{text,empId:fd.get('empId')});save();toast('Task saved')}})}
// Crew: their open tasks on jobs they're scheduled on this week (or assigned to them anywhere).
function myTasksCard(){const me=CLOUD.employeeId,wk=weekStart(today()),mine=new Set(S.shifts.filter(s=>s.empId===me&&s.date>=addDays(wk,-7)&&s.date<=addDays(wk,13)).map(s=>s.jobId));
  const rows=[];for(const j of S.jobs)for(const t of j.tasks||[])if(t.empId===me||(!t.empId&&mine.has(j.id)))rows.push({j,t,done:taskDone(t)});
  if(!rows.length)return '';const open=rows.filter(r=>!r.done);
  return `<div class="card"><div class="card-head"><h2>My tasks</h2><span class="note">${open.length} to do</span></div><ul class="list">
    ${rows.sort((a,b)=>a.done-b.done).slice(0,30).map(r=>`<li><label class="check grow" style="margin:0"><input type="checkbox" data-mytask="${r.t.id}" data-job="${r.j.id}"${r.done?' checked':''}><span${r.done?' style="text-decoration:line-through;color:var(--muted)"':''}>${esc(r.t.text)}<small class="note" style="display:block">${esc(r.j.name)}</small></span></label></li>`).join('')}</ul></div>`}
async function crewSetTask(jobId,taskId,done){if(!navigator.onLine)return queueTask(jobId,taskId,done);
  const {data,error}=await CLOUD.sb.rpc('set_task',{p_company:CLOUD.company,p_job:jobId,p_task:taskId,p_done:done});
  if(error){if(isNetErr(error))return queueTask(jobId,taskId,done);toast('Could not save: '+errMsg(error));return false}CLOUD.taskChecks=(CLOUD.taskChecks||[]).filter(x=>x.task_id!==taskId).concat([data]);
  if(done)notify({to:'owner',title:'Task done',body:`${emp(CLOUD.employeeId)?.name||'Crew'}: ${S.jobs.find(j=>j.id===jobId)?.tasks?.find(t=>t.id===taskId)?.text||'a task'}`,hash:'#/job/'+jobId});return true}
async function taskChecksLoad(){if(!CLOUD.sb||!CLOUD.company)return false;const {data,error}=await CLOUD.sb.from('task_checks').select('task_id,job_id,done,employee_id,done_at').eq('company_id',CLOUD.company);
  if(error)return false;CLOUD.taskChecks=data;if(isEmp())obTasks();if(!isOwnerCloud())return false;let ch=false;
  for(const c of data){const j=job(c.job_id),t=j?.tasks?.find(x=>x.id===c.task_id);if(!t)continue;
    if(!t.doneAt||c.done_at>t.doneAt){if(t.done!==c.done||t.doneAt!==c.done_at){Object.assign(t,{done:c.done,doneAt:c.done_at,doneBy:c.done?(emp(c.employee_id)?.name||'Crew'):''});ch=true}}}
  if(ch)save();return ch}

// After crew are scheduled, offer to text each person the details from the owner's own phone (Messages opens with the text filled in).
function smsLink(phone,body){const n=String(phone||'').replace(/[^\d+]/g,'');return n.replace(/\D/g,'').length>=7?`sms:${n}?&body=${encodeURIComponent(body)}`:''}
function crewText(e,list){const j=job(list[0].jobId)||{},ds=[...new Set(list.map(x=>x.date))].sort(),wk=d=>pd(d).toLocaleDateString('en-US',{weekday:'short'});
  const times=[...new Set(list.map(x=>`${fmtTime(x.start)}–${fmtTime(x.end)}`))],notes=[...new Set(list.map(x=>x.note).filter(Boolean))];
  const when=ds.length===1?`${wk(ds[0])} ${fmtDate(ds[0])}`:`${ds.length} days, ${wk(ds[0])} ${fmtDate(ds[0])} – ${wk(ds[ds.length-1])} ${fmtDate(ds[ds.length-1])}`;
  return [`Hi ${(e.name||'').split(' ')[0]}, you're scheduled on ${j.name||'a job'}.`,`When: ${when}, ${times.join(' / ')}`,j.address&&`Where: ${j.address}`,notes.length&&`Note: ${notes.join('; ')}`,`– ${S.profile?.company||S.profile?.name||'Blue Board'}`].filter(Boolean).join('\n')}
function offerCrewTexts(shifts){if(isEmp())return;const t=today(),by=new Map();
  for(const x of shifts||[]){if(x.status!=='scheduled'||x.date<t)continue;const k=x.empId+'|'+x.jobId;if(!by.has(k))by.set(k,[]);by.get(k).push(x)}
  if(!by.size)return;const rows=[...by.values()].map(list=>{const e=emp(list[0].empId)||{};return{e,msg:crewText(e,list)}});
  if(isOwnerCloud())for(const list of by.values())notify({employee_ids:[list[0].empId],title:'You\'re on the schedule',body:crewText(emp(list[0].empId)||{},list).split('\n').slice(0,3).join(' '),hash:'#/schedule'});
  setTimeout(()=>openForm({title:rows.length>1?'Text your crew?':`Text ${rows[0].e.name||'your crew'}?`,
    body:`<p class="note">Opens Messages on your phone with the details filled in. Tap Send to text them from your number.</p>
      <ul class="list">${rows.map((r,i)=>{const href=smsLink(r.e.phone,r.msg);return `<li style="display:block"><b>${esc(r.e.name||'Crew member')}</b><small style="display:block;white-space:pre-line;margin:4px 0 10px">${esc(r.msg)}</small>
        <div class="btns">${href?`<a class="btn sm primary" href="${esc(href)}" data-texted>Text</a>`:`<small class="note">No phone number</small>`}<button type="button" class="btn sm ghost" data-copy="${i}">Copy</button></div></li>`}).join('')}</ul>
      ${rows.some(r=>!smsLink(r.e.phone,''))?'<p class="note">Add phone numbers on <b>Crew &amp; Pay</b> to text people straight from here.</p>':''}`,
    closeLabel:'Done',onOpen:f=>{$$('[data-copy]',f).forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(rows[+b.dataset.copy].msg);toast('Copied. Paste it in a text.')}catch(err){toast('Could not copy')}});
      $$('[data-texted]',f).forEach(a=>a.addEventListener('click',()=>{a.textContent='Opened';a.classList.remove('primary')}))}}),250)}
function shiftForm(s,pre={}){const isNew=!s;
  const past=d=>d<today();
  s=s||{empId:pre.empId||S.employees.find(e=>e.active!==false)?.id,jobId:pre.jobId||S.jobs.find(j=>j.status==='active')?.id||S.jobs[0]?.id,date:pre.date||today(),start:'07:00',end:'15:30',breakMin:30,status:pre.status||(past(pre.date||today())?'worked':'scheduled')};
  const lock=!isNew&&closedFor(s.date);
  if(lock){const e=emp(s.empId),j=job(s.jobId);openForm({title:'Shift',
    body:`<p><b>${esc(e?.name||'Removed')}</b> · ${esc(j?.name||'Job removed')}<br>${fmtDate(s.date)}, ${fmtTime(s.start)}–${fmtTime(s.end)}${+s.breakMin?`, ${num(s.breakMin)} min break`:''} · ${hrs(shiftHours(s))}</p>
      <div class="insight"><b>Locked</b><span>The ${fmtDate(lock.from)} – ${fmtDate(lock.to)} pay period is closed, so these hours can't change. To fix them, reopen that period under Crew &amp; Pay → Payroll.</span></div>`});return}
  if(!S.employees.length){toast('Add an employee first');location.hash='#/crew';return}
  if(!S.jobs.length){toast('Add a job first');location.hash='#/jobs';return}
  const jobs=S.jobs.filter(j=>j.status!=='done'||j.id===s.jobId);
  openForm({title:isNew?'Add shift':'Edit shift',
    body:`<div class="fields">
      ${field('Employee',`<select name="empId">${S.employees.filter(e=>e.active!==false||e.id===s.empId).map(e=>opt(e.id,e.name,s.empId)).join('')}</select>`)}
      ${field('Job',`<select name="jobId">${(jobs.length?jobs:S.jobs).map(j=>opt(j.id,j.name,s.jobId)).join('')}</select>`)}
      ${field('Date',inp('date',s.date,'date'),'full')}</div>
      <div class="fields three keep times">${field('Start',inp('start',s.start,'time'))}${field('End',inp('end',s.end,'time'))}${field('Break (min)',inp('breakMin',s.breakMin,'number','min="0" step="5" inputmode="numeric"'))}</div>
      <p class="note" id="sh-hours"></p>
      ${field('Status',`<select name="status">${[['scheduled','Scheduled'],['worked','Worked (counts toward pay & job cost)'],['missed','Missed / called off']].map(([k,l])=>opt(k,l,s.status)).join('')}</select>`)}
      ${field('Note',inp('note',s.note,'text','placeholder="Task, materials to bring…"'))}
      ${s.source==='clock'?`<div class="insight good"><b>From the clock</b><span>Clocked in and out on the app. ${pins(s.loc?.in?.[0],s.loc?.in?.[1],'In')}${pins(s.loc?.out?.[0],s.loc?.out?.[1],'Out')}</span></div>`:''}
      ${isNew?`<label class="check"><input type="checkbox" name="repeat"> Also add for the rest of this work week (Mon–Fri)</label>`:''}`,
    onOpen:f=>{const upd=()=>{const h=shiftHours({start:f.start.value,end:f.end.value,breakMin:f.breakMin.value});const e=emp(f.empId.value);
        $('#sh-hours').textContent=`${hrs(h)} · about ${money2(h*(e?.rate||0))} in wages`};f.addEventListener('input',upd);upd()},
    onDelete:isNew?null:async()=>{if(s.punchId&&isOwnerCloud()){await CLOUD.sb.from('punches').delete().eq('id',s.punchId);CLOUD.punches=CLOUD.punches.filter(p=>p.id!==s.punchId)}const un=payTouch(s.empId,s.date);S.shifts=S.shifts.filter(x=>x.id!==s.id);save();toast(un?'Shift deleted. Approval removed, approve these hours again.':'Shift deleted')},
    onSubmit:(fd,f)=>{const e=emp(fd.get('empId'));const off=fd.get('status')==='scheduled'&&offOn(fd.get('empId'),fd.get('date')||today());
      if(off&&f.dataset.offok!=='1'){f.dataset.offok='1';toast(`${e?.name||'They'} ${e?'is':'are'} off ${offRange(off)}. Tap Save again to book anyway.`);return false}
      const base={empId:fd.get('empId'),jobId:fd.get('jobId'),start:fd.get('start')||'07:00',end:fd.get('end')||'15:30',breakMin:num(fd.get('breakMin')),status:fd.get('status'),note:fd.get('note').trim()};
      const date=fd.get('date')||today();const again=' Approval removed, approve these hours again.';
      if(isNew){const dates=[date];if(fd.get('repeat')){let d=addDays(date,1);while(pd(d).getDay()!==6&&pd(d).getDay()!==0){dates.push(d);d=addDays(d,1)}}
        const shut=dates.find(d=>closedFor(d));if(shut){toast(`The pay period with ${fmtDate(shut)} is closed. Reopen it under Crew & Pay first.`);return false}
        let un=false;const added=[];for(const d of dates){const ns={id:uid(),...base,date:d,rate:e.rate,burden:e.burden,status:fd.get('status')==='worked'&&d>today()?'scheduled':base.status};S.shifts.push(ns);added.push(ns);un=payTouch(base.empId,d)||un}
        save();toast((dates.length>1?`${dates.length} shifts added.`:'Shift added.')+(un?again:''));offerCrewTexts(added);return}
      if(closedFor(date)){toast(`The pay period with ${fmtDate(date)} is closed. Reopen it under Crew & Pay first.`);return false}
      let un=payTouch(s.empId,s.date);
      const moved=['empId','jobId','start','end'].some(k=>s[k]!==base[k])||s.date!==date;
      if(s.empId!==base.empId){s.rate=e.rate;s.burden=e.burden}Object.assign(s,base,{date});un=payTouch(s.empId,s.date)||un;save();toast(un?'Saved.'+again:'Saved');if(moved)offerCrewTexts([s])}})}

/* ---------- field tools: offline uploads, video, photo markup, before & after, voice notes, arrival alerts, customer photo links, importing ---------- */
const MAX_VIDEO=50*1024*1024;
const isVideoBlob=b=>!!b&&/^video\//.test(b.type||'');
const isVidPath=id=>/\.(mp4|mov|m4v|webm)$/i.test(String(id));
const mediaExt=b=>({'video/quicktime':'mov','video/mp4':'mp4','video/webm':'webm','image/png':'png'}[b?.type]||(isVideoBlob(b)?'mp4':'jpg'));
const isNetErr=e=>!navigator.onLine||/fetch|network|load failed|offline|timed? ?out|connection/i.test(String(e?.message||e||''));
const PLAY_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
const mediaTag=(id,video,alt='Job photo')=>video?`<video data-photo="${esc(id)}" muted playsinline preload="metadata" aria-label="${esc(alt)}"></video><span class="vid-badge">${PLAY_SVG}</span>`:`<img data-photo="${esc(id)}" alt="${esc(alt)}">`;
function forgetURL(id){const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}}
async function prepMedia(file){if(/^video\//.test(file.type||'')){if(file.size>MAX_VIDEO){toast('That video is too big. Keep videos under 50 MB, about a minute long.');return null}return file}return downscale(file)}

/* Owner photos: saved on the phone first, then uploaded from a queue that retries until it works. */
const UPQ={get(){try{return JSON.parse(LS.get('upq')||'[]')}catch(e){return[]}},set(a){a=[...new Set(a)];LS.set('upq',a.length?JSON.stringify(a):null)},
  add(id){this.set(this.get().concat(id))},del(id){this.set(this.get().filter(x=>x!==id))}};
let upBusy=false;
async function flushUploads(){if(upBusy||!isOwnerCloud()||!navigator.onLine)return;upBusy=true;
  try{for(const id of UPQ.get()){const b=memOnly?memPhotos.get(id):await DB.get('photos',id).catch(()=>null);if(!b){UPQ.del(id);continue}if(await uploadPhoto(id,b))UPQ.del(id);else break}}
  finally{upBusy=false;syncBadge()}}

/* Crew: reports, photos and task check-offs go into an outbox on the phone and send when there's signal. */
let OB=[];
async function obLoad(){try{if(!memOnly)OB=(await DB.get('kv','outbox'))||[]}catch(e){}}
function obSave(){if(!memOnly)DB.put('kv','outbox',OB).catch(()=>{})}
async function obBlobPut(k,b){if(memOnly)memPhotos.set(k,b);else await DB.put('photos',k,b)}
async function obBlobGet(k){return memOnly?memPhotos.get(k):DB.get('photos',k).catch(()=>null)}
async function obBlobDel(k){if(memOnly)memPhotos.delete(k);else await DB.del('photos',k).catch(()=>{})}
let obBusy=false;
async function flushOutbox(quiet){if(obBusy||!isEmp()||!CLOUD.sb||!CLOUD.user||!navigator.onLine||!OB.length)return 0;obBusy=true;let sent=0;
  try{for(const it of [...OB]){try{
      if(it.type==='task'){const {error}=await CLOUD.sb.rpc('set_task',{p_company:CLOUD.company,p_job:it.jobId,p_task:it.taskId,p_done:it.done});if(error)throw error}
      else if(it.type==='report'){const paths=[];
        for(const m of it.media){if(!m.path){m.path=`reports/${uid()}${uid()}.${m.ext}`;obSave()}
          if(!m.up){const b=await obBlobGet(m.key);if(b){const {error}=await CLOUD.sb.storage.from('photos').upload(`${CLOUD.company}/${m.path}`,b,{contentType:b.type||'image/jpeg'});if(error&&!/exist|duplicate/i.test(error.message||''))throw error}m.up=true;obSave()}
          paths.push(m.path)}
        const {error}=await CLOUD.sb.from('daily_reports').insert({company_id:CLOUD.company,user_id:CLOUD.user.id,employee_id:CLOUD.employeeId,job_id:it.jobId,date:it.date,notes:it.notes,photos:paths});if(error)throw error;
        for(const m of it.media)await obBlobDel(m.key);
        notify({to:'owner',title:'Daily report',body:`${emp(CLOUD.employeeId)?.name||'Crew'} · ${job(it.jobId)?.name||'Job'}: ${it.notes.slice(0,140)||'photos added'}`,hash:'#/job/'+it.jobId})}
      OB=OB.filter(x=>x.id!==it.id);obSave();sent++}
    catch(e){if(isNetErr(e))break;it.tries=(it.tries||0)+1;if(it.tries>=5){OB=OB.filter(x=>x.id!==it.id);toast(`A ${it.type==='task'?'task check-off':'report'} couldn't be sent: ${errMsg(e)}`)}obSave()}}}
  finally{obBusy=false}
  if(sent){await empExtrasLoad();if(!quiet){softRender();toast(sent===1?'Saved item sent':`${sent} saved items sent`)}}
  return sent}
function obTasks(){for(const it of OB)if(it.type==='task')CLOUD.taskChecks=(CLOUD.taskChecks||[]).filter(x=>x.task_id!==it.taskId).concat([{task_id:it.taskId,job_id:it.jobId,done:it.done,employee_id:CLOUD.employeeId,done_at:new Date(it.at).toISOString()}])}
function queueTask(jobId,taskId,done){OB=OB.filter(x=>!(x.type==='task'&&x.taskId===taskId));OB.push({id:uid(),type:'task',jobId,taskId,done,at:Date.now()});obSave();obTasks();toast('Saved. It will sync when you have signal.');return true}

/* Voice notes: a mic button where the browser can turn speech into text. Elsewhere the keyboard's mic does it. */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=name=>SR?`<button type="button" class="mic" data-mic="${name}" aria-label="Talk instead of typing" title="Talk instead of typing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>`:'';
const VOICE_TIP=SR?'':'<p class="note">Tip: tap the microphone on your keyboard to talk instead of typing.</p>';
let micRec=null;
document.addEventListener('click',e=>{const b=e.target.closest('[data-mic]');if(!b)return;e.preventDefault();const el=b.closest('form')?.elements[b.dataset.mic];if(!el||!SR)return;
  if(micRec){micRec.stop();return}const r=new SR();micRec=r;r.lang=navigator.language||'en-US';r.interimResults=false;b.classList.add('on');
  r.onresult=ev=>{const t=[...ev.results].map(x=>x[0].transcript).join(' ').trim();if(t)el.value=(el.value.trim()?el.value.trim()+' ':'')+t};
  r.onend=r.onerror=()=>{b.classList.remove('on');micRec=null};try{r.start()}catch(err){micRec=null;b.classList.remove('on')}});

/* Photo markup: arrows, circles, freehand and text labels, drawn with a thumb. Resolves to a new JPEG, or null if cancelled. */
function markup(blob){return new Promise(async done=>{let bmp;try{bmp=await createImageBitmap(blob)}catch(e){toast('That photo can\'t be marked up');return done(null)}
  const W=bmp.width,H=bmp.height,sw=Math.max(4,Math.round(Math.max(W,H)/170)),shapes=[];let tool='arrow',color='#FF3B30',cur=null;
  const TOOLS=[['arrow','Arrow'],['circle','Circle'],['pen','Draw'],['text','Text']],COLORS=[['#FF3B30','Red'],['#FFCC00','Yellow'],['#2D5BFF','Blue'],['#FFFFFF','White']];
  const d=document.createElement('dialog');d.className='mk';
  d.innerHTML=`<div class="mk-top"><button type="button" class="btn ghost sm" data-mk="cancel">Cancel</button><span class="sp"></span><button type="button" class="btn sm" data-mk="undo">Undo</button><button type="button" class="btn primary sm" data-mk="save">Save</button></div>
    <div class="mk-stage"><canvas width="${W}" height="${H}"></canvas></div>
    <div class="mk-bottom"><input class="mk-text" placeholder="Type a label, then tap the photo where it goes" maxlength="40" hidden>
      <div class="mk-row"><div class="seg" role="group" aria-label="Tool">${TOOLS.map(([k,l])=>`<button type="button" data-tool="${k}" aria-pressed="${k===tool}">${l}</button>`).join('')}</div>
      <div class="mk-colors" role="group" aria-label="Color">${COLORS.map(([c,l])=>`<button type="button" data-color="${c}" aria-label="${l}" aria-pressed="${c===color}" style="background:${c}"></button>`).join('')}</div></div></div>`;
  document.body.appendChild(d);const cv=d.querySelector('canvas'),ctx=cv.getContext('2d'),txt=d.querySelector('.mk-text');
  const draw=s=>{ctx.lineCap='round';ctx.lineJoin='round';
    for(const pass of [0,1]){ctx.strokeStyle=ctx.fillStyle=pass?s.color:'rgba(0,0,0,.45)';ctx.lineWidth=pass?sw:sw+Math.max(3,sw*.6);
      if(s.t==='pen'){ctx.beginPath();s.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
      else if(s.t==='circle'){ctx.beginPath();ctx.ellipse((s.x1+s.x2)/2,(s.y1+s.y2)/2,Math.max(2,Math.abs(s.x2-s.x1)/2),Math.max(2,Math.abs(s.y2-s.y1)/2),0,0,Math.PI*2);ctx.stroke()}
      else if(s.t==='arrow'){const a=Math.atan2(s.y2-s.y1,s.x2-s.x1),h=sw*4.5;ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);
        ctx.moveTo(s.x2-h*Math.cos(a-.5),s.y2-h*Math.sin(a-.5));ctx.lineTo(s.x2,s.y2);ctx.lineTo(s.x2-h*Math.cos(a+.5),s.y2-h*Math.sin(a+.5));ctx.stroke()}
      else if(s.t==='text'){ctx.font=`800 ${sw*7}px Manrope, system-ui, sans-serif`;ctx.textBaseline='middle';if(pass)ctx.fillText(s.text,s.x,s.y);else{ctx.lineWidth=sw*1.6;ctx.strokeText(s.text,s.x,s.y)}}}};
  const render=()=>{ctx.drawImage(bmp,0,0);shapes.forEach(draw);if(cur)draw(cur)};render();
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const [x,y]=pt(e);
    if(tool==='text'){const t=txt.value.trim();if(!t){txt.focus();toast('Type the label first');return}shapes.push({t:'text',x,y,text:t,color});txt.value='';render();return}
    try{cv.setPointerCapture(e.pointerId)}catch(err){}cur=tool==='pen'?{t:'pen',pts:[[x,y]],color}:{t:tool,x1:x,y1:y,x2:x,y2:y,color};render()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;const [x,y]=pt(e);if(cur.t==='pen')cur.pts.push([x,y]);else{cur.x2=x;cur.y2=y}render()});
  const end=()=>{if(!cur)return;if(cur.t==='pen'?cur.pts.length>1:Math.hypot(cur.x2-cur.x1,cur.y2-cur.y1)>sw*2)shapes.push(cur);cur=null;render()};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const close=v=>{d.close();d.remove();try{bmp.close()}catch(e){}done(v)};
  d.addEventListener('cancel',e=>{e.preventDefault();close(null)});
  d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tool){tool=b.dataset.tool;$$('[data-tool]',d).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));txt.hidden=tool!=='text';if(tool==='text')txt.focus()}
    else if(b.dataset.color){color=b.dataset.color;$$('[data-color]',d).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}
    else if(b.dataset.mk==='undo'){shapes.pop();render()}
    else if(b.dataset.mk==='cancel')close(null);
    else if(b.dataset.mk==='save'){if(!shapes.length)return close(null);cur=null;render();cv.toBlob(o=>close(o),'image/jpeg',.86)}});
  d.showModal()})}

/* Picked photos and videos inside a form, before they're saved. Tap a photo to mark it up. */
function mediaPicker(f,picks){const list=$('.mp-list',f);
  const draw=()=>{list.innerHTML=picks.map((p,i)=>`<div class="mp-item"><button type="button" class="mp-open" data-i="${i}" aria-label="${p.video?'Video':'Mark up photo'}">${p.video?`<video src="${p.url}#t=0.1" muted playsinline preload="metadata"></video><span class="vid-badge">${PLAY_SVG}</span>`:`<img src="${p.url}" alt="">`}</button><button type="button" class="mp-x" data-x="${i}" aria-label="Remove">×</button></div>`).join('');
    const n=$('.mp-note',f);if(n)n.hidden=!picks.some(p=>!p.video)};
  f.addEventListener('change',async e=>{if(!e.target.matches('[data-mp]'))return;const files=[...e.target.files];e.target.value='';
    for(const file of files){const b=await prepMedia(file);if(b)picks.push({blob:b,url:URL.createObjectURL(b),video:isVideoBlob(b)})}draw()});
  list.addEventListener('click',async e=>{const x=e.target.closest('[data-x]');if(x){const p=picks.splice(+x.dataset.x,1)[0];URL.revokeObjectURL(p.url);draw();return}
    const o=e.target.closest('[data-i]');if(!o)return;const p=picks[+o.dataset.i];if(p.video)return;const out=await markup(p.blob);if(out){URL.revokeObjectURL(p.url);Object.assign(p,{blob:out,url:URL.createObjectURL(out)});draw()}});
  draw()}
const mediaPickerHTML=()=>`<div class="btns"><label class="btn sm" style="flex-direction:row;color:var(--ink)">Take photo or video<input type="file" accept="image/*,video/*" capture="environment" data-mp hidden></label><label class="btn sm" style="flex-direction:row;color:var(--ink)">Choose from library<input type="file" accept="image/*,video/*" multiple data-mp hidden></label></div>

/* Arrival alerts: when someone opens the app at a job's location, offer that job. */
const distM=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
async function geoCheck(){if(LS.get('geo')!=='1'||document.hidden)return;if(Date.now()-(geoCheck.t||0)<60000)return;geoCheck.t=Date.now();
  const loc=await getLoc();if(!loc)return;let best=null;
  for(const j of S.jobs){if(j.status==='done'||j.lat==null)continue;const d=distM(loc.lat,loc.lng,j.lat,j.lng);if(d<=150+Math.min(loc.acc||0,100)&&(!best||d<best.d))best={j,d}}
  const id=best?.j.id||null;if(id!==UI.nearJob){UI.nearJob=id;softRender()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)geoCheck()});
function nearBanner(page,id){const j=job(UI.nearJob);if(!j||j.status==='done'||(page==='job'&&id===j.id)||LS.get('nearHide')===j.id+today())return '';
  const crew=isEmp(),onClock=crew&&CLOUD.punches.some(p=>!p.out_at);
  return `<div class="near"><span class="near-pin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
    <div class="grow"><b>You're at ${esc(j.name)}</b><small>${esc(j.address||'Near this job')}</small></div>
    <div class="btns">${crew?`${onClock?'':`<button class="btn sm primary" data-act="clock-in" data-job="${j.id}">Clock in here</button>`}<button class="btn sm" data-act="near-report">Photos &amp; report</button>`

function quickCapture(jobId){const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.capture='environment';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;const id=await addPhoto(f,jobId);if(!id)return;save();toast('Saved to '+(job(jobId)?.name||'the job'));route()};i.click()}

/* Duplicate jobs: the same street address, or the spot you're standing on. */
const normAddr=s=>{let a=String(s||'').toLowerCase().split(',')[0].replace(/[.#]/g,' ');
  for(const [w,x] of [['street','st'],['avenue','ave'],['road','rd'],['drive','dr'],['lane','ln'],['court','ct'],['boulevard','blvd'],['place','pl'],['circle','cir'],['highway','hwy'],['north','n'],['south','s'],['east','e'],['west','w']])a=a.replace(new RegExp('\\b'+w+'\\b','g'),x);
  return a.replace(/\s+/g,' ').trim()};
function dupJobs(addr,exceptId,loc){const a=normAddr(addr);
  return S.jobs.filter(j=>j.id!==exceptId&&((a.length>4&&normAddr(j.address)===a)||(loc&&j.lat!=null&&distM(loc.lat,loc.lng,j.lat,j.lng)<100)))}
const dupHTML=list=>list.length?`<div class="insight warn"><b>Already a job here</b><span>${list.slice(0,3).map(j=>`<a href="#/job/${j.id}" data-dup-open>${esc(j.name)}</a> (${esc(STATUS[j.status]||j.status)})`).join(', ')}. Open it instead of making a second folder for the same address.</span></div>`:'';

/* Customer photo links: pick photos, get one link (and a PDF) for the homeowner or adjuster. */
const SHARE_TTL=365*24*3600;
function jobMedia(j){const own=S.photos.filter(p=>p.jobId===j.id&&p.kind!=='receipt').map(p=>({id:p.id,path:photoPath(p.id),video:p.type==='video',caption:p.caption||'',date:p.date,tag:p.tag||'',own:true}));
  const crew=(CLOUD.crewReports||[]).filter(r=>r.job_id===j.id).flatMap(r=>(r.photos||[]).map(ph=>({id:ph,path:photoPath(ph),video:isVidPath(ph),caption:'',date:r.date,tag:''})));
  return own.concat(crew).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function shareForm(j){if(!isOwnerCloud())return openForm({title:'Send photos',closeLabel:'Close',body:'<p>Create a free account (Settings) to send customers a photo link. Until then your photos stay on this device.</p>'});

      try{const s=await makeShare(j,ids,fd.get('title').trim()||j.name,fd.get('note').trim());setTimeout(()=>shareResult(s),60)}catch(e){toast(errMsg(e));btn.textContent='Make link';return false}}})}
async function makeShare(j,ids,title,note){const m=jobMedia(j),sel=ids.map(id=>m.find(x=>x.id===id)).filter(Boolean);
  for(const x of sel)if(x.own){const b=await photoGet(x.id);if(!b||!(await uploadPhoto(x.id,b)))throw new Error('Couldn\'t upload the photos. Check your signal and try again.');UPQ.del(x.id)}
  const {data,error}=await CLOUD.sb.storage.from('photos').createSignedUrls(sel.map(x=>x.path),SHARE_TTL);if(error)throw error;
  const items=sel.map((x,i)=>({url:data[i]?.signedUrl,video:x.video,caption:x.caption,date:x.date,tag:x.tag})).filter(x=>x.url);
  if(!items.length)throw new Error('Couldn\'t get those photos ready. Try again.');
  const bef=items.filter(x=>x.tag==='before'&&!x.video),aft=items.filter(x=>x.tag==='after'&&!x.video),p=S.profile||{};
  const s={id:uid(),jobId:j.id,title,note,date:today(),count:items.length};const r=crypto.getRandomValues(new Uint8Array(18));s.token=[...r].map(x=>x.toString(16).padStart(2,'0')).join('');
  const snap={kind:'photos',title,note,date:today(),jobName:j.name,jobAddress:j.address||'',items,pair:bef.length&&aft.length?{before:bef[bef.length-1].url,after:aft[0].url}:null,
    company:{company:p.company||'',name:p.name||'',logo:p.logo||'',phone:p.phone||'',email:p.email||'',website:p.website||'',license:p.license||''},accent:p.accent||'blue'};
  const {error:e2}=await CLOUD.sb.from('shared_docs').upsert({token:s.token,company_id:CLOUD.company,doc_id:s.id,kind:'photos',data:snap,updated_at:new Date().toISOString()});
  if(e2){if(/check constraint|violates/i.test(e2.message||''))throw new Error('Photo links need a one-time database update in Supabase (the shared_docs part of supabase/schema.sql).');throw e2}
  (S.shares=S.shares||[]).push(s);save();return s}
function shareResult(s){const j=job(s.jobId),url=SITE_URL+'doc.html#'+s.token,c=j?.customerId?cust(j.customerId):null,first=(j?.client||'').split(' ')[0],co=S.profile?.company||'';
  const msg=`Hi${first?' '+first:''}, here are photos from ${co||'us'} of ${j?.name||'your job'}: ${url}`;

      <p class="note" style="margin-top:10px">Opens in any browser, no app or account needed. The page has a button to print or save it as a PDF, for an insurance adjuster for example. The link works for a year.</p>`,

    deleteLabel:'Turn off link',onDelete:async()=>{await CLOUD.sb.from('shared_docs').delete().eq('token',s.token).then(()=>{},()=>{});S.shares=(S.shares||[]).filter(x=>x.id!==s.id);save();toast('Link turned off')}})}

/* Importing from Jobber, CompanyCam or any spreadsheet. */
function parseCSV(t){t=String(t).replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
const IMPORT_FIELDS=[['email','Email',/e-?mail/],['name','Customer name',/^(display name|client( name)?|customer( name)?|full name|name|contact( name)?)$/],['first','First name',/first/],['last','Last name',/last ?name|surname/],
  ['company','Company',/company/],['phone','Phone',/phone|mobile|cell/],['job','Job or project name',/^(job|project)( title| name)?$|^(job|project) title$/],['street','Street address',/street|address|addr/],['city','City',/city|town/],
  ['state','State',/state|province|region/],['zip','ZIP',/zip|postal/],['status','Job status',/status/],['price','Job total ($)',/total|price|amount|value/],['start','Start date',/start|scheduled/],['notes','Notes',/note|description|instructions/]];
function guessMap(head){const used=new Set(),hasJob=head.some(h=>/job|project/i.test(h)),map={};
  for(const [k,,re] of IMPORT_FIELDS){let i=head.findIndex((h,x)=>!used.has(x)&&re.test(h.trim().toLowerCase()));if(i<0&&k==='job'&&hasJob)i=head.findIndex((h,x)=>!used.has(x)&&/^title$/i.test(h.trim()));if(i>=0){used.add(i);map[k]=i}else map[k]=-1}
  return map}
const impDate=s=>{s=String(s||'').trim();if(!s)return '';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?'':ds(d)};
const impStatus=s=>/complete|closed|archiv|paid|done|finish/i.test(s)?'done':/quote|bid|draft|request|estimate|lead/i.test(s)?'bid':'active';
function csvImport(text){const rows=parseCSV(text);if(rows.length<2)return toast('That file has no rows to import');
  const head=rows[0].map(h=>String(h).trim()),data=rows.slice(1),map=guessMap(head);
  const sel=(k)=>`<select name="m_${k}"><option value="-1">Not in this file</option>${head.map((h,i)=>opt(i,h+(data[0]?.[i]?` (e.g. ${String(data[0][i]).slice(0,24)})`:''),map[k])).join('')}</select>`;
  openForm({title:'Import customers & jobs',submit:`Import ${data.length} row${data.length>1?'s':''}`,
    body:`<p>We matched the columns in your file. Check them, then import. Customers already in Blue Board (same name, phone or email) are updated, not duplicated.</p>
      <div class="fields">${['name','first','last','company','phone','email','street','city','state','zip','job','status','price','start','notes'].map(k=>IMPORT_FIELDS.find(x=>x[0]===k)).map(([k,l])=>field(l,sel(k))).join('')}</div>
      <p class="note" style="margin-top:8px">Rows with a job or project name also create a job, unless a job with that name and address already exists.</p>`,
    onSubmit:fd=>{const m=Object.fromEntries(IMPORT_FIELDS.map(([k])=>[k,+fd.get('m_'+k)]));const g=(r,k)=>m[k]>=0?String(r[m[k]]??'').trim():'';
      let nc=0,uc=0,nj=0,sk=0;const digits=s=>String(s||'').replace(/\D/g,'').slice(-10);
      for(const r of data){const name=g(r,'name')||[g(r,'first'),g(r,'last')].filter(Boolean).join(' ')||g(r,'company'),phone=g(r,'phone'),email=g(r,'email');
        const address=[g(r,'street'),g(r,'city'),[g(r,'state'),g(r,'zip')].filter(Boolean).join(' ')].filter(Boolean).join(', ');
        if(name){let c=S.customers.find(x=>normName(x.name)===normName(name)||(digits(phone).length===10&&digits(x.phone)===digits(phone))||(email&&x.email&&x.email.toLowerCase()===email.toLowerCase()));
          if(c){let ch=false;for(const [k,v] of [['phone',phone],['email',email],['address',address]])if(v&&!c[k]){c[k]=v;ch=true}if(ch)uc++}
          else{S.customers.push({id:uid(),name,phone,email,address,notes:g(r,'company')&&g(r,'company')!==name?'Company: '+g(r,'company'):''});nc++}}
        const title=g(r,'job');if(!title)continue;
        if(S.jobs.some(j=>normName(j.name)===normName(title)&&(!address||!j.address||normAddr(j.address)===normAddr(address)))){sk++;continue}
        const o={id:uid(),createdAt:Date.now(),changeOrders:[],name:title,client:name,phone,address,status:m.status>=0?impStatus(g(r,'status')):'active',price:num(g(r,'price')),start:impDate(g(r,'start')),end:'',notes:g(r,'notes'),est:{},imported:true};
        linkJobCustomer(o);S.jobs.push(o);nj++}
      custSync();save();toast([nc&&`${nc} customer${nc>1?'s':''} added`,uc&&`${uc} updated`,nj&&`${nj} job${nj>1?'s':''} added`,sk&&`${sk} already here`].filter(Boolean).join(' · ')||'Nothing new to import')}})}

const UI={jobsFilter:'open',jobsQ:'',week:weekStart(today()),pay:'this-week',dash:'all',month:today().slice(0,7)+'-01',day:today()};
const statusBadge=s=>`<span class="badge ${s}">${STATUS[s]||s}</span>`;
const emptyBox=(msg,btns='')=>`<div class="empty"><p>${msg}</p>${btns?`<div class="btns">${btns}</div>`:''}</div>`;

function pageDashboard(){
  const L=laborCalc();
  if(!S.jobs.length)return `<div class="page-head"><div><h1>Profit</h1><p class="sub">Built to help you keep more of every dollar you bid. See which jobs make money, which ones don't, and why.</p></div></div>
    <div class="card stack"><h2>How this page maximizes your profit</h2>
    <ul class="list">
      <li><div class="grow"><b>Real profit on every job</b><small>Compares what you charged with everything it actually cost: materials, labor with overtime and burden, subs, equipment and fees.</small></div></li>
      <li><div class="grow"><b>Where your estimates miss</b><small>Shows which costs keep coming in over or under your bids, and by how much, so you can price the next job right.</small></div></li>
      <li><div class="grow"><b>Jobs going over budget</b><small>Flags open jobs that are eating into their margin while there's still time to fix it.</small></div></li>
    </ul>
    <p class="note">It fills in as you add jobs with their estimates, log expenses and track crew hours.</p>
    <div class="btns"><button class="btn primary" data-act="job-new">Add a job</button><button class="btn" data-act="sample">See it with sample data</button></div></div>`;
  const now=today(),y=now.slice(0,4),from={all:'',ytd:y+'-01-01','12m':addDays(now,-365)}[UI.dash];
  const done=S.jobs.filter(j=>j.status==='done'&&(!from||(j.end||'')>=from)).map(j=>({j,s:jobStats(j,L)}));
  const active=S.jobs.filter(j=>j.status==='active').map(j=>({j,s:jobStats(j,L)}));
  const rev=sum(done,x=>x.s.rev),cost=sum(done,x=>x.s.total),prof=rev-cost,estProf=sum(done,x=>x.s.estProfit);
  const wk=weekStart(now),wkShifts=S.shifts.filter(s=>s.date>=wk&&s.date<=addDays(wk,6));
  const wkH=sum(wkShifts.filter(s=>s.status!=='missed'),shiftHours);
  const wkCost=sum(wkShifts,s=>s.status==='worked'?(L.get(s.id)?.cost||0):s.status==='scheduled'?plannedCost(s):0);
  // estimating accuracy
  const acc=EST.map(([k,l])=>{const rows=done.filter(x=>(+x.j.est?.[k]||0)>0);const e=sum(rows,x=>x.j.est[k]),a=sum(rows,x=>x.s.cost[k]);return{k,l,n:rows.length,e,a,v:e?(a-e)/e:NaN}}).filter(r=>r.n);
  const insights=[];
  for(const r of acc){if(r.v>0.05)insights.push(['bad',`<b>${r.l} +${pct(r.v)}</b><span>${r.l} came in ${pct(r.v)} over your estimates across ${r.n} finished job${r.n>1?'s':''} (${money(r.a-r.e)}). Raise ${r.l.toLowerCase()} in your bids by about ${pct(r.v)}, or find out what's driving it.</span>`]);
    else if(r.v<-0.10)insights.push(['warn',`<b>${r.l} ${pct(r.v)}</b><span>You're estimating ${r.l.toLowerCase()} high (${pct(-r.v)} under on ${r.n} job${r.n>1?'s':''}). That padding could be costing you bids.</span>`])}
  const dm=rev?prof/rev:NaN,em=rev?estProf/rev:NaN;
  if(done.length&&isFinite(dm)&&isFinite(em)&&Math.abs(dm-em)>0.02)insights.unshift([dm<em?'bad':'good',`<b>Margin ${pct(dm)}</b><span>You bid these jobs at a ${pct(em)} margin and actually made ${pct(dm)}. ${dm<em?`That gap is ${money(estProf-prof)} you planned to keep but didn't.`:'Your jobs are beating their estimates.'}</span>`]);
  if(done.length&&!insights.length)insights.push(['good','<b>On target</b><span>Your finished jobs are landing close to their estimates.</span>']);
  const maxM=Math.max(.3,...done.map(x=>Math.abs(x.s.margin)||0));
  return `<div class="page-head"><div><h1>Profit</h1><p class="sub">Your real profit on every job, and where to tighten your estimates to keep more of each one.</p></div>
    <div class="seg" role="group" aria-label="Period">${[['all','All time'],['ytd','This year'],['12m','Last 12 months']].map(([k,l])=>`<button data-act="dash" data-v="${k}" aria-pressed="${UI.dash===k}">${l}</button>`).join('')}</div></div>
  <div class="stack">
  <div class="kpis">
    <div class="kpi lead"><span>Revenue</span><b>${money(rev)}</b><small>${done.length} finished job${done.length===1?'':'s'}</small></div>
    <div class="kpi"><span>Job costs</span><b>${money(cost)}</b><small>materials, labor, subs &amp; fees</small></div>
    <div class="kpi"><span>Gross profit</span><b class="${prof<0?'neg':'pos'}">${money(prof)}</b><small>${isFinite(em)?`bid for ${money(estProf)}`:'&nbsp;'}</small></div>
    <div class="kpi"><span>Margin</span><b class="${dm<0?'neg':''}">${pct(dm,1)}</b><small>${isFinite(em)?`estimated ${pct(em,1)}`:'&nbsp;'}</small></div>
  </div>
  ${owedCard()}
  <div class="grid2">
    <div class="stack">
      <div class="card"><div class="card-head"><h2>Profit by job</h2><span class="note">finished jobs</span></div>
      ${done.length?`<div class="table-wrap"><table><thead><tr><th>Job</th><th class="n">Revenue</th><th class="n">Cost</th><th class="n">Profit</th><th class="n">Margin</th><th style="min-width:130px"><span class="sr">Margin bar</span></th><th class="n">vs bid</th></tr></thead><tbody>
        ${done.sort((a,b)=>(b.j.end||'').localeCompare(a.j.end||'')).map(({j,s})=>{const w=Math.min(1,Math.abs(s.margin||0)/maxM)*100;const vb=s.profit-s.estProfit;return `<tr class="click" data-href="#/job/${j.id}"><td><b>${esc(j.name)}</b><br><small class="muted">${fmtDateY(j.end)}</small></td><td class="n">${money(s.rev)}</td><td class="n">${money(s.total)}</td><td class="n ${s.profit<0?'neg':''}">${money(s.profit)}</td><td class="n">${pct(s.margin,1)}</td>
        <td><div class="mbar" title="${pct(s.margin,1)}"><div class="l">${s.margin<0?`<i style="width:${w}%"></i>`:''}</div><div class="r">${s.margin>0?`<i style="width:${w}%"></i>`:''}</div></div></td><td class="n ${s.estTotal?(vb<0?'neg':'pos'):''}">${s.estTotal?(vb>=0?'+':'')+money(vb):'–'}</td></tr>`}).join('')}
        </tbody></table></div>`:emptyBox('No finished jobs in this period yet. Mark a job <b>Done</b> to see its final profit here.')}</div>
      <div class="card"><div class="card-head"><h2>Estimating accuracy</h2><span class="note">estimate vs actual, finished jobs</span></div>
      ${acc.length?`<div class="table-wrap"><table><thead><tr><th>Category</th><th class="n">Estimated</th><th class="n">Actual</th><th class="n">Over / under</th></tr></thead><tbody>
        ${acc.map(r=>`<tr><td>${r.l} <small class="muted">· ${r.n} job${r.n>1?'s':''}</small></td><td class="n">${money(r.e)}</td><td class="n">${money(r.a)}</td><td class="n ${r.v>0.05?'neg':r.v<-0.05?'':'pos'}">${r.v>=0?'+':''}${pct(r.v,1)}</td></tr>`).join('')}</tbody></table></div>
        <div class="stack" style="gap:8px;margin-top:12px">${insights.map(([c,h])=>`<div class="insight ${c}">${h}</div>`).join('')}</div>`
        :emptyBox('Enter your estimate on each job (Edit job → Your estimate). Once jobs are finished, this shows which costs you under- or over-estimate.')}</div>
    </div>
    <div class="stack">
      <div class="card"><div class="card-head"><h2>Jobs in progress</h2><a class="btn sm" href="#/jobs">All jobs</a></div>
      ${active.length?`<ul class="list">${active.map(({j,s})=>`<li class="click" data-href="#/job/${j.id}"><span class="dot" style="background:${jobColor(j)}"></span><div class="grow"><b>${esc(j.name)}</b><small>${money(s.total)} spent of ${s.estTotal?money(s.estTotal)+' budget':'no budget set'} · ${money(s.rev)} contract${s.estTotal?` · projected profit <b class="${s.projProfit<0?'neg':''}">${money(s.projProfit)}</b>`:''}</small>
        ${s.estTotal?`<div class="bar" style="margin-top:6px"><i class="${s.used>1?'over':s.used>.85?'':'ok'}" style="width:${Math.min(100,s.used*100)}%"></i></div>`:''}</div><span class="num ${s.used>1?'neg':''}">${isFinite(s.used)?pct(s.used):''}</span></li>`).join('')}</ul>`:emptyBox('No active jobs.')}</div>
      <div class="card"><div class="card-head"><h2>This week's crew</h2><a class="btn sm" href="#/schedule">Schedule</a></div>
        <div class="kpis" style="grid-template-columns:1fr 1fr"><div><span class="note">Hours</span><div style="font-size:22px;font-weight:800" class="num">${hrs(wkH)}</div></div><div><span class="note">Labor cost</span><div style="font-size:22px;font-weight:800" class="num">${money(wkCost)}</div></div></div>
        <p class="note" style="margin-top:8px">Worked shifts at actual cost (with overtime and burden), scheduled shifts at their planned cost.</p></div>
    </div>
  </div></div>`}

function pageJobs(){const L=laborCalc();const q=UI.jobsQ.toLowerCase();
  const list=S.jobs.filter(j=>(UI.jobsFilter==='all'||(UI.jobsFilter==='open'?j.status!=='done':j.status===UI.jobsFilter))&&(!q||(j.name+' '+(j.client||'')+' '+(j.address||'')).toLowerCase().includes(q)))
    .sort((a,b)=>({active:0,bid:1,done:2}[a.status]-{active:0,bid:1,done:2}[b.status])||(b.start||'').localeCompare(a.start||''));
  return `<div class="page-head"><div><h1>Jobs</h1><p class="sub">${S.jobs.length} job${S.jobs.length===1?'':'s'} · tap one to see its money, photos and crew</p></div><button class="btn primary" data-act="job-new">+ New job</button></div>
  <div class="filters"><div class="seg" role="group" aria-label="Filter">${[['open','Open'],['active','Active'],['bid','Bids'],['done','Done'],['all','All']].map(([k,l])=>`<button data-act="jobs-filter" data-v="${k}" aria-pressed="${UI.jobsFilter===k}">${l}</button>`).join('')}</div>
    <input type="search" id="jobs-q" placeholder="Search jobs, clients, addresses" value="${esc(UI.jobsQ)}" aria-label="Search jobs"></div>
  ${list.length?`<div class="jobs">${list.map(j=>{const s=jobStats(j,L);return `<a class="job" href="#/job/${j.id}" style="--jc:${jobColor(j)}">
    <div class="t"><div><b>${esc(j.name)}</b><div class="small muted">${esc(j.client||'')}${j.client&&j.address?' · ':''}${esc(j.address||'')}</div></div>${statusBadge(j.status)}</div>
    <div class="row"><span>Contract</span><b class="num">${money(s.rev)}</b></div>
    <div class="row"><span>Spent so far</span><b class="num">${money(s.total)}</b></div>
    ${j.status==='done'?`<div class="row"><span>Profit</span><b class="num ${s.profit<0?'neg':'pos'}">${money(s.profit)} <small class="muted">${pct(s.margin)}</small></b></div>`
      :s.estTotal?`<div class="row"><span>Projected profit</span><b class="num ${s.projProfit<0?'neg':'pos'}">${money(s.projProfit)} <small class="muted">${pct(s.projMargin)}</small></b></div>`:''}
    ${s.estTotal?`<div><div class="row small"><span>Budget used</span><span class="num">${pct(s.used)} of ${money(s.estTotal)}</span></div><div class="bar" style="margin-top:4px"><i class="${s.used>1?'over':''}" style="width:${Math.min(100,s.used*100)}%"></i></div></div>`:''}
    </a>`}).join('')}</div>`:emptyBox(S.jobs.length?'No jobs match.':'No jobs yet.',`<button class="btn primary" data-act="job-new">+ New job</button>${S.jobs.length?'':'<button class="btn" data-act="sample">Load sample data</button>'}`)}`}

function pageJob(id){const j=job(id);if(!j)return emptyBox('That job was not found.','<a class="btn" href="#/jobs">Back to jobs</a>');
  const L=laborCalc(),s=jobStats(j,L);
  const exps=S.expenses.filter(e=>e.jobId===j.id).sort((a,b)=>b.date.localeCompare(a.date));
  const photos=S.photos.filter(p=>p.jobId===j.id&&p.kind!=='receipt').sort((a,b)=>b.date.localeCompare(a.date));
  const shifts=S.shifts.filter(x=>x.jobId===j.id);
  const byEmp={};for(const x of shifts){const r=byEmp[x.empId]=byEmp[x.empId]||{h:0,cost:0,wage:0,ph:0,pc:0};if(x.status==='worked'){const l=L.get(x.id);r.h+=l.h;r.cost+=l.cost;r.wage+=l.wage}else if(x.status==='scheduled'){r.ph+=shiftHours(x);r.pc+=plannedCost(x)}}
  const e=j.est||{};const isDone=j.status==='done';
  const mapUrl=j.address?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(j.address):'';
  const ins=[];
  for(const [k,l] of EST){const est=+e[k]||0,a=s.cost[k];if(est&&a>est*1.05)ins.push(['bad',`<b>${l}</b><span>${money(a-est)} over the estimate (${pct((a-est)/est)}).</span>`]);
    else if(est&&!isDone&&a>est*.85)ins.push(['warn',`<b>${l}</b><span>${pct(a/est)} of the ${l.toLowerCase()} budget used.</span>`])}
  if(!isDone&&s.planned){const le=+e.labor||0,lt=s.cost.labor+s.planned;ins.push([le&&lt>le?'bad':'',`<b>Scheduled</b><span>${hrs(s.plannedH)} of crew time still on the calendar (about ${money(s.planned)}). Labor so far plus scheduled: ${money(lt)}${le?` of the ${money(le)} labor estimate`:''}.</span>`])}
  if(!isDone&&s.estTotal)ins.push(['',`<b>Projection</b><span>Assumes each category ends at its estimate, or at what's already spent and scheduled if that's higher.</span>`]);
  return `<div class="page-head"><div><a href="#/jobs" class="note" style="text-decoration:none">← Jobs</a><h1 style="margin-top:4px">${esc(j.name)}</h1>
    <p class="sub">${j.customerId&&cust(j.customerId)?`<a href="#/customer/${j.customerId}">${esc(j.client||'')}</a>`:esc(j.client||'')}${j.phone?' · <a href="tel:'+esc(j.phone)+'">'+esc(j.phone)+'</a>':''}${j.address?` · <a href="${mapUrl}" target="_blank" rel="noopener">${esc(j.address)}</a>`:''}</p>
    <p class="sub">${statusBadge(j.status)} ${j.start?fmtDateY(j.start):''}${j.end?' – '+fmtDateY(j.end):''}</p></div>
    <div class="btns"><select id="job-status" aria-label="Job status" style="width:auto">${Object.entries(STATUS).map(([k,v])=>opt(k,v,j.status)).join('')}</select><button class="btn" data-act="job-edit">Edit job</button></div></div>
  <div class="stack">
  <div class="kpis">
    <div class="kpi lead"><span>Revenue</span><b>${money(s.rev)}</b><small>contract${(j.changeOrders||[]).length?' + '+j.changeOrders.length+' change order'+(j.changeOrders.length>1?'s':''):''}</small></div>
    <div class="kpi"><span>Costs ${isDone?'':'so far'}</span><b>${money(s.total)}</b><small>${s.estTotal?pct(s.used)+' of '+money(s.estTotal)+' estimate':'no estimate entered'}</small></div>
    ${isDone?`<div class="kpi"><span>Profit</span><b class="${s.profit<0?'neg':'pos'}">${money(s.profit)}</b><small>${s.estTotal?'bid for '+money(s.estProfit):'&nbsp;'}</small></div>
    <div class="kpi"><span>Margin</span><b class="${s.margin<0?'neg':''}">${pct(s.margin,1)}</b><small>${s.estTotal?'estimated '+pct(s.estMargin,1):'&nbsp;'}</small></div>`
    :`<div class="kpi"><span>Projected profit</span><b class="${s.projProfit<0?'neg':'pos'}">${money(s.projProfit)}</b><small>${s.estTotal?'bid for '+money(s.estProfit):'enter an estimate to project'}</small></div>
    <div class="kpi"><span>Projected margin</span><b class="${s.projMargin<0?'neg':''}">${pct(s.projMargin,1)}</b><small>${s.estTotal?'estimated '+pct(s.estMargin,1):'&nbsp;'}</small></div>`}
  </div>
  <div class="grid2"><div class="stack">
    <div class="card"><div class="card-head"><h2>Estimate vs actual</h2>${s.estTotal?'':'<button class="btn sm" data-act="job-edit">Add your estimate</button>'}</div>
      <div class="table-wrap"><table><thead><tr><th>Category</th><th class="n">Estimate</th><th class="n">Actual</th><th class="n">${isDone?'Difference':'Left in budget'}</th><th style="min-width:90px">Used</th></tr></thead><tbody>
      ${EST.map(([k,l])=>{const est=+e[k]||0,a=s.cost[k],u=est?a/est:NaN;return `<tr><td>${l}${k==='labor'&&s.hours?` <small class="muted">· ${hrs(s.hours)}</small>`:''}</td><td class="n">${est?money(est):'–'}</td><td class="n">${money(a)}</td><td class="n ${est&&a>est?'neg':''}">${!est?'–':isDone?(a-est>=0?'+':'')+money(a-est):money(est-a)}</td>
        <td>${est?`<div class="bar"><i class="${u>1?'over':''}" style="width:${Math.min(100,u*100)}%"></i></div>`:''}</td></tr>`}).join('')}</tbody>
      <tfoot><tr><td>Total</td><td class="n">${s.estTotal?money(s.estTotal):'–'}</td><td class="n">${money(s.total)}</td><td class="n ${s.estTotal&&s.total>s.estTotal?'neg':''}">${!s.estTotal?'–':isDone?(s.total-s.estTotal>=0?'+':'')+money(s.total-s.estTotal):money(s.estTotal-s.total)}</td><td></td></tr></tfoot></table></div>

function applyPunches(){let changed=false;
  // Learn where a job is from the first accurate crew clock-in there, for arrival alerts and duplicate checks.
  for(const p of CLOUD.punches){const j=job(p.job_id);if(j&&j.lat==null&&p.in_lat!=null&&p.in_acc!=null&&p.in_acc<=80){Object.assign(j,{lat:p.in_lat,lng:p.in_lng,locFrom:emp(p.employee_id)?.name||'crew'});changed=true}}
  for(const p of CLOUD.punches){if(!p.out_at||S.shifts.some(s=>s.punchId===p.id))continue;const e=emp(p.employee_id);if(!e)continue;
    const a=new Date(p.in_at),b=new Date(p.out_at),date=ds(a);
    const loc={in:p.in_lat!=null?[p.in_lat,p.in_lng]:null,out:p.out_lat!=null?[p.out_lat,p.out_lng]:null};
    const sched=S.shifts.find(s=>!s.punchId&&s.status==='scheduled'&&s.empId===e.id&&s.jobId===p.job_id&&s.date===date);
    const f={start:pad(a.getHours())+':'+pad(a.getMinutes()),end:pad(b.getHours())+':'+pad(b.getMinutes()),breakMin:+p.break_min||0,status:'worked',punchId:p.id,source:'clock',loc,note:p.note||sched?.note||''};
    if(sched)Object.assign(sched,f);else S.shifts.push({id:uid(),empId:e.id,jobId:p.job_id,date,rate:e.rate,burden:e.burden,...f});payTouch(e.id,date);changed=true}
  if(changed)save();return changed}

async function empLoad(){const sb=CLOUD.sb,cid=CLOUD.company;
  const [a,b,c]=await Promise.all([sb.from('company_public').select('data').eq('company_id',cid).maybeSingle(),
    sb.from('employee_private').select('rate').eq('company_id',cid).eq('employee_id',CLOUD.employeeId).maybeSingle(),
    sb.from('punches').select('*').eq('user_id',CLOUD.user.id).order('in_at',{ascending:false}).limit(400)]);
  if(a.error||c.error){CLOUD.sync='offline';if(!CLOUD.pub)empApplyCache();return}
  empApply(a.data?.data,b.data?.rate??null,c.data);CLOUD.sync='synced';
  LS.set('empCache',JSON.stringify({pub:a.data?.data,rate:b.data?.rate??null,punches:(c.data||[]).slice(0,120)}))}
function getLoc(){if(!navigator.geolocation)return Promise.resolve(null);

function myPayRows(from,to){const th=num(S.settings.otThreshold)||40,ot=S.settings.ot!==false,rate=+CLOUD.myRate||0,acc={},rows=[];
  for(const p of CLOUD.punches.filter(p=>p.out_at).sort((a,b)=>a.in_at.localeCompare(b.in_at))){const d=ds(new Date(p.in_at)),h=Math.max(0,(new Date(p.out_at)-new Date(p.in_at))/36e5-(+p.break_min||0)/60),k=weekStart(d),before=acc[k]||0;acc[k]=before+h;

/* ----- actions & forms ----- */
Object.assign(ACT,{
  'auth-resend':async a=>{const sb=sbClient(),err=$('#auth-err');a.disabled=true;

  'auth-tab':a=>{const em=$('#auth-form [name=email],#forgot-form [name=email]')?.value;if(em)UI.authEmail=em;UI.authTab=a.dataset.v;UI.authNote='';route()},
  'go-local':()=>{LS.set('local','1');CLOUD.mode='local';location.hash='#/schedule';route()},
  'signout':async a=>{closeMenu();if(isOwnerCloud()&&LS.get('dirty')==='1'&&!armTwoStep(a,'Changes not synced yet. Tap again'))return;
    clearInterval(CLOUD.pollT);await pushOff();try{await CLOUD.sb.auth.signOut()}catch(e){}
    if(isOwnerCloud()){S=blank();if(!memOnly){await DB.put('kv','state',S).catch(()=>{});await DB.clear('photos').catch(()=>{})}}
    else if(isEmp()){S=blank();if(!memOnly){const st=await DB.get('kv','state').catch(()=>null);if(st)S=normState(st)}}
    ['role','stateAt','dirty','company','empCache','local'].forEach(k=>LS.set(k,null));Object.assign(CLOUD,{mode:'signedout',user:null,company:null,employeeId:null,punches:[],members:[],pub:null,sync:''});
    location.hash='#/schedule';route();toast('Signed out')},
  'delete-account':()=>{closeMenu();const owner=isOwnerCloud();
    openForm({title:'Delete your account?',body:`<p>This permanently deletes your login (<b>${esc(CLOUD.user?.email||'')}</b>)${owner?' and your company: every job, expense, photo, schedule, crew member, invite and time punch. Your crew lose access too.':' and your clock-in history. Your boss keeps the hours already added to the schedule.'}</p><p><b>This can't be undone.</b>${owner?' Export a backup in Settings first if you want a copy.':''}</p>`,
      deleteLabel:'Delete my account',onDelete:async()=>{const sb=CLOUD.sb;
        {const {error}=await sb.rpc('delete_my_account',{p_confirm:false});if(error){toast(errMsg(error));throw error}}
        if(owner&&CLOUD.company){for(const pre of [CLOUD.company,CLOUD.company+'/reports'])try{for(let n=0;n<200;n++){const {data}=await sb.storage.from('photos').list(pre,{limit:100});const files=(data||[]).filter(o=>o.id);if(!files.length)break;const {error}=await sb.storage.from('photos').remove(files.map(o=>`${pre}/${o.name}`));if(error)break}}catch(e){}}
        if(owner&&typeof portalWipe==='function')await portalWipe();
        const {error}=await sb.rpc('delete_my_account',{p_confirm:true});if(error){toast(errMsg(error));throw error}
        clearInterval(CLOUD.pollT);try{await sb.auth.signOut({scope:'local'})}catch(e){}
        S=blank();if(!memOnly){await DB.put('kv','state',S).catch(()=>{});await DB.clear('photos').catch(()=>{})}
        ['role','stateAt','dirty','company','empCache','local','invite'].forEach(k=>LS.set(k,null));Object.assign(CLOUD,{mode:'signedout',user:null,company:null,employeeId:null,punches:[],members:[],pub:null,sync:''});
        location.hash='#/schedule';toast('Your account was deleted')}})},
  'clock-in':async a=>{const jobId=a.dataset.job||$('#clock-job')?.value;if(!jobId)return toast('Pick a job first');a.disabled=true;a.textContent='Getting location…';
    const loc=await getLoc();if(!loc&&S.settings.requireLocation){a.disabled=false;a.textContent='Clock in';return toast('Turn on location for this app, then try again')}
    a.textContent='Clocking in…';const {data,error}=await CLOUD.sb.rpc('clock_in',{p_company:CLOUD.company,p_job:jobId,p_lat:loc?.lat??null,p_lng:loc?.lng??null,p_acc:loc?.acc??null});
    if(error){a.disabled=false;a.textContent='Clock in';return toast(errMsg(error))}CLOUD.punches.unshift(data);toast('Clocked in at '+timeOf(data.in_at));route()},
  'break-toggle':async a=>{a.disabled=true;const {data,error}=await CLOUD.sb.rpc('break_toggle');
    if(error){a.disabled=false;return toast(/break_toggle/.test(error.message||'')?'Breaks aren\'t turned on yet. Ask your boss.':errMsg(error))}
    CLOUD.punches=CLOUD.punches.map(p=>p.id===data.id?data:p);toast(data.break_at?'Break started':`Break over · ${data.break_min} min so far`);route()},
  'clock-out':async a=>{const note=$('#clock-note')?.value||'';a.disabled=true;a.textContent='Getting location…';const loc=await getLoc();
    if(!loc&&S.settings.requireLocation){a.disabled=false;a.textContent='Clock out';return toast('Turn on location for this app, then try again')}
    a.textContent='Clocking out…';const {data,error}=await CLOUD.sb.rpc('clock_out',{p_lat:loc?.lat??null,p_lng:loc?.lng??null,p_acc:loc?.acc??null,p_note:note});
    if(error){a.disabled=false;a.textContent='Clock out';return toast(errMsg(error))}CLOUD.punches=CLOUD.punches.map(p=>p.id===data.id?data:p);
    toast(`Clocked out · ${hrs((new Date(data.out_at)-new Date(data.in_at))/36e5)}`);route()},
  'invite':a=>inviteDialog(emp(a.dataset.id)),
  'reset-device':async a=>{if(!armTwoStep(a,'Tap again to erase this device'))return;a.disabled=true;
    try{if(CLOUD.sb&&CLOUD.user)await CLOUD.sb.auth.signOut()}catch(e){}
    try{Object.keys(localStorage).filter(k=>k.startsWith('cm.')||/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
    if(!memOnly){await DB.clear('kv').catch(()=>{});await DB.clear('photos').catch(()=>{})}
    location.hash='#/schedule';location.reload()},
});
document.addEventListener('submit',async e=>{const f=e.target;
  if(f.id==='auth-form'){e.preventDefault();const sb=sbClient(),err=$('#auth-err'),btn=$('[type=submit]',f);if(!sb){err.hidden=false;err.textContent='Can\'t reach the sign-in service. Check your connection.';return}
    const email=f.email.value.trim(),password=f.password.value;if(!email||password.length<6){err.hidden=false;err.textContent='Enter your email and a password of at least 6 characters.';return}
    btn.disabled=true;err.hidden=true;try{const up=f.dataset.tab==='up';
      const code=up&&LS.get('invite'),joined=code?await joinWithCode(sb,code,email,password):false;
      const {data,error}=up&&!joined?await sb.auth.signUp({email,password,options:{emailRedirectTo:SITE_URL}}):await sb.auth.signInWithPassword({email,password});if(error)throw error;
      if(!data.session){err.hidden=false;err.textContent='Check your email for a confirmation link, then come back and sign in.';return}
      CLOUD.user=data.session.user;LS.set('local',null);await loadMembership();location.hash='#/schedule';route();toast(up?'Account created':'Signed in')}
    catch(x){err.hidden=false;const m=errMsg(x);if(/not confirmed/i.test(m)){err.innerHTML=`Your email isn't confirmed yet. Open the link we emailed you, or <button type="button" class="btn sm" data-act="auth-resend" data-email="${esc(email)}">Send the confirmation email again</button>`}else err.textContent=/invalid login/i.test(m)?'Wrong email or password.':m}finally{btn.disabled=false}}
  else if(f.id==='task-add'){e.preventDefault();const j=curJob(),text=f.text.value.trim();if(!j||!text)return;
    (j.tasks=j.tasks||[]).push({id:uid(),text,empId:f.empId.value,done:false,createdAt:isoNow()});save();UI.taskEmp=f.empId.value;route();const n=$('#task-add');if(n){n.empId.value=UI.taskEmp||'';n.text.focus()}}
  else if(f.id==='forgot-form'){e.preventDefault();const sb=sbClient(),msg=$('#forgot-msg'),btn=$('[type=submit]',f),email=f.email.value.trim();
    if(!sb){msg.hidden=false;msg.textContent='Can\'t reach the sign-in service. Check your connection.';return}
    if(!/^\S+@\S+\.\S+$/.test(email)){msg.hidden=false;msg.textContent='Enter the email you signed up with.';return}
    btn.disabled=true;UI.authEmail=email;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE_URL});btn.disabled=false;msg.hidden=false;
    msg.textContent=error?(/rate|seconds/i.test(errMsg(error))?'Please wait a minute before asking for another link.':errMsg(error)):'If there\'s an account for that email, a reset link is on its way. Open it, choose a new password, then sign in with it here. Check spam if you don\'t see it.'}
  else if(f.id==='newpw-form'){e.preventDefault();const err=$('#newpw-err'),btn=$('[type=submit]',f),pw=f.password.value;
    if(pw.length<6){err.hidden=false;err.textContent='Use at least 6 characters.';return}if(pw!==f.password2.value){err.hidden=false;err.textContent='The two passwords don\'t match.';return}
    btn.disabled=true;const {error}=await CLOUD.sb.auth.updateUser({password:pw});btn.disabled=false;
    if(error){err.hidden=false;err.textContent=/different from the old/i.test(errMsg(error))?'Pick a password you haven\'t used before.':errMsg(error);return}
    UI.recovery=false;location.hash='#/schedule';route();toast('Password updated')}
  else if(f.id==='create-co'){e.preventDefault();const name=f.company.value.trim();if(!name)return toast('Enter your company name');const btn=$('[type=submit]',f);btn.disabled=true;
    const {data,error}=await CLOUD.sb.rpc('create_company',{p_name:name});if(error){btn.disabled=false;return toast(errMsg(error))}
    Object.assign(CLOUD,{mode:'owner',company:data});LS.set('role',JSON.stringify({mode:'owner',company:data}));subLoad();
    const st=await CLOUD.sb.from('company_state').select('data,updated_at').eq('company_id',data).maybeSingle();
    if(st.data){S=normState(st.data.data||{});CLOUD.stateAt=st.data.updated_at}else{S.profile=Object.assign(S.profile||{},{company:name});await cloudPush();uploadAllPhotos()}
    if(!memOnly)DB.put('kv','state',S).catch(()=>{});startPolling();location.hash='#/schedule';route();toast('Your company is set up')}
  else if(f.id==='join-co'){e.preventDefault();const code=f.code.value.trim().toUpperCase();if(!code)return;LS.set('invite',code.replace(/[^A-Z0-9]/g,''));
    if(await acceptPending()){await loadMembership();location.hash='#/schedule';route()}}
  else if(f.id==='empapp-form'){e.preventDefault()}});
document.addEventListener('change',e=>{const f=e.target.closest('#empapp-form');if(!f)return;S.settings.requireLocation=f.requireLocation.checked;S.settings.showPay=f.showPay.checked;save();toast('Saved')});
