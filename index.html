<html lang="en">
<head>
<meta charset="utf-8">
<script>/* Website only: people who aren't signed in and haven't used Blue Board on this browser see the intro page (welcome.html) first. Never in the iPhone app or the installed web app, and never for links with a #route or ?query (email links, invites, sign in). */
(function(){try{if(!/^https?:$/.test(location.protocol)||window.Capacitor||navigator.standalone||matchMedia('(display-mode: standalone)').matches)return;
if((location.hash&&location.hash!=='#'&&location.hash!=='#/')||location.search)return;
if(Object.keys(localStorage).some(function(k){return k.indexOf('cm.')===0||/^sb-.*-auth-token/.test(k)}))return;
location.replace('welcome.html')}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Board</title>
<meta name="description" content="Organize every job, track expenses, purchases, photos and crew hours, and see the real profit on each job.">
<meta name="theme-color" content="#eef1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blue Board">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#f6f6f7;--surface:#ffffff;--surface2:#f3f4f6;--surface3:#e9ebee;--ink:#16191d;--muted:#5f6873;
  --line:rgba(16,24,40,.08);--line2:rgba(16,24,40,.14);
  --hi:#1f63c6;--hi-dk:#164a94;--hi-ink:#fff;--hi-soft:rgba(31,99,198,.10);--glow:rgba(31,99,198,.28);
  --top-solid:#fff;--nav-float:rgba(255,255,255,.94);--bar:#3b424b;--ph:#9aa1aa;
  --good:#1565c0;--good-bg:#e8f1fd;--bad:#c42b2b;--bad-bg:#fdeceb;--warn:#9a5b00;--warn-bg:#fff4dc;
  --nav:rgba(255,255,255,.88);--nav-ink:#16191d;--nav-muted:#5f6873;
  --r:20px;--r-sm:12px;--ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0c0e11;--surface:#15181c;--surface2:#1c2025;--surface3:#262b32;--ink:#eef0f3;--muted:#98a1ac;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --good:#6aaeff;--good-bg:rgba(106,174,255,.13);--bad:#ff7a7a;--bad-bg:rgba(255,92,92,.12);--warn:#f2b44c;--warn-bg:rgba(242,180,76,.12);
  --nav:rgba(12,14,17,.82);--nav-ink:#eef0f3;--nav-muted:#98a1ac;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.32);
  --top-solid:#0c0e11;--nav-float:rgba(21,24,28,.92);--bar:#c9d0d8;--ph:#6d7680;color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(1100px 420px at 0% -8%,color-mix(in srgb,var(--hi) 7%,transparent),transparent 62%),var(--bg);
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
img{max-width:100%}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
a{color:inherit}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.015em}
h1{font-size:26px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,a,input,select,textarea{transition:background-color .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease),transform .18s var(--ease)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);color:var(--nav-ink);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:2px solid var(--hi);box-shadow:0 6px 20px rgba(16,24,40,.06)}
.menu-wrap{position:relative;flex:none}
.icon-btn{appearance:none;border:1px solid var(--line);background:var(--surface2);color:var(--ink);width:42px;height:42px;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--surface3);border-color:var(--line2)}
.icon-btn svg{width:22px;height:22px}
.menu{position:absolute;top:calc(100% + 12px);left:0;width:260px;background:var(--surface);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 50px rgba(16,24,40,.16);padding:8px;z-index:50;
  transform-origin:top left;animation:pop .16s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu .who{display:flex;gap:12px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px;text-decoration:none;border-radius:12px 12px 0 0}
.menu .who b{display:block;font-size:15px}
.menu .who small{display:block;color:var(--muted);font-size:13px}
.menu a.item,.menu button.item{display:flex;width:100%;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;text-decoration:none;color:var(--ink);font:inherit;font-weight:600;background:none;border:0;cursor:pointer;text-align:left}
.menu .item:hover,.menu .item[aria-current="page"]{background:var(--surface2)}
.menu .item[aria-current="page"]{box-shadow:inset 3px 0 0 var(--hi)}
.menu .item svg{width:19px;height:19px;color:var(--muted);flex:none}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--hi),var(--hi-dk));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 4px 14px var(--glow)}
.avatar.lg{width:64px;height:64px;font-size:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;text-decoration:none;min-width:0;margin-right:6px}
.brand svg{flex:none;filter:drop-shadow(0 2px 8px var(--glow))}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand em{font-style:normal;color:var(--hi)}
.nav{display:contents}
.nav a{display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;color:var(--nav-muted);text-decoration:none;font-weight:650;font-size:14px;white-space:nowrap}
.nav a svg{width:19px;height:19px}
.nav a.co-name{flex:1;justify-content:center;min-width:0;color:var(--ink);font-weight:800;font-size:16px;letter-spacing:-.01em;gap:10px;background:none;box-shadow:none;padding:6px 14px}
.nav a.co-name:hover{background:none!important;color:var(--hi)}
.nav a.co-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-name img,.co-top img{height:30px;width:auto;max-width:96px;object-fit:contain;border-radius:6px;flex:none}
.co-name.co-empty,.co-top.co-empty{color:var(--muted)!important;font-weight:600!important;font-size:13px!important}
.co-top{display:none}
.nav a[aria-current="page"]{color:#fff;background:linear-gradient(180deg,var(--hi),var(--hi-dk));box-shadow:0 6px 18px -4px var(--glow)}
.nav a:hover:not([aria-current="page"]){color:var(--nav-ink);background:var(--surface2)}
@media (max-width:820px){
  .nav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--nav-float);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    justify-content:space-around;gap:0;padding:6px;border:1px solid var(--line2);border-radius:22px;box-shadow:0 10px 30px rgba(16,24,40,.16);z-index:30}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;flex:1;justify-content:center;border-radius:16px}
  .top{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--top-solid)}
  .nav a.co-name{display:none}
  .co-top{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:0;font-weight:800;font-size:15px;text-decoration:none;color:var(--ink)}
  .co-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-top img{height:26px}
  .top.has-co .brand span{display:none}
  .nav a[aria-current="page"]{background:var(--hi-soft);color:var(--hi);box-shadow:none}
  .brand{font-size:16px}
}
@media (min-width:821px){body{padding-bottom:48px}}

main{max-width:1180px;margin:0 auto;padding:24px 16px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-head .sub{color:var(--muted);margin-top:5px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}

/* Buttons + inputs */
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:inherit;font-weight:650;font-size:14px;
  padding:9px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--surface3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--hi),var(--hi-dk));border-color:transparent;color:#fff;box-shadow:0 6px 18px -6px var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.dark{background:var(--surface3);border-color:var(--line2)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:#c42b2b;border-color:#c62828;color:#fff}
.btn.sm{padding:5px 12px;font-size:13px;min-height:32px}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 13px;width:100%;min-height:44px}
input::placeholder,textarea::placeholder{color:var(--ph)}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--hi);box-shadow:0 0 0 3px var(--hi-soft)}
textarea{min-height:96px;resize:vertical}
label.check{flex-direction:row;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
label.check input{width:20px;height:20px;min-height:0;accent-color:var(--hi)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fields .full{grid-column:1/-1}
.fields.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fields.times{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 84px!important}
@media (max-width:560px){.fields,.fields.three{grid-template-columns:minmax(0,1fr)}.fields.three.keep{grid-template-columns:repeat(3,minmax(0,1fr))}.fields.pair{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.act-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:84px;padding:12px 6px;border:0;border-radius:20px;background:var(--surface2);color:var(--ink);font-family:inherit;font-size:13px;font-weight:700;line-height:1.2;text-align:center;cursor:pointer}
.act-btn svg{width:24px;height:24px;color:var(--hi)}.act-btn:hover{background:var(--surface3)}.act-btn:active{transform:scale(.97)}
.att li{flex-wrap:wrap}.att li .grow{flex:1 1 220px;min-width:0}.att li .grow b,.start-steps li .grow b{white-space:normal;overflow:visible}
@media (max-width:560px){.att li>.btns{width:100%;padding-left:22px}}
.start-steps li .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}
.start-steps li.ok .chk{background:var(--good);border-color:var(--good);color:#fff}.start-steps li.ok b{color:var(--muted);text-decoration:line-through}
fieldset{border:1px solid var(--line);border-radius:16px;padding:14px;margin:0;background:var(--surface2)}
legend{font-size:13px;font-weight:700;padding:0 6px;color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:13px;font-weight:650;padding:7px 14px;border-radius:999px;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--hi)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:27px;font-weight:800;margin-top:6px;line-height:1.1;letter-spacing:-.02em}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.kpi.lead{background:radial-gradient(240px 120px at 0% 0%,color-mix(in srgb,var(--hi) 10%,transparent),transparent 70%),var(--surface);border-color:color-mix(in srgb,var(--hi) 38%,transparent)}
.kpi.lead::before{content:"";position:absolute;left:16px;right:16px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--hi),transparent)}

/* Tables */
.table-wrap{position:relative;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.click:hover td:first-child{border-radius:12px 0 0 12px}
tr.click:hover td:last-child{border-radius:0 12px 12px 0}
tfoot td{font-weight:750;border-bottom:0;border-top:1px solid var(--line2)}

.badge{display:inline-block;font-size:11px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--surface3);color:var(--muted);white-space:nowrap}
.badge.active{background:var(--warn-bg);color:var(--warn)}
.badge.done{background:var(--good-bg);color:var(--good)}

/* Bars */
.bar{height:8px;background:var(--surface3);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--bar);border-radius:999px}
.bar i.over{background:linear-gradient(90deg,#9b1c1c,var(--bad))}
.bar i.ok{background:linear-gradient(90deg,#1e4fa3,var(--good))}
.mbar{display:grid;grid-template-columns:1fr 1fr;align-items:center;height:14px;min-width:120px}
.mbar .l{display:flex;justify-content:flex-end;border-right:1px solid var(--line2);height:100%;align-items:center}
.mbar .r{display:flex;height:100%;align-items:center}
.mbar i{display:block;height:10px}
.mbar .l i{background:var(--bad);border-radius:999px 0 0 999px}
.mbar .r i{background:var(--good);border-radius:0 999px 999px 0}

/* Job cards */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.job{position:relative;display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 20px;box-shadow:var(--shadow);overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--jc,var(--line2))}
.job:hover{border-color:var(--line2);transform:translateY(-2px)}
.job .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.job .t b{font-size:16px}
.job .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.job .row span{color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input{max-width:280px;border-radius:999px;padding-left:16px}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);border-radius:12px}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .grow small{display:block;color:var(--muted);font-size:13px}
.list li.click{cursor:pointer}
.list li.click:hover{background:var(--surface2)}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--surface3);flex:none}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface2);border:0;border-radius:var(--r)}
.empty .btns{justify-content:center;margin-top:14px}
.insight{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:14px;align-items:flex-start}
.insight.warn{background:var(--warn-bg)}
.insight.bad{background:var(--bad-bg);box-shadow:inset 3px 0 0 var(--bad)}
.insight.good{background:var(--good-bg)}
.insight b{white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.photos button{appearance:none;border:0;padding:0;background:var(--surface3);border-radius:14px;overflow:hidden;aspect-ratio:1;cursor:pointer;position:relative}
.photos button:hover{transform:scale(1.02)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos small{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px;padding:14px 8px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer img{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:14px}

/* Schedule */
.week-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sched{min-width:900px;table-layout:fixed;border-collapse:separate;border-spacing:0}
.sched th,.sched td{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;padding:8px}
.sched tr>*:last-child{border-right:0}
.sched tbody tr:last-child td{border-bottom:1px solid var(--line2)}
.sched th{background:none;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line2)}
.sched th.today{color:var(--hi)}
.sched th.today::after{content:"";display:block;height:2px;border-radius:2px;background:var(--hi);margin-top:6px;width:24px}
.sched td.today{background:color-mix(in srgb,var(--hi) 5%,transparent)}
.sched th:first-child,.sched td:first-child{width:150px}
.sched tfoot td{border-top:0}
.emp-cell{display:flex;gap:8px;align-items:flex-start}
.emp-cell small{display:block;color:var(--muted);font-size:12px}
.chip{display:block;width:100%;text-align:left;appearance:none;font:inherit;font-size:12px;line-height:1.35;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:10px;padding:6px 8px 6px 10px;margin-bottom:5px;cursor:pointer;position:relative;overflow:hidden}
.chip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--jc,var(--muted))}
.chip:hover{background:var(--surface3)}
.chip b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.scheduled{border-color:var(--line2);background:transparent}
.chip.missed{opacity:.5;text-decoration:line-through}

      var a=r[iy*g+ix],b=r[iy*g+ix+1],cc=r[(iy+1)*g+ix],d=r[(iy+1)*g+ix+1],t1=a+(b-a)*fx,t2=cc+(d-cc)*fx;f[y*N+X]+=w*(t1+(t2-t1)*fy)}}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,\s]/g,''));return isFinite(n)?n:0};
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const money2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=0)=>isFinite(n)?(n*100).toFixed(d)+'%':'–';
const hrs=h=>(Math.round(h*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})+'h';
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const weekStart=s=>{const d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ds(d)};
const fmtDate=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const fmtDateY=s=>s?pd(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const toMin=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const fmtTime=t=>{if(!t)return'';let m=toMin(t),h=Math.floor(m/60)%24,mm=m%60;const ap=h<12?'a':'p';h=h%12||12;return h+(mm?':'+pad(mm):'')+ap};
const JOB_COLORS=['#2f6fb0','#c2571a','#0e7490','#8a4fb5','#b8860b','#c03a5b','#4f46e5','#6b7280'];
const EMP_COLORS=['#2f6fb0','#0e7490','#c2571a','#8a4fb5','#c03a5b','#4f46e5','#b8860b','#6b7280'];
const CATS=[['materials','Materials'],['subs','Subcontractor'],['equipment','Equipment & rentals'],['permits','Permits & fees'],['fuel','Fuel & travel'],['disposal','Dumpster & disposal'],['other','Other']];
const CAT_NAME=Object.fromEntries(CATS);
const EST=[['materials','Materials'],['labor','Labor'],['subs','Subcontractors'],['equipment','Equipment'],['other','Other / fees']];
const estKey=c=>({materials:'materials',subs:'subs',equipment:'equipment'})[c]||'other';
const STATUS={bid:'Bid',active:'Active',done:'Done'};

/* ---------- storage (IndexedDB) ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('job-ledger',1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>this.db.close();res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),s=t.objectStore(store);const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  get(store,k){return this.tx(store,'readonly',s=>s.get(k))},
  put(store,k,v){return this.tx(store,'readwrite',s=>s.put(v,k))},
  del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},
  clear(store){return this.tx(store,'readwrite',s=>s.clear())}};
const blank=()=>({v:1,profile:{},settings:{company:'',burden:15,ot:true,otThreshold:40},jobs:[],expenses:[],employees:[],shifts:[],photos:[],docs:[],reports:[],timeOff:[],customers:[],shares:[]});
let S=blank(), saveT=null, memOnly=false;
function save(){if(isEmp())return;if(isOwnerCloud())cloudQueue();clearTimeout(saveT);saveT=setTimeout(()=>{if(!memOnly)DB.put('kv','state',S).catch(()=>toast('Could not save on this device'))},250)}
const memPhotos=new Map();
async function photoPut(id,blob){if(memOnly)memPhotos.set(id,blob);else await DB.put('photos',id,blob);forgetURL(id);if(isOwnerCloud()){UPQ.add(id);flushUploads()}}
async function photoGet(id){let b=memOnly?memPhotos.get(id):await DB.get('photos',id).catch(()=>null);
  if(!b&&isOwnerCloud()){try{const {data}=await CLOUD.sb.storage.from('photos').download(photoPath(id));if(data){b=data;if(memOnly)memPhotos.set(id,b);else DB.put('photos',id,b).catch(()=>{})}}catch(e){}}return b}
async function photoDel(id){UPQ.del(id);if(memOnly)memPhotos.delete(id);else await DB.del('photos',id);if(isOwnerCloud())CLOUD.sb.storage.from('photos').remove([photoPath(id)]).catch(()=>{});const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}}
const urlCache=new Map();
async function photoURL(id){if(urlCache.has(id))return urlCache.get(id);const b=await photoGet(id);if(!b)return'';const u=URL.createObjectURL(b);urlCache.set(id,u);return u}
function hydratePhotos(root=document){$$('[data-photo]',root).forEach(async el=>{const u=await photoURL(el.dataset.photo);if(!u)return;el.src=el.tagName==='VIDEO'&&!el.controls?u+'#t=0.1':u})}
async function downscale(file,max=1600){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await Promise.race([new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82)),new Promise(r=>setTimeout(()=>r(file),8000))])}catch(e){return file}}
async function addPhoto(file,jobId,kind='job'){const b=await prepMedia(file);if(!b)return null;const id=uid();await photoPut(id,b);S.photos.push({id,jobId,kind,date:today(),caption:'',...(isVideoBlob(b)?{type:'video'}:{})});return id}

/* ---------- calculations ---------- */
const job=id=>S.jobs.find(j=>j.id===id), emp=id=>S.employees.find(e=>e.id===id);
const jobColor=j=>j?j.color||JOB_COLORS[(S.jobs.indexOf(j)%JOB_COLORS.length+JOB_COLORS.length)%JOB_COLORS.length]:'#6b7280';
function shiftHours(s){let m=toMin(s.end)-toMin(s.start);if(m<0)m+=1440;return Math.max(0,m-(+s.breakMin||0))/60}
function laborCalc(){
  const map=new Map(),acc={},ot=S.settings.ot!==false,th=num(S.settings.otThreshold)||40;
  const worked=S.shifts.filter(s=>s.status==='worked').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  for(const s of worked){const h=shiftHours(s),k=s.empId+'|'+weekStart(s.date),before=acc[k]||0;acc[k]=before+h;
    let reg=h,o=0;if(ot){reg=Math.max(0,Math.min(h,th-before));o=h-reg}
    const wage=(+s.rate||0)*(reg+1.5*o);map.set(s.id,{h,reg,ot:o,wage,cost:wage*(1+(+s.burden||0)/100)})}
  return map}
const plannedCost=s=>shiftHours(s)*(+s.rate||0)*(1+(+s.burden||0)/100);
function jobStats(j,L){
  const rev=(+j.price||0)+sum(j.changeOrders||[],c=>c.amount);
  const cost={materials:0,labor:0,subs:0,equipment:0,other:0};let hours=0,planned=0,plannedH=0;
  for(const e of S.expenses)if(e.jobId===j.id)cost[estKey(e.cat)]+=+e.amount||0;
  for(const s of S.shifts){if(s.jobId!==j.id)continue;
    if(s.status==='worked'){const l=L.get(s.id);if(l){cost.labor+=l.cost;hours+=l.h}}
    else if(s.status==='scheduled'){planned+=plannedCost(s);plannedH+=shiftHours(s)}}
  const total=sum(Object.values(cost)),est=j.est||{},estTotal=sum(EST,([k])=>est[k]);
  // Projection for unfinished jobs: each category ends at the larger of what's spent (labor: plus what's scheduled) and its estimate.
  const done=j.status==='done';
  const projTotal=done?total:sum(EST,([k])=>Math.max(cost[k]+(k==='labor'?planned:0),+est[k]||0));
  return{rev,cost,total,hours,planned,plannedH,profit:rev-total,margin:rev?(rev-total)/rev:NaN,estTotal,estProfit:rev-estTotal,estMargin:rev?(rev-estTotal)/rev:NaN,used:estTotal?total/estTotal:NaN,
    projTotal,projProfit:rev-projTotal,projMargin:rev?(rev-projTotal)/rev:NaN}}

/* ---------- pay periods, approval and payroll export ---------- */
const PAY_FREQ={weekly:'Weekly',biweekly:'Every 2 weeks',semimonthly:'Twice a month (1st–15th and 16th–end)',monthly:'Monthly'};
function periodOf(date){const st=S.settings,f=st.payFreq||'weekly',d=pd(date),y=d.getFullYear(),m=d.getMonth();
  if(f==='semimonthly')return d.getDate()<=15?[ds(new Date(y,m,1)),ds(new Date(y,m,15))]:[ds(new Date(y,m,16)),ds(new Date(y,m+1,0))];
  if(f==='monthly')return[ds(new Date(y,m,1)),ds(new Date(y,m+1,0))];
  const w=weekStart(date);if(f!=='biweekly')return[w,addDays(w,6)];
  const a=weekStart(st.payAnchor||w),k=Math.floor(Math.round((pd(w)-pd(a))/864e5)/14),s=addDays(a,k*14);return[s,addDays(s,13)]}
const payBook=()=>S.payPeriods||(S.payPeriods={});
const payRec=from=>(S.payPeriods||{})[from];
const closedFor=date=>Object.values(S.payPeriods||{}).find(p=>p.closedAt&&date>=p.from&&date<=p.to);
const r2=n=>Math.round(n*100)/100;
// Hours, overtime and pay per person for one pay period, plus anything that has to be fixed before approving.
function payrollData(from,to){const L=laborCalc(),per={},row=id=>per[id]=per[id]||{reg:0,ot:0,wage:0,cost:0,lines:{},shifts:[],pending:0,open:null};
  for(const s of S.shifts){if(s.date<from||s.date>to)continue;const p=row(s.empId);p.shifts.push(s);
    if(s.status==='scheduled'&&s.date<today())p.pending++;
    if(s.status!=='worked')continue;const l=L.get(s.id);if(!l)continue;p.reg+=l.reg;p.ot+=l.ot;p.wage+=l.wage;p.cost+=l.cost;
    const r=+s.rate||0,ln=p.lines[r]=p.lines[r]||{rate:r,reg:0,ot:0};ln.reg+=l.reg;ln.ot+=l.ot}
  for(const pu of CLOUD.punches||[]){if(pu.out_at)continue;const d=ds(new Date(pu.in_at));if(d>=from&&d<=to&&emp(pu.employee_id))row(pu.employee_id).open=pu}
  for(const p of Object.values(per))p.shifts.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  return per}
const payBlocked=p=>!!(p.open||p.pending);
// Changing someone's hours after they were approved takes the approval back, so nobody is paid on hours that weren't signed off.
function payTouch(empId,date){const rec=payRec(periodOf(date)[0]);if(rec&&!rec.closedAt&&rec.approved?.[empId]){delete rec.approved[empId];return true}return false}
function payClose(from,to){const per=payrollData(from,to),rows=[];
  for(const [id,p] of Object.entries(per)){const e=emp(id);for(const ln of Object.values(p.lines)){if(!ln.reg&&!ln.ot)continue;
    rows.push({empId:id,name:e?.name||'Removed employee',payrollId:e?.payrollId||'',rate:ln.rate,reg:r2(ln.reg),ot:r2(ln.ot)})}}
  rows.sort((a,b)=>a.name.localeCompare(b.name)||a.rate-b.rate);
  const rec=payBook()[from]=Object.assign(payBook()[from]||{approved:{}},{from,to,closedAt:new Date().toISOString(),rows,
    shiftIds:S.shifts.filter(s=>s.status==='worked'&&s.date>=from&&s.date<=to).map(s=>s.id)});save();return rec}
const payRows=rec=>(rec.rows||[]).map(r=>{const regPay=r2(r.rate*r.reg),otPay=r2(r.rate*1.5*r.ot);return{...r,regPay,otPay,gross:r2(regPay+otPay)}});
const PAY_COLS=['Employee','Payroll ID','Pay period start','Pay period end','Regular hours','Overtime hours','Hourly rate','Regular pay','Overtime pay','Gross pay'];
const payTable=rec=>[PAY_COLS,...payRows(rec).map(r=>[r.name,r.payrollId,rec.from,rec.to,r.reg.toFixed(2),r.ot.toFixed(2),r.rate.toFixed(2),r.regPay.toFixed(2),r.otPay.toFixed(2),r.gross.toFixed(2)])];
const payCSV=rec=>payTable(rec).map(l=>l.map(v=>{v=String(v??'');return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')+'\r\n';
async function saveFile(name,text,type){const blob=new Blob([text],{type});
  try{const file=new File([blob],name,{type});if(window.Capacitor?.isNativePlatform?.()&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e?.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true}
function payReview(id){const e=emp(id),[from,to]=periodOf(UI.pp||today()),p=payrollData(from,to)[id];if(!e||!p)return;
  const rec=payRec(from),closed=!!rec?.closedAt,ok=!!rec?.approved?.[id],first=esc(e.name.split(' ')[0]);
  const stat={worked:['done','Worked'],scheduled:['','Scheduled'],missed:['','Missed']};
  openForm({title:`${e.name}: ${fmtDate(from)} – ${fmtDate(to)}`,submit:'Approve hours',
    body:`${p.open?`<div class="insight bad"><b>Still clocked in</b><span>Since ${fmtDate(ds(new Date(p.open.in_at)))} at ${timeOf(p.open.in_at)}. Ask ${first} to clock out before you approve.</span></div>`:''}
      ${p.pending?`<div class="insight warn"><b>${p.pending} past shift${p.pending>1?'s':''} still Scheduled</b><span>Tap ${p.pending>1?'each one':'it'} and mark it Worked or Missed.</span></div>`:''}
      ${p.shifts.length?`<ul class="list">${p.shifts.map(s=>{const j=job(s.jobId),st=stat[s.status]||['',s.status];return `<li class="click" data-shift="${s.id}"><div class="grow"><b>${fmtDate(s.date)} · ${fmtTime(s.start)}–${fmtTime(s.end)}</b><small>${esc(j?.name||'Job removed')}${+s.breakMin?` · ${num(s.breakMin)} min break`:''}${s.source==='clock'?' · clocked in on the app':''}</small></div><span class="num small">${hrs(shiftHours(s))}</span><span class="badge ${st[0]}">${st[1]}</span></li>`}).join('')}</ul>`:''}
      <div class="split"><span class="note">Regular ${hrs(p.reg)} · Overtime ${hrs(p.ot)}</span><b class="num">${money2(p.wage)}</b></div>
      ${closed?'<p class="note">This pay period is closed, so these hours are locked.</p>':ok?'<p class="note">Already approved. Changing any of these shifts takes the approval back.</p>':payBlocked(p)?'<p class="note">Fix the items above, then you can approve.</p>':'<p class="note">Tap a shift to change it.</p>'}`,
    onOpen:f=>$$('[data-shift]',f).forEach(li=>li.onclick=()=>{$('#dlg').close();shiftForm(S.shifts.find(s=>s.id===li.dataset.shift))}),
    onSubmit:(closed||ok||payBlocked(p))?null:()=>{const r=payBook()[from]=payBook()[from]||{from,to,approved:{}};(r.approved=r.approved||{})[id]=new Date().toISOString();save();toast(`${e.name.split(' ')[0]}'s hours approved`)}})}

/* ---------- UI primitives ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function openForm({title,body,submit='Save',onSubmit,onDelete,deleteLabel='Delete',onOpen,closeLabel='Cancel'}){
  const d=$('#dlg');
  d.innerHTML=`<form class="dlg-form" novalidate><header><h2>${esc(title)}</h2><button type="button" class="x" data-close aria-label="Close">×</button></header>
  <div class="dlg-body">${body}</div><footer>${onDelete?`<button type="button" class="btn danger" data-del>${esc(deleteLabel)}</button>`:''}<span class="sp"></span>
  <button type="button" class="btn ghost" data-close>${esc(closeLabel)}</button>${onSubmit?`<button class="btn primary" type="submit">${esc(submit)}</button>`:''}</footer></form>`;
  const f=d.querySelector('form');
  f.addEventListener('submit',async ev=>{ev.preventDefault();for(const el of $$('[required]',f)){if(!String(el.value).trim()){el.focus();toast('Please fill in '+(el.closest('label')?.firstChild?.textContent||'the required field').trim().toLowerCase());return}}
    const btn=$('[type=submit]',f);btn.disabled=true;try{const r=await onSubmit(new FormData(f),f);if(r!==false){d.close();route()}}finally{btn.disabled=false}});
  $$('[data-close]',d).forEach(b=>b.onclick=()=>d.close());
  const del=$('[data-del]',d);if(del)del.onclick=async()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='Tap again to delete';return}await onDelete();d.close();route()};
  d.showModal();onOpen&&onOpen(f);const first=$('input:not([type=hidden]):not([type=file]),select,textarea',f);if(first&&matchMedia('(min-width:821px)').matches)first.focus()}
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`;
const field=(label,inner,cls='')=>`<label class="${cls}">${label}${inner}</label>`;
const inp=(name,val='',type='text',extra='')=>`<input name="${name}" type="${type}" value="${esc(val)}" ${extra}>`;
const moneyInp=(name,val,extra='')=>`<input name="${name}" type="text" inputmode="decimal" value="${val===''||val==null?'':esc(val)}" placeholder="0" ${extra}>`;
function armTwoStep(btn,label='Tap again to confirm'){if(btn.classList.contains('armed'))return true;btn.classList.add('armed');const t=btn.textContent;btn.textContent=label;setTimeout(()=>{btn.classList.remove('armed');btn.textContent=t},4000);return false}

const WD=[['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat'],['0','Sun']];
function planFields(j){const p=j.plan||{},crew=p.crew||[],days=(p.days||[1,2,3,4,5]).map(String),emps=S.employees.filter(e=>e.active!==false||crew.includes(e.id));
  return `<fieldset><legend>Crew &amp; schedule</legend><div class="stack" style="gap:12px">
    ${emps.length?`<div><div class="note" style="margin-bottom:8px">Who's working this job</div><div class="pick-row">${emps.map(e=>`<label class="pick"><input type="checkbox" name="crew" value="${e.id}"${crew.includes(e.id)?' checked':''}><span class="dot" style="background:${e.color}"></span>${esc(e.name)}${e.role?` <small>${esc(e.role)}</small>`:''}</label>`).join('')}</div></div>`
      :'<p class="note">Add your crew on <b>Crew &amp; Pay</b> first, then pick them here to put this job on the schedule.</p>'}
    <div class="fields">${field('First day',inp('pfrom',p.from||j.start||today(),'date'))}${field('Last day',inp('pto',p.to||j.end||'','date'))}</div>
    <div><div class="note" style="margin-bottom:8px">Work days</div><div class="pick-row">${WD.map(([v,l])=>`<label class="pick day"><input type="checkbox" name="pdays" value="${v}"${days.includes(v)?' checked':''}>${l}</label>`).join('')}</div></div>
    <div class="fields three keep times">${field('Start',inp('pstart',p.start||'07:00','time'))}${field('End',inp('pend',p.end||'15:30','time'))}${field('Break (min)',inp('pbreak',p.breakMin??30,'number','min="0" step="5" inputmode="numeric"'))}</div>
    <div class="plan-sum" id="plan-sum"></div><div id="plan-warn"></div>
    <p class="note">Saving puts these days on the schedule and calendar. Days before today aren't added. Changing this later only changes upcoming scheduled days, never days already worked.</p></div></fieldset>`}
function readPlan(fd){return{crew:fd.getAll('crew'),from:fd.get('pfrom')||today(),to:fd.get('pto')||'',days:fd.getAll('pdays').map(Number),start:fd.get('pstart')||'07:00',end:fd.get('pend')||'15:30',breakMin:num(fd.get('pbreak'))}}
function planDates(p){const out=[];if(!p||!p.to)return out;let d=p.from>today()?p.from:today();for(let i=0;d<=p.to&&i<400;i++,d=addDays(d,1))if(p.days.includes(pd(d).getDay()))out.push(d);return out}
function planWire(f){const sync=(src,dst)=>{const a=f.elements[src],b=f.elements[dst];a.addEventListener('change',()=>{if(!b.dataset.touched)b.value=a.value})};
  f.elements.pfrom.addEventListener('input',()=>f.elements.pfrom.dataset.touched=1);f.elements.pto.addEventListener('input',()=>f.elements.pto.dataset.touched=1);
  if(!f.elements.pto.value)f.elements.pto.dataset.touched='';sync('start','pfrom');sync('end','pto');
  const upd=()=>{const p=readPlan(new FormData(f)),n=p.crew.length,ds=planDates(p),h=shiftHours({start:p.start,end:p.end,breakMin:p.breakMin}),st=f.elements.status.value;
    $('#plan-sum',f).innerHTML=!n?'No crew picked yet. The job won\'t show on the schedule until you pick people.':!p.to?'Pick the last day to schedule the crew.':!ds.length?'No upcoming work days in that range.'
      :`<b>${ds.length} day${ds.length>1?'s':''} × ${n} ${n>1?'people':'person'} = ${ds.length*n} shifts</b> · ${fmtDate(ds[0])} – ${fmtDate(ds[ds.length-1])} · ${hrs(h)} a day${st==='bid'?' · scheduled once the job is <b>Active</b>':st==='done'?' · not scheduled while the job is <b>Done</b>':''}`;
    $('#plan-warn',f).innerHTML='';delete f.dataset.warned};
  f.addEventListener('input',upd);f.addEventListener('change',upd);upd()}
function overlaps(a1,a2,b1,b2){const n=(x,y)=>[toMin(x),toMin(y)<=toMin(x)?toMin(y)+1440:toMin(y)],[a,b]=n(a1,a2),[c,d]=n(b1,b2);return a<d&&c<b}
function conflictFor(empId,date,p,jobId){return S.shifts.find(s=>s.empId===empId&&s.date===date&&s.jobId!==jobId&&s.status!=='missed'&&overlaps(p.start,p.end,s.start,s.end))}
function planConflicts(jobId,p,status){if(status!=='active'||!p.crew.length)return[];const out=[];
  for(const d of planDates(p))for(const id of p.crew){if(S.shifts.some(s=>s.jobId===jobId&&s.empId===id&&s.date===d))continue;const c=conflictFor(id,d,p,jobId);if(c)out.push({empId:id,date:d,other:c.jobId})}return out}
// Keep a job's upcoming scheduled days in line with its crew plan. Never touches past days, worked or missed shifts, or shifts added by hand.
function syncPlan(j,opt={}){const t=today(),p=j.plan,res={added:0,removed:0,skipped:0,list:[]},want=new Map();
  if(p&&p.crew&&p.crew.length&&j.status==='active')for(const d of planDates(p))for(const id of p.crew){const e=emp(id);if(e&&e.active!==false)want.set(id+'|'+d,{empId:id,date:d})}
  S.shifts=S.shifts.filter(s=>{if(s.jobId!==j.id||!s.plan||s.status!=='scheduled'||s.date<t)return true;const k=s.empId+'|'+s.date;
    if(want.has(k)){Object.assign(s,{start:p.start,end:p.end,breakMin:p.breakMin});want.delete(k);return true}res.removed++;return false});
  for(const w of want.values()){if(S.shifts.some(s=>s.jobId===j.id&&s.empId===w.empId&&s.date===w.date))continue;
    if(offOn(w.empId,w.date)){res.off=(res.off||0)+1;continue}
    if(!opt.double&&conflictFor(w.empId,w.date,p,j.id)){res.skipped++;continue}
    const e=emp(w.empId),ns={id:uid(),empId:w.empId,jobId:j.id,date:w.date,start:p.start,end:p.end,breakMin:p.breakMin,status:'scheduled',rate:e.rate,burden:e.burden,note:'',plan:true};S.shifts.push(ns);res.list.push(ns);res.added++}
  return res}

/* ---------- receipt scanning (iPhone app: Apple's on-device text recognition) ---------- */
const RS=()=>window.Capacitor?.isNativePlatform?.()?window.Capacitor.Plugins?.ReceiptScan:null;
const blobB64=b=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.onerror=j;fr.readAsDataURL(b)});
function parseReceipt(lines){const L=lines.map(x=>x.trim()).filter(Boolean),M=/\$?\s*(\d{1,3}(?:,\d{3})*|\d+)\.(\d{2})\b/g;
  const amts=l=>[...l.matchAll(M)].map(m=>+(m[1].replace(/,/g,'')+'.'+m[2]));
  let total=0;for(let i=0;i<L.length;i++){const l=L[i];if(!/(total|amount due|balance due|amount paid|grand)/i.test(l)||/(sub\s*-?total|savings|you saved|tax|discount|items?\b|qty)/i.test(l))continue;
    const a=amts(l).concat(amts(L[i+1]||''));if(a.length)total=Math.max(total,a[a.length-1]===undefined?0:Math.max(...a))}
  if(!total){const all=L.flatMap(amts).filter(n=>n<100000);if(all.length)total=Math.max(...all)}
  let date='';const mo={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12},fix=(y,m,d)=>{y=+y;if(y<100)y+=2000;m=+m;d=+d;if(m<1||m>12||d<1||d>31||y<2000||y>2100)return'';return `${y}-${pad(m)}-${pad(d)}`};
  for(const l of L){let m=l.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);if(m&&(date=fix(m[3],m[1],m[2])))break;
    m=l.match(/\b(20\d{2})-(\d{2})-(\d{2})\b/);if(m&&(date=fix(m[1],m[2],m[3])))break;
    m=l.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})\b/i);if(m&&(date=fix(m[3],mo[m[1].toLowerCase()],m[2])))break}
  if(date>today())date='';
  const vendor=(L.find(l=>/[a-z]{3}/i.test(l)&&!/(receipt|welcome|thank|store\s*#|^\d|www\.|\.com|tel|phone|invoice|order)/i.test(l)&&(l.replace(/[^a-z]/gi,'').length/l.length)>.6)||'').slice(0,60);
  return{total,date,vendor}}
async function scanReceipt(file,f){const P=RS();if(!P||!file)return;const note=$('#scan-note',f);note.hidden=false;note.textContent='Reading the receipt…';
  try{const b=await downscale(file,2000),{lines}=await P.recognize({image:await blobB64(b)}),r=parseReceipt(lines||[]),got=[];
    if(r.total&&!num(f.amount.value)){f.amount.value=r.total.toFixed(2);got.push('amount')}
    if(r.date&&r.date!==f.date.value){f.date.value=r.date;got.push('date')}
    if(r.vendor&&!f.vendor.value.trim()){f.vendor.value=r.vendor;got.push('store')}
    note.textContent=got.length?`Filled in the ${got.join(', ')} from the receipt. Check them before saving.`:'Couldn\'t read the total from this photo. Enter it by hand.'}
  catch(e){note.textContent='Couldn\'t read this receipt. Enter the details by hand.'}}

/* ---------- estimates & invoices ---------- */
const DOC_KIND={estimate:'Estimate',invoice:'Invoice'};
const DOC_ST={draft:['','Draft'],sent:['active','Sent'],viewed:['active','Viewed'],approved:['done','Approved'],declined:['bad','Declined'],partial:['active','Part paid'],paid:['done','Paid']};
const docBadge=d=>{const [c,l]=DOC_ST[docStatus(d)]||['',d.status];return `<span class="badge ${c}">${l}</span>`};
function docTotals(d){const sub=sum(d.items||[],i=>num(i.qty)*num(i.rate)),tax=Math.round(sub*num(d.taxRate))/100,total=sub+tax,paid=sum(d.payments||[],p=>p.amount);
  return{sub,tax,total,paid,balance:total-paid}}
function docStatus(d){if(d.kind==='invoice'){const t=docTotals(d);if(t.paid>0&&t.balance<=0.005)return 'paid';if(t.paid>0)return 'partial'}return d.status||'draft'}
const docTitle=d=>`${DOC_KIND[d.kind]} ${d.num}`;
function nextDocNum(kind){const k=kind==='invoice'?'nextInv':'nextEst',n=num(S.settings[k])||1001;return (kind==='invoice'?'INV-':'EST-')+n}
function takeDocNum(d){const k=d.kind==='invoice'?'nextInv':'nextEst',n=num(S.settings[k])||1001;if(d.num===nextDocNum(d.kind))S.settings[k]=n+1;
  else{const m=/(\d+)$/.exec(d.num);if(m&&+m[1]>=n)S.settings[k]=+m[1]+1}}
function docLinesFor(j,kind){const items=[{desc:j.name+(kind==='estimate'?'':' (contract)'),qty:1,rate:+j.price||0}];
  if(kind==='invoice'){for(const c of j.changeOrders||[])items.push({desc:'Change order: '+c.desc,qty:1,rate:+c.amount||0});
    const before=sum(S.docs.filter(d=>d.kind==='invoice'&&d.jobId===j.id),d=>docTotals(d).sub);if(before)items.push({desc:'Less previously invoiced',qty:1,rate:-before})}
  return items}
function newDoc(kind,j,from){const d={id:uid(),kind,num:nextDocNum(kind),jobId:j?.id||'',date:today(),status:'draft',taxRate:from?.taxRate??(num(S.settings.taxRate)||0),
    billTo:{name:j?.client||'',address:j?.address||'',phone:j?.phone||'',email:cust(j?.customerId)?.email||''},items:from?from.items.map(i=>({...i})):docLinesFor(j||{name:'Work'},kind),payments:[],
    notes:from?.notes||(kind==='estimate'?(S.settings.estTerms||'This estimate is valid for 30 days.'):(S.settings.invTerms||'Thank you for your business.'))};
  if(kind==='invoice')d.due=addDays(d.date,num(S.settings.dueDays)||14);else d.valid=addDays(d.date,30);if(from)d.fromId=from.id;return d}

// Read-only document, used in the app preview, the shared link page and for printing.
function docHTML(d,co){const t=docTotals(d),c=co||S.profile||{},b=d.billTo||{},j=job(d.jobId),inv=d.kind==='invoice';
  return `<article class="doc"><header class="doc-top"><div class="doc-co">${c.logo?`<img src="${esc(c.logo)}" alt="">`:''}<div><b>${esc(c.company||c.name||'')}</b>
      <small>${[c.address,c.phone,c.email,c.website,c.license&&'License # '+c.license].filter(Boolean).map(esc).join('<br>')}</small></div></div>
    <div class="doc-meta"><h2>${DOC_KIND[d.kind]}</h2><dl><dt>No.</dt><dd>${esc(d.num)}</dd><dt>Date</dt><dd>${fmtDateY(d.date)}</dd>
      ${inv&&d.due?`<dt>Due</dt><dd>${fmtDateY(d.due)}</dd>`:''}${!inv&&d.valid?`<dt>Valid until</dt><dd>${fmtDateY(d.valid)}</dd>`:''}</dl></div></header>
  <section class="doc-to"><div><small>${inv?'Bill to':'Prepared for'}</small><b>${esc(b.name||'')}</b><small>${[b.address,b.phone,b.email].filter(Boolean).map(esc).join('<br>')}</small></div>
    ${(d.jobName||j?.name)?`<div><small>Project</small><b>${esc(d.jobName||j.name)}</b><small>${esc(d.jobAddress||j?.address||'')}</small></div>`:''}</section>
  <table class="doc-lines"><thead><tr><th>Description</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th></tr></thead>
    <tbody>${(d.items||[]).map(i=>`<tr><td>${esc(i.desc)}</td><td class="n">${+num(i.qty).toFixed(2)}</td><td class="n">${money2(num(i.rate))}</td><td class="n">${money2(num(i.qty)*num(i.rate))}</td></tr>`).join('')}</tbody></table>
  <dl class="doc-sum"><dt>Subtotal</dt><dd>${money2(t.sub)}</dd>${num(d.taxRate)?`<dt>Tax (${+num(d.taxRate).toFixed(3)}%)</dt><dd>${money2(t.tax)}</dd>`:''}
    <dt class="tot">Total</dt><dd class="tot">${money2(t.total)}</dd>${inv&&t.paid?`<dt>Paid</dt><dd>-${money2(t.paid)}</dd><dt class="tot">Balance due</dt><dd class="tot">${money2(Math.max(0,t.balance))}</dd>`:''}</dl>
  ${d.notes?`<p class="doc-notes">${esc(d.notes)}</p>`:''}
  ${d.approvedBy?`<p class="doc-ok">Approved by ${esc(d.approvedBy)}${d.approvedAt?' on '+fmtDateY(d.approvedAt.slice(0,10)):''}</p>`:''}</article>`}

function docForm(d,isNew){const inv=d.kind==='invoice';
  const row=(i={})=>`<div class="line-row"><input name="desc" placeholder="Description" value="${esc(i.desc??'')}"><input name="qty" inputmode="decimal" placeholder="Qty" value="${esc(i.qty??1)}"><input name="rate" inputmode="decimal" placeholder="Rate" value="${i.rate===''||i.rate==null?'':esc(i.rate)}"><b class="num line-amt"></b><button type="button" class="x" data-del-line aria-label="Remove line">×</button></div>`;
  openForm({title:(isNew?'New ':'Edit ')+DOC_KIND[d.kind].toLowerCase(),submit:'Save',
    body:`<div class="fields">${field('Number',inp('num',d.num))}${field('Date',inp('date',d.date,'date'))}
      ${inv?field('Due date',inp('due',d.due,'date')):field('Valid until',inp('valid',d.valid,'date'))}${field('Sales tax %',inp('taxRate',d.taxRate||'','text','inputmode="decimal" placeholder="0"'))}
      ${field(inv?'Bill to':'Customer',inp('bname',d.billTo?.name,'text','placeholder="Customer name"'))}${field('Customer email',inp('bemail',d.billTo?.email,'email'))}
      ${field('Customer phone',inp('bphone',d.billTo?.phone,'tel'))}${field('Address',inp('baddr',d.billTo?.address))}</div>
      <fieldset><legend>Line items</legend><div class="line-head"><span>Description</span><span>Qty</span><span>Rate</span><span>Amount</span><span></span></div><div id="lines">${(d.items.length?d.items:[{}]).map(row).join('')}</div>
        <button type="button" class="btn sm" id="add-line">+ Add line</button><div class="split" style="margin-top:12px"><span class="note" id="doc-sub"></span><b class="num" id="doc-total"></b></div></fieldset>
      ${field('Notes / terms',`<textarea name="notes" rows="3">${esc(d.notes||'')}</textarea>`,'full')}`,
    onOpen:f=>{const L=$('#lines',f);const upd=()=>{const rows=$$('.line-row',L);let s=0;rows.forEach(r=>{const a=num(r.querySelector('[name=qty]').value)*num(r.querySelector('[name=rate]').value);s+=a;r.querySelector('.line-amt').textContent=money2(a)});
        const tx=Math.round(s*num(f.taxRate.value))/100;$('#doc-sub',f).textContent=`Subtotal ${money2(s)}${tx?` · tax ${money2(tx)}`:''}`;$('#doc-total',f).textContent='Total '+money2(s+tx)};
      $('#add-line',f).onclick=()=>{L.insertAdjacentHTML('beforeend',row());upd();L.lastElementChild.querySelector('input').focus()};
      L.addEventListener('click',e=>{const b=e.target.closest('[data-del-line]');if(b){if($$('.line-row',L).length>1)b.closest('.line-row').remove();else b.closest('.line-row').querySelectorAll('input').forEach(i=>i.value='');upd()}});
      f.addEventListener('input',upd);upd()},
    onDelete:isNew?null:async()=>{await unshareDoc(d);S.docs=S.docs.filter(x=>x.id!==d.id);save();toast(DOC_KIND[d.kind]+' deleted')},
    onSubmit:fd=>{const ds=fd.getAll('desc'),qs=fd.getAll('qty'),rs=fd.getAll('rate');
      const items=ds.map((x,i)=>({desc:x.trim(),qty:num(qs[i])||(qs[i].trim()===''?1:0),rate:num(rs[i])})).filter(i=>i.desc||i.rate);
      if(!items.length){toast('Add at least one line');return false}
      Object.assign(d,{num:fd.get('num').trim()||d.num,date:fd.get('date')||today(),taxRate:num(fd.get('taxRate')),items,notes:fd.get('notes').trim(),
        billTo:{name:fd.get('bname').trim(),email:fd.get('bemail').trim(),phone:fd.get('bphone').trim(),address:fd.get('baddr').trim()}});
      if(inv)d.due=fd.get('due');else d.valid=fd.get('valid');if(num(fd.get('taxRate')))S.settings.taxRate=num(fd.get('taxRate'));
      if(isNew){takeDocNum(d);S.docs.push(d)}save();if(d.token)shareDoc(d).catch(()=>{});toast(docTitle(d)+' saved');setTimeout(()=>docView(d),250)}})}

function docView(d){const inv=d.kind==='invoice',t=docTotals(d),st=docStatus(d),cloud=isOwnerCloud();
  openForm({title:docTitle(d),closeLabel:'Close',
    body:`<div class="doc-actions">${docBadge(d)} <span class="note">${money2(t.total)}${inv&&t.paid?` · ${money2(Math.max(0,t.balance))} due`:''}</span></div>
      <div class="btns doc-btns">
        <button type="button" class="btn primary sm" data-doc="send">${d.token?'Send again':'Send to customer'}</button>
        <button type="button" class="btn sm" data-doc="edit">Edit</button>
        ${inv&&st!=='paid'?'<button type="button" class="btn sm" data-doc="pay">Record payment</button>':''}
        ${!inv&&st!=='approved'?'<button type="button" class="btn sm" data-doc="approve">Mark approved</button>':''}
        ${!inv&&st!=='declined'&&st!=='approved'?'<button type="button" class="btn sm ghost" data-doc="decline">Mark declined</button>':''}
        ${!inv?'<button type="button" class="btn sm" data-doc="toinv">Turn into invoice</button>':''}
        ${cloud&&d.token?'<button type="button" class="btn sm ghost" data-doc="open">Open customer page</button>':''}
        <button type="button" class="btn sm ghost" data-doc="copy">Copy as text</button></div>
      ${inv&&docsCardPay()&&st!=='paid'?'<p class="note">Your customer can pay this by card from the link.</p>':''}
      <div id="doc-send"></div>
      ${inv&&(d.payments||[]).length?`<ul class="list">${d.payments.map(p=>`<li><div class="grow"><b>${money2(p.amount)}</b><small>${fmtDateY(p.date)}${p.method?' · '+esc(p.method):''}</small></div><button type="button" class="btn sm ghost danger" data-doc="unpay" data-id="${p.id}">Remove</button></li>`).join('')}</ul>`:''}
      <div class="doc-wrap">${docHTML(d)}</div>`,
    onOpen:f=>{f.addEventListener('click',async e=>{const b=e.target.closest('[data-doc]');if(!b)return;const a=b.dataset.doc;
      if(a==='edit')return docForm(d,false);
      if(a==='pay')return payForm(d);
      if(a==='unpay'){d.payments=d.payments.filter(p=>p.id!==b.dataset.id);save();if(d.token)shareDoc(d).catch(()=>{});return docView(d)}
      if(a==='approve'||a==='decline'){d.status=a==='approve'?'approved':'declined';if(a==='approve'){d.approvedAt=new Date().toISOString();d.approvedBy=d.approvedBy||''}save();if(d.token)shareDoc(d).catch(()=>{});toast(docTitle(d)+(a==='approve'?' approved':' declined'));return docView(d)}
      if(a==='toinv'){const j=job(d.jobId),n=newDoc('invoice',j,d);return docForm(n,true)}
      if(a==='copy'){try{await navigator.clipboard.writeText(docText(d));toast('Copied')}catch(err){toast('Could not copy')}return}
      if(a==='open'){window.open(shareUrl(d),'_blank','noopener');return}
      if(a==='send')return docSend(d,f)})}})}

const shareUrl=d=>SITE_URL+'doc.html#'+d.token;
function docText(d){const t=docTotals(d),co=S.profile||{};
  return [`${co.company||''} — ${docTitle(d)}`,`Date: ${fmtDateY(d.date)}${d.kind==='invoice'&&d.due?` · Due ${fmtDateY(d.due)}`:''}`,'',...(d.items||[]).map(i=>`${i.desc}: ${num(i.qty)} × ${money2(num(i.rate))} = ${money2(num(i.qty)*num(i.rate))}`),'',
    `Subtotal ${money2(t.sub)}`,num(d.taxRate)?`Tax ${money2(t.tax)}`:'',`Total ${money2(t.total)}`,d.kind==='invoice'&&t.paid?`Balance due ${money2(Math.max(0,t.balance))}`:'',d.notes?'\n'+d.notes:''].filter(x=>x!=='').join('\n')}
async function docSend(d,f){const box=$('#doc-send',f);
  if(!isOwnerCloud()){box.innerHTML=`<div class="insight"><b>Send</b><span>Create a free account (Settings) to send customers a link they can open${d.kind==='estimate'?' and approve':''}. For now, use <b>Copy as text</b> and paste it into a text or email.</span></div>`;return}
  box.innerHTML='<p class="note">Making the link…</p>';
  try{await shareDoc(d)}catch(e){box.innerHTML=`<p class="note neg">Couldn't make the link: ${esc(errMsg(e))}</p>`;return}
  if(d.status==='draft'){d.status='sent';d.sentAt=new Date().toISOString();save();shareDoc(d).catch(()=>{})}
  const url=shareUrl(d),co=S.profile?.company||'',first=(d.billTo?.name||'').split(' ')[0],t=docTotals(d);
  const msg=`Hi${first?' '+first:''}, here's your ${d.kind} from ${co||'us'} for ${money2(d.kind==='invoice'?Math.max(0,t.balance):t.total)}: ${url}${d.kind==='estimate'?' You can approve it right from that page.':''}`;
  const sms=smsLink(d.billTo?.phone,msg),mail=d.billTo?.email?`mailto:${encodeURIComponent(d.billTo.email)}?subject=${encodeURIComponent(`${docTitle(d)} from ${co}`)}&body=${encodeURIComponent(msg)}`:'';
  box.innerHTML=`<div class="insight good"><b>Link ready</b><span style="word-break:break-all">${esc(url)}</span></div>
    <div class="btns">${sms?`<a class="btn sm primary" href="${esc(sms)}">Text ${esc(first||'customer')}</a>`:''}${mail?`<a class="btn sm${sms?'':' primary'}" href="${esc(mail)}">Email</a>`:''}<button type="button" class="btn sm" id="copy-doc-link">Copy message</button></div>
    ${!sms&&!mail?'<p class="note">Add the customer\'s phone or email (Edit) to text or email it from here.</p>':''}`;
  $('#copy-doc-link',f).onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('Copied. Paste it in a text or email.')}catch(err){toast('Could not copy')}}}
function payForm(d){const t=docTotals(d);
  openForm({title:'Record payment · '+d.num,submit:'Save payment',
    body:`<div class="fields">${field('Amount',moneyInp('amount',Math.max(0,t.balance).toFixed(2),'required'))}${field('Date',inp('date',today(),'date'))}
      ${field('Method',`<select name="method">${['Check','Cash','Card','Bank transfer','Zelle / Venmo','Other'].map(v=>opt(v,v,'Check')).join('')}</select>`,'full')}</div>`,
    onSubmit:fd=>{const a=num(fd.get('amount'));if(!a){toast('Enter the amount paid');return false}
      (d.payments=d.payments||[]).push({id:uid(),amount:a,date:fd.get('date')||today(),method:fd.get('method')});save();if(d.token)shareDoc(d).catch(()=>{});
      toast(docStatus(d)==='paid'?d.num+' is paid in full':'Payment recorded');setTimeout(()=>docView(d),250)}})}

// Shared links: a snapshot of the document in shared_docs, readable only by its random token.
function docSnapshot(d){const j=job(d.jobId),p=S.profile||{};
  return{...d,token:undefined,payments:(d.payments||[]).map(x=>({amount:x.amount,date:x.date,ref:x.ref||undefined})),jobName:j?.name||'',jobAddress:j?.address||'',
    company:{company:p.company||'',name:p.name||'',logo:p.logo||'',address:p.address||'',phone:p.phone||'',email:p.email||'',website:p.website||'',license:p.license||''},accent:p.accent||'blue',st:docStatus(d)}}
async function shareDoc(d){if(!isOwnerCloud())throw new Error('Sign in first');
  if(!d.token){const r=crypto.getRandomValues(new Uint8Array(18));d.token=[...r].map(x=>x.toString(16).padStart(2,'0')).join('');save()}
  const row={token:d.token,company_id:CLOUD.company,doc_id:d.id,kind:d.kind,data:docSnapshot(d),updated_at:new Date().toISOString()};if(d.status==='approved'||d.status==='declined')row.status=d.status;
  const {error}=await CLOUD.sb.from('shared_docs').upsert(row);if(error)throw error}
async function unshareDoc(d){if(d.token&&isOwnerCloud())await CLOUD.sb.from('shared_docs').delete().eq('token',d.token).then(()=>{},()=>{})}
// Pick up customer approvals and views made on the shared page.
async function docsPull(){if(!isOwnerCloud())return false;await billingLoad().catch(()=>{});if(!S.docs.some(d=>d.token))return false;
  const {data,error}=await CLOUD.sb.from('shared_docs').select('token,status,approved_name,approved_at,viewed_at').eq('company_id',CLOUD.company);if(error||!data)return false;let ch=false;
  for(const r of data){const d=S.docs.find(x=>x.token===r.token);if(!d)continue;
    if(r.status==='approved'&&d.status!=='approved'&&d.kind==='estimate'){Object.assign(d,{status:'approved',approvedBy:r.approved_name||'',approvedAt:r.approved_at});ch=true;toast(`${r.approved_name||'Your customer'} approved ${d.num}`)}
    else if(r.status==='declined'&&d.status!=='declined'&&d.status!=='approved'){d.status='declined';ch=true;toast(`${d.num} was declined`)}
    else if(r.viewed_at&&d.status==='sent'){d.status='viewed';ch=true}}
  const pay=await CLOUD.sb.from('doc_payments').select('token,amount,stripe_session,paid_at').eq('company_id',CLOUD.company);
  if(!pay.error)for(const p of pay.data||[]){const d=S.docs.find(x=>x.token===p.token);if(!d||(d.payments||[]).some(x=>x.ref===p.stripe_session))continue;
    (d.payments=d.payments||[]).push({id:uid(),amount:+p.amount,date:String(p.paid_at).slice(0,10),method:'Card (online)',ref:p.stripe_session});ch=true;
    toast(`${d.billTo?.name||'A customer'} paid ${money2(+p.amount)} on ${d.num}`);shareDoc(d).catch(()=>{})}
  if(ch)save();return ch}
async function billingLoad(){if(!isOwnerCloud())return;const {data}=await CLOUD.sb.from('company_billing').select('stripe_account_id,charges_enabled,details_submitted').eq('company_id',CLOUD.company).maybeSingle();CLOUD.billing=data||null}
async function billingCall(action){const {data,error}=await CLOUD.sb.functions.invoke('payments',{body:{action}});
  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
function payCard(){if(!isOwnerCloud())return '';const b=CLOUD.billing,on=b?.charges_enabled;
  return `<div class="card stack"><h2>Card payments</h2>
    <p>${on?'<b>On.</b> Customers see a <b>Pay by card</b> button on every invoice link, and payments show up on the invoice by themselves.'
      :b?.stripe_account_id?'Your Stripe account is connected but not finished. Stripe needs a few more details before customers can pay.'
      :'Let customers pay invoices by card from the link you send. Money goes straight to your bank account through Stripe (about 2.9% + 30¢ per payment, charged by Stripe).'}</p>
    <div class="btns">${on?'':`<button class="btn primary" data-act="pay-connect">${b?.stripe_account_id?'Finish Stripe setup':'Connect Stripe'}</button>`}${b?.stripe_account_id?'<button class="btn" data-act="pay-status">Check status</button>':''}</div>
    <p class="note" id="pay-msg" hidden></p></div>`}
const docsCardPay=()=>isOwnerCloud()&&CLOUD.billing?.charges_enabled;

/* ----- Blue Board plan (subscriptions table, "billing" Edge Function) -----
   Plans are bought on the website only; the iPhone app shows status but no buy buttons (App Store rules).
   If the table can't be read (offline, or the SQL isn't installed yet), access is allowed. */
const PLANS={solo:{name:'Solo',price:29,crew:2,who:'Owner plus up to 2 crew'},crew:{name:'Crew',price:59,crew:10,who:'Owner plus up to 10 crew'},company:{name:'Company',price:119,crew:Infinity,who:'Unlimited crew'}};
const isNative=()=>!!window.Capacitor?.isNativePlatform?.();
const subDate=x=>new Date(x).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
function subSet(s){CLOUD.sub=s||null;LS.set('sub',s?JSON.stringify(s):null)}
async function subLoad(){if(!CLOUD.sb||!CLOUD.company)return;const {data,error}=await CLOUD.sb.from('subscriptions').select('*').eq('company_id',CLOUD.company).maybeSingle();
  if(error){let c=null;try{c=JSON.parse(LS.get('sub')||'null')}catch(e){}CLOUD.sub=c&&c.company_id===CLOUD.company?c:null;return}subSet(data)}
const subPaid=s=>!!s?.stripe_subscription_id&&['active','trialing','past_due'].includes(s.status);
function subAccess(){const s=CLOUD.sub;return !s||s.comp||subPaid(s)||new Date(s.trial_ends)>new Date()}
function trialDays(){const s=CLOUD.sub;if(!s||s.comp||s.stripe_subscription_id)return null;return Math.max(0,Math.ceil((new Date(s.trial_ends)-Date.now())/864e5))}
function crewLimit(){const s=CLOUD.sub;return !s||s.comp||!subPaid(s)||!PLANS[s.plan]?Infinity:PLANS[s.plan].crew}
const activeCrew=()=>S.employees.filter(e=>e.active!==false).length;
async function planCall(action,plan){const {data,error}=await CLOUD.sb.functions.invoke('billing',{body:{action,plan}});
  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
async function planSync(){try{const r=await planCall('sync');if(r?.sub)subSet(r.sub)}catch(e){}await subLoad();if(location.hash.startsWith('#/plan'))route()}
const dayWord=d=>d===1?'1 day':d+' days';
function trialBanner(page){const d=trialDays();if(!isOwnerCloud()||!d||isNative()||page==='plan')return '';
  return `<div class="insight ${d<=3?'warn':''}" style="margin-bottom:14px"><b>Free trial</b><span>${dayWord(d)} left. <a href="#/plan">Choose a plan</a></span></div>`}
function planLine(){const s=CLOUD.sub,d=trialDays();if(!s)return 'Your plan and billing.';if(s.comp)return 'Your company has free access.';
  if(subPaid(s))return `${PLANS[s.plan]?.name||'Your'} plan${s.status==='past_due'?': last payment didn\'t go through':''}.`;
  if(d)return `Free trial: ${dayWord(d)} left.`;return s.stripe_subscription_id?'Your plan has ended.':'Your free trial has ended.'}
function pagePlan(){const s=CLOUD.sub||{},d=trialDays(),paid=subPaid(s),cur=paid?s.plan:null,nat=isNative(),n=activeCrew(),P=PLANS[cur];let st;
  if(s.comp)st='<div class="insight good"><b>Free</b><span>Your company has free access to Blue Board.</span></div>';
  else if(paid&&s.status==='past_due')st=`<div class="insight warn"><b>Payment</b><span>Your last payment didn't go through.${nat?'':' Update your card below so your plan doesn\'t stop.'}</span></div>`;
  else if(paid)st=`<div class="insight good"><b>${esc(P?.name||'Plan')}</b><span>${P?money(P.price)+'/month. ':''}${s.current_period_end?(s.cancel_at_period_end?'Ends on ':s.status==='trialing'?'First charge on ':'Renews on ')+subDate(s.current_period_end)+'.':''}</span></div>`;
  else if(d)st=`<div class="insight"><b>Free trial</b><span>${dayWord(d)} left (ends ${subDate(s.trial_ends)}). Every feature is on, with no crew limit.${nat?'':' Pick a plan any time; you won\'t be charged until the trial ends.'}</span></div>`;
  else if(CLOUD.sub)st=`<div class="insight warn"><b>Paused</b><span>${s.stripe_subscription_id?'Your plan has ended.':'Your free trial has ended.'} ${nat?'Plans can\'t be bought in the app.':'Choose a plan to keep using Blue Board.'} Your jobs and data are safe.</span></div>`;
  else st='<p class="note">Your plan details couldn\'t be loaded. Check your connection.</p>';
  const cards=nat?'':`<div class="plan-grid">${Object.entries(PLANS).map(([k,p])=>`<div class="card stack plan-card ${k===cur?'on':''}"><h2>${p.name}</h2><div class="plan-price">${money(p.price)}<small>/month</small></div><p class="note">${p.who}</p>
    ${k===cur?'<button class="btn" disabled>Your plan</button>':`<button class="btn ${!cur&&k==='crew'?'primary':''}" data-act="plan-pick" data-v="${k}">${cur?'Switch to ':'Choose '}${p.name}</button>`}</div>`).join('')}</div>`;

async function offDecide(id,ok){const r=(CLOUD.timeReqs||[]).find(x=>x.id===id);if(!r)return;
  const {error}=await CLOUD.sb.from('time_off').update({status:ok?'approved':'denied',decided_at:new Date().toISOString()}).eq('id',id);if(error)return toast(errMsg(error));
  r.status=ok?'approved':'denied';if(ok&&!S.timeOff.some(t=>t.reqId===id))S.timeOff.push({id:uid(),reqId:id,empId:r.employee_id,from:r.start_date,to:r.end_date,note:r.reason||''});
  notify({employee_ids:[r.employee_id],title:ok?'Time off approved':'Time off denied',body:`${offRange({from:r.start_date,to:r.end_date})}`,hash:'#/schedule'});

/* ---------- time fixes: crew ask to correct a forgotten clock in/out, the owner approves ---------- */
// Rows live in the time_fixes table. Approving runs decide_time_fix(), which writes the punch;
// the matching shift is then updated here (or made by applyPunches) so payroll and job cost follow.
const hmOf=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fixRange=f=>`${fmtDate(ds(new Date(f.in_at)))}, ${timeOf(f.in_at)}–${timeOf(f.out_at)} · ${hrs((new Date(f.out_at)-new Date(f.in_at))/36e5)}`;
const FIX_ST={pending:['active','Waiting'],approved:['done','Approved'],denied:['bad','Denied']};
function fixCard(){const reqs=(CLOUD.fixReqs||[]).filter(r=>r.status==='pending');if(!reqs.length)return '';
  return `<div class="card"><div class="card-head"><h2>Time fixes</h2><span class="note">${reqs.length} waiting</span></div><ul class="list">${reqs.map(r=>{const e=emp(r.employee_id),p=r.punch_id&&CLOUD.punches.find(x=>x.id===r.punch_id);
    const was=r.punch_id?(p?`Clock showed ${timeOf(p.in_at)}–${p.out_at?timeOf(p.out_at):'still clocked in'}`:'Changes a clock-in'):'Didn\'t clock in at all';
    return `<li><span class="dot" style="background:${e?.color||'#999'}"></span><div class="grow"><b>${esc(e?.name||'Crew')} · ${esc(job(r.job_id)?.name||'Job')}</b>
      <small>Asks for ${fixRange(r)}</small><small class="muted">${was}${r.reason?' · '+esc(r.reason):''}</small></div>
      <div class="btns" style="flex-wrap:nowrap"><button class="btn sm primary" data-act="fix-ok" data-id="${r.id}">Approve</button><button class="btn sm ghost" data-act="fix-no" data-id="${r.id}">Deny</button></div></li>`}).join('')}</ul></div>`}
async function fixDecide(id,ok){const r=(CLOUD.fixReqs||[]).find(x=>x.id===id);if(!r)return;
  const date=ds(new Date(r.in_at)),old=r.punch_id?S.shifts.find(s=>s.punchId===r.punch_id):null;
  const wasOk=d=>!!payRec(periodOf(d)[0])?.approved?.[r.employee_id],had=ok&&(wasOk(date)||(old&&wasOk(old.date)));
  if(ok){const shut=closedFor(date)||(old&&closedFor(old.date));if(shut)return toast(`The ${fmtDate(shut.from)} – ${fmtDate(shut.to)} pay period is closed. Reopen it under Payroll first.`)}
  const {data,error}=await CLOUD.sb.rpc('decide_time_fix',{p_id:id,p_ok:ok});if(error)return toast(errMsg(error));
  r.status=ok?'approved':'denied';r.decided_at=new Date().toISOString();
  if(ok&&data?.id){CLOUD.punches=[data,...CLOUD.punches.filter(p=>p.id!==data.id)];
    if(old){payTouch(old.empId,old.date);Object.assign(old,{jobId:data.job_id,date:ds(new Date(data.in_at)),start:hmOf(data.in_at),end:hmOf(data.out_at),status:'worked',fixed:true});payTouch(old.empId,old.date)}
    else{applyPunches();const s=S.shifts.find(x=>x.punchId===data.id);if(s)s.fixed=true}}
  notify({employee_ids:[r.employee_id],title:ok?'Time fix approved':'Time fix denied',body:fixRange(r),hash:'#/pay'});
  save();route();toast(ok?(had?'Approved. Hours updated; approve their pay again.':'Approved. Hours updated.'):'Request denied')}

/* crew side */
function fixForm(punchId){const ps=CLOUD.punches.filter(p=>Date.now()-new Date(p.in_at)<21*864e5).slice(0,30),pend=new Set((CLOUD.myFixes||[]).filter(r=>r.status==='pending').map(r=>r.punch_id));
  const lab=p=>`${pd(ds(new Date(p.in_at))).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})} · ${job(p.job_id)?.name||'Job'} · ${timeOf(p.in_at)}–${p.out_at?timeOf(p.out_at):'still clocked in'}`;
  const jobs=S.jobs.filter(j=>j.status!=='done'||ps.some(p=>p.job_id===j.id));if(!jobs.length)return toast('No jobs yet. Ask your boss to add one.');
  const mine=S.shifts.find(s=>s.empId===CLOUD.employeeId&&s.date===today()&&s.status!=='missed');
  openForm({title:'Fix my time',submit:'Send to my boss',
    body:`<div class="fields">${field('Which shift?',`<select name="punch"><option value="">A shift I didn't clock in for</option>${ps.map(p=>`<option value="${p.id}"${p.id===punchId?' selected':''}${pend.has(p.id)?' disabled':''}>${esc(lab(p))}${pend.has(p.id)?' (fix sent)':''}</option>`).join('')}</select>`,'full')}
      ${field('Job',`<select name="jobId">${jobs.map(j=>opt(j.id,j.name,mine?.jobId)).join('')}</select>`)}${field('Date',inp('date',today(),'date'))}</div>
      <div class="fields pair">${field('Started',inp('start',mine?.start||'07:00','time'))}${field('Finished',inp('end',mine?.end||'15:30','time'))}</div>
      <p class="note" id="fx-hours"></p>
      ${field('What happened?',inp('reason','','text','placeholder="Forgot to clock out, phone died…" maxlength="300"'))}
      <p class="note">Your boss sees the clock times next to yours and approves or denies.</p>`,
    onOpen:f=>{const upd=()=>{const t=fixTimes(f.date.value,f.start.value,f.end.value);$('#fx-hours').textContent=t?`${hrs((t[1]-t[0])/36e5)}${ds(t[1])!==ds(t[0])?' · ends the next day':''}`:''};
      const fill=()=>{const p=ps.find(x=>x.id===f.punch.value);if(p){f.jobId.value=p.job_id;f.date.value=ds(new Date(p.in_at));f.start.value=hmOf(p.in_at);if(p.out_at)f.end.value=hmOf(p.out_at)}upd()};
      f.punch.addEventListener('change',fill);f.addEventListener('input',upd);fill()},
    onSubmit:async fd=>{const t=fixTimes(fd.get('date'),fd.get('start'),fd.get('end')),reason=fd.get('reason').trim();
      if(!t){toast('Fill in the date and both times');return false}
      if(t[1]-Date.now()>5*60000){toast('That finish time hasn\'t happened yet');return false}
      if(t[1]-t[0]>24*36e5){toast('That\'s more than 24 hours. Check the times.');return false}
      if(!reason){toast('Say what happened so your boss knows');return false}
      const row={company_id:CLOUD.company,user_id:CLOUD.user.id,employee_id:CLOUD.employeeId,punch_id:fd.get('punch')||null,job_id:fd.get('jobId'),in_at:t[0].toISOString(),out_at:t[1].toISOString(),reason};
      const {error}=await CLOUD.sb.from('time_fixes').insert(row);
      if(error){toast(/time_fixes/.test(error.message||'')?'Time fixes aren\'t turned on yet. Ask your boss.':'Could not send: '+errMsg(error));return false}
      notify({to:'owner',email:true,title:'Time fix request',body:`${emp(CLOUD.employeeId)?.name||'Crew'}: ${fixRange(row)}`,hash:'#/crew'});await empExtrasLoad();route();toast('Sent to your boss')}})}
function fixTimes(date,start,end){if(!date||!start||!end)return null;const a=new Date(`${date}T${start}`),b=new Date(`${date}T${end}`);if(isNaN(a)||isNaN(b))return null;if(b<=a)b.setDate(b.getDate()+1);return [a,b]}

/* ---------- customers ---------- */
// Customers are kept in S.customers and linked from jobs (j.customerId). Jobs made before this existed
// get a customer created from their client name the first time customers are needed.
const normName=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const cust=id=>S.customers.find(c=>c.id===id);
function custSync(){let ch=false;
  for(const j of S.jobs){if(j.customerId&&cust(j.customerId))continue;const n=normName(j.client);if(!n)continue;
    let c=S.customers.find(x=>normName(x.name)===n);
    if(!c){c={id:uid(),name:j.client.trim(),phone:j.phone||'',email:'',address:j.address||'',notes:''};S.customers.push(c)}
    j.customerId=c.id;ch=true}
  if(ch&&!isEmp())save();return ch}
function custStats(c){const jobs=S.jobs.filter(j=>j.customerId===c.id),ids=new Set(jobs.map(j=>j.id)),docs=S.docs.filter(d=>ids.has(d.jobId)||d.customerId===c.id);
  const inv=docs.filter(d=>d.kind==='invoice'&&d.status!=='draft');
  return{jobs,docs,billed:sum(inv,d=>docTotals(d).total),paid:sum(inv,d=>docTotals(d).paid),owed:sum(inv,d=>Math.max(0,docTotals(d).balance)),
    last:jobs.map(j=>j.start||'').sort().pop()||''}}
function pageCustomers(){custSync();const q=normName(UI.custQ);
  const list=S.customers.map(c=>({c,s:custStats(c)})).filter(({c})=>!q||[c.name,c.phone,c.email,c.address].some(v=>normName(v).includes(q)))
    .sort((a,b)=>(b.s.owed>0)-(a.s.owed>0)||(b.s.last||'').localeCompare(a.s.last||'')||a.c.name.localeCompare(b.c.name));
  const owed=sum(S.customers,c=>custStats(c).owed);
  return `<div class="page-head"><div><h1>Customers</h1><p class="sub">${S.customers.length} customer${S.customers.length===1?'':'s'}${owed>0.005?` · ${money2(owed)} owed to you`:''}</p></div><div class="btns">${typeof portalInviteForm==='function'?'<button class="btn" data-act="cust-invite">Invite a customer</button>':''}<button class="btn primary" data-act="cust-new">+ Add customer</button></div></div>
  <div class="card stack"><input id="cust-q" placeholder="Search name, phone, email, address" value="${esc(UI.custQ||'')}" autocomplete="off">

      :emptyBox(S.customers.length?'No customers match that search.':'Customers are added automatically from your jobs, or add one here.')}</div>`}
function pageCustomer(id){custSync();const c=cust(id);if(!c)return emptyBox('That customer was not found.','<a class="btn" href="#/customers">Back to customers</a>');
  const s=custStats(c),L=laborCalc();const sms=smsLink(c.phone,'');

    <div class="btns">${sms?`<a class="btn" href="sms:${esc(c.phone.replace(/[^\d+]/g,''))}">Text</a>`:''}<button class="btn" data-act="cust-edit" data-id="${c.id}">Edit</button><button class="btn primary" data-act="cust-job" data-id="${c.id}">+ New job</button></div></div>
  <div class="stack"><div class="kpis"><div class="kpi lead"><span>Billed</span><b>${money(s.billed)}</b><small>${s.docs.filter(d=>d.kind==='invoice').length} invoices</small></div>
    <div class="kpi"><span>Paid</span><b>${money(s.paid)}</b><small>&nbsp;</small></div><div class="kpi"><span>Owed</span><b class="${s.owed>0.005?'neg':''}">${money2(s.owed)}</b><small>&nbsp;</small></div>
    <div class="kpi"><span>Jobs</span><b>${s.jobs.length}</b><small>${s.jobs.filter(j=>j.status==='active').length} active</small></div></div>
  <div class="grid2"><div class="card"><div class="card-head"><h2>Jobs</h2></div>
      ${s.jobs.length?`<ul class="list">${s.jobs.sort((a,b)=>(b.start||'').localeCompare(a.start||'')).map(j=>{const st=jobStats(j,L);return `<li class="click" data-href="#/job/${j.id}"><div class="grow"><b>${esc(j.name)}</b><small>${j.start?fmtDateY(j.start):''}${j.address?' · '+esc(j.address):''}</small></div>${statusBadge(j.status)}<b class="num">${money(st.rev)}</b></li>`}).join('')}</ul>`:'<p class="note">No jobs yet.</p>'}</div>
    <div class="stack"><div class="card"><div class="card-head"><h2>Estimates &amp; invoices</h2></div>

    ${c.notes?`<div class="card"><h2>Notes</h2><p style="white-space:pre-line;margin:6px 0 0">${esc(c.notes)}</p></div>`:''}</div></div></div>`}
function custForm(c){const isNew=!c;c=c||{};
  openForm({title:isNew?'Add customer':'Edit customer',

    onSubmit:fd=>{const name=fd.get('name').trim();if(!name){toast('Enter a name');return false}
