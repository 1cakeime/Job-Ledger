<!-- Supabase -> Authentication -> Emails -> Templates -> "Confirm signup".
     Subject: Confirm your Blue Board account -->
<div style="background:#F4F6FF;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#10142B">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;padding:32px 28px">
